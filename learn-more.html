<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CARL — Learn More</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Jost:wght@300;400;500;600&family=Spectral:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #0f1c2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.5rem;
      font-family: 'Spectral', Georgia, serif;
      text-align: center;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
      opacity: 0.35;
    }

    .wrapper {
      position: relative;
      z-index: 1;
      max-width: 560px;
    }

    .wordmark {
      font-family: 'Cormorant Garamond', serif;
      font-size: 3rem;
      font-weight: 300;
      letter-spacing: 0.55em;
      color: #ffffff;
      margin-bottom: 0.5rem;
    }

    .rule {
      width: 40px;
      height: 1px;
      background: #b8943a;
      margin: 1rem auto 1.25rem;
    }

    .subtitle {
      font-family: 'Jost', sans-serif;
      font-size: 0.62rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #b8943a;
      margin-bottom: 4rem;
    }

    .coming-label {
      font-family: 'Jost', sans-serif;
      font-size: 0.62rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: rgba(184,148,58,0.5);
      margin-bottom: 1.5rem;
    }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 300;
      color: #ffffff;
      line-height: 1.2;
      margin-bottom: 1.5rem;
    }

    p {
      font-size: 1rem;
      color: #8a8070;
      line-height: 1.8;
      font-style: italic;
      margin-bottom: 3rem;
    }

    .btn-back {
      display: inline-block;
      font-family: 'Jost', sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #162032;
      background: #b8943a;
      padding: 0.9rem 2.25rem;
      text-decoration: none;
      transition: background 0.2s;
    }

    .btn-back:hover { background: #d4ad5a; }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="wordmark">CARL</div>
    <div class="rule"></div>
    <p class="subtitle">Compliance Assistance and Regulatory Liaison</p>

    <p class="coming-label">Coming Soon</p>
    <h1>More detail is on the way.</h1>
    <p>This page is under development. Return to the main site to learn about CARL's capabilities, or access the system directly.</p>

    <a href="index.html" class="btn-back">&larr; Return to Main Site</a>
  </div>
</body>
</html>
