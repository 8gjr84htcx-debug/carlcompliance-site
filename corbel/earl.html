<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EARL – Economic Analysis and Recommendation Ledger</title>
<script id="ms-core">window.MS_TOOL='earl';
/* Corbel shared project record. Inlined into each tool; runs before the tool's own script. */
(function(){
'use strict';
const TOOL=window.MS_TOOL||'';
const PKEY={nora:'nora_project',earl:'earl_project',piper:'piper_project',sophie:'sophie_project',record:'milcon_record',paula:'paula_project'};
const PER=['nora','earl','piper','sophie','record'];
const ls=window.localStorage;const orig=Storage.prototype.setItem;
const today=()=>new Date().toLocaleDateString('en-CA');
const uid=()=>Math.random().toString(36).slice(2,10);
function get(k){try{return JSON.parse(ls.getItem(k)||'null');}catch(e){return null;}}
function raw(k,v){orig.call(ls,k,v);}
function loadStore(){const s=get('milcon_store');return s&&s.projects?s:{schema:'milcon-store-1',active:'',projects:{}};}
let full=false;
function saveStore(s){try{raw('milcon_store',JSON.stringify(s));full=false;}catch(e){full=true;note('Browser storage is full. Use “Export all” to keep a copy, then delete old projects.');}}
function fill(base,obj){if(obj==null) return obj;for(const k of Object.keys(base)){if(obj[k]===undefined) obj[k]=base[k];else if(base[k]&&typeof base[k]==='object'&&!Array.isArray(base[k])&&obj[k]&&typeof obj[k]==='object'&&!Array.isArray(obj[k])) fill(base[k],obj[k]);}return obj;}
window.MSfill=fill;

// ---- field maps: what each tool shares with the record ----
const SVC={army:'Army',navy:'Navy',usmc:'Marine Corps',af:'Air Force',ussf:'Space Force',dha:'DHA',def_agency:'Defense-Wide',joint:'Joint'};
const LOC={us_hawaii:'Hawaii',us_alaska:'Alaska',guam:'Guam',cnmi:'CNMI',american_samoa:'American Samoa',wake:'Wake Island',japan:'Japan',korea:'Korea',australia:'Australia',philippines:'Philippines',palau:'Palau',fsm:'FSM',marshall_islands:'Marshall Islands',papua_new_guinea:'Papua New Guinea',singapore:'Singapore'};
const inv=o=>Object.fromEntries(Object.entries(o).map(([k,v])=>[v,k]));
const PIPER_SVC={'DHA':'Defense Health Agency','Defense Health Agency':'Defense Health Agency'};
const has=v=>v!==undefined&&v!==null&&String(v).trim()!=='';
const set=(o,k,v)=>{if(has(v)) o[k]=v;};
const MAP={
 nora:{skel:()=>({schema:'nora-1',project:{}}),
  get:s=>({name:s.project?.name,installation:s.project?.installation,service:SVC[s.project?.service],country:LOC[s.project?.location],need_date:s.project?.need_date,_ev:{'Requirement validated':s.validation?.service_date||s.validation?.installation_date||''}}),
  put:(s,c)=>{s.project=s.project||{};set(s.project,'name',c.name);set(s.project,'installation',c.installation);if(inv(SVC)[c.service]) s.project.service=inv(SVC)[c.service];if(inv(LOC)[c.country]) s.project.location=inv(LOC)[c.country];set(s.project,'need_date',c.need_date);}},
 earl:{skel:()=>({schema:'earl-1',project:{}}),
  get:s=>({name:s.project?.name,installation:s.project?.installation,service:s.project?.service,_ev:{'Economic analysis approved':s.recommend?.decision==='approved'?(s.recommend.date||today()):''}}),
  put:(s,c)=>{s.project=s.project||{};set(s.project,'name',c.name);set(s.project,'installation',c.installation);set(s.project,'service',c.service);}},
 piper:{skel:()=>({schema:'piper-1',b:{},ex:{}}),
  get:s=>({name:s.b?.title,installation:s.b?.installation,number:s.b?.project_no,fy:s.b?.fy,catcode:s.b?.catcode,service:s.b?.component==='Defense Health Agency'?'DHA':s.b?.component,authorized:s.ex?.auth,cwe:s.ex?.cwe,_ev:{'1391 validated':(s.versions||[]).length?'':''}}),
  put:(s,c)=>{s.b=s.b||{};s.ex=s.ex||{};set(s.b,'title',c.name);set(s.b,'installation',c.installation);set(s.b,'project_no',c.number);set(s.b,'fy',c.fy);set(s.b,'catcode',c.catcode);if(has(c.service)) s.b.component=PIPER_SVC[c.service]||c.service;set(s.ex,'auth',c.authorized);set(s.ex,'cwe',c.cwe);}},
 sophie:{skel:()=>({schema:'sophie-1',p:{}}),
  get:s=>({name:s.p?.title,installation:s.p?.installation,to:s.p?.contract,buildings:s.p?.buildings,_ev:{'SOW final':(s.sections||[]).length&&s.sections.every(x=>x.status==='final')?'@today':''}}),
  put:(s,c)=>{s.p=s.p||{};set(s.p,'title',c.name);set(s.p,'installation',c.installation);set(s.p,'contract',c.to);set(s.p,'buildings',c.buildings);}},
 record:{skel:()=>null,get:r=>({programmed:r?.piper?.rounded||undefined}),put:()=>{}}};
const PAULA_F=['name','number','to','service','installation','country','fy','pm','programmed','authorized','award','cwe','obligated','expended','ntp','baseline_finish','forecast_finish','pct'];
function mergeCore(core,o){if(!o) return false;let ch=false;for(const [k,v] of Object.entries(o)){if(k==='_ev') continue;if(has(v)&&String(core[k]??'')!==String(v)){core[k]=v;ch=true;}}
 core.events=core.events||{};for(const [k,v] of Object.entries(o._ev||{})){if(v==='@today'){if(!core.events[k]){core.events[k]=today();ch=true;}}else if(has(v)&&core.events[k]!==v){core.events[k]=v;ch=true;}}return ch;}

// ---- startup: put the active project's state where the tool expects it ----
let S=loadStore();
if(!Object.keys(S.projects).length&&PER.some(t=>ls.getItem(PKEY[t]))){const id=uid();const p={id,core:{},tools:{},created:today()};PER.forEach(t=>{const v=get(PKEY[t]);if(v){p.tools[t]=v;mergeCore(p.core,MAP[t].get(v));}});p.core.name=p.core.name||'Project 1';S.projects[id]=p;S.active=id;saveStore(S);}
if(PER.includes(TOOL)){
 if(!S.active||!S.projects[S.active]){const first=Object.keys(S.projects)[0];if(first) S.active=first;else{const id=uid();S.projects[id]={id,core:{name:'New project'},tools:{},created:today()};S.active=id;}saveStore(S);}
 const P=S.projects[S.active];
 PER.forEach(t=>{let v=P.tools[t];if(!v&&t===TOOL) v=MAP[t].skel();if(v){if(t!=='record') MAP[t].put(v,P.core);raw(PKEY[t],JSON.stringify(v));}else ls.removeItem(PKEY[t]);});
}
if(TOOL==='paula') paulaIn();

// ---- every save flows back into the record ----
Storage.prototype.setItem=function(k,v){orig.call(this,k,v);if(this!==ls) return;try{onWrite(k,v);}catch(e){console.warn('Corbel record',e);}};
function onWrite(k,v){const t=Object.keys(PKEY).find(x=>PKEY[x]===k);if(!t) return;const St=loadStore();
 if(t==='paula'){paulaOut(St,JSON.parse(v));return;}
 if(!PER.includes(TOOL)) return;const P=St.projects[St.active];if(!P) return;const val=JSON.parse(v);P.tools[t]=val;mergeCore(P.core,MAP[t].get(val));P.updated=new Date().toISOString();saveStore(St);S=St;refresh();}

// ---- PAULA: one PAULA project per record project, same id ----
function paulaIn(){let pa=get('paula_project');if(!pa) pa={schema:'paula-1',created:new Date().toISOString(),projects:[],t:{},me:'',log:[]};let ch=false;
 for(const [id,p] of Object.entries(S.projects)){let pp=pa.projects.find(x=>x.id===id);if(!pp){pp={id,phase:1,risks:[],milestones:[],updates:[],override:{level:'',reason:''}};pa.projects.push(pp);ch=true;}
  PAULA_F.forEach(f=>{if(has(p.core[f])&&String(pp[f]??'')!==String(p.core[f])){pp[f]=p.core[f];ch=true;}});
  const ph={'Requirement validated':2,'Economic analysis approved':3,'1391 validated':4,'SOW final':6};
  for(const [n,d] of Object.entries(p.core.events||{})){if(!d) continue;let m=(pp.milestones||[]).find(x=>x.name===n);if(!m){m={id:uid(),name:n,baseline:'',forecast:'',actual:''};pp.milestones=(pp.milestones||[]).concat([m]);ch=true;}if(!m.actual){m.actual=d;ch=true;}if(ph[n]&&Number(pp.phase||1)<ph[n]){pp.phase=ph[n];ch=true;}}}
 if(ch) raw('paula_project',JSON.stringify(pa));}
function paulaOut(St,pa){let ch=false;(pa.projects||[]).forEach(pp=>{if(pp.sample) return;let p=St.projects[pp.id];if(!p){if(!has(pp.name)) return;p=St.projects[pp.id]={id:pp.id,core:{},tools:{},created:today()};ch=true;}
  const o={};PAULA_F.forEach(f=>o[f]=pp[f]);if(mergeCore(p.core,o)) ch=true;});if(ch) saveStore(St);}

// ---- public helpers ----
window.MS={store:()=>loadStore(),active:()=>{const s=loadStore();return s.projects[s.active]||null;},has:id=>!!loadStore().projects[id],
 openIn:(id,tool)=>{const s=loadStore();if(!s.projects[id]) return;flush(s);s.active=id;saveStore(s);location.href=tool+'.html';},
 tos:()=>[...new Set(Object.values(loadStore().projects).map(p=>p.core.to).filter(has))].sort()};
function flush(s){const P=s.projects[s.active];if(!P||!PER.includes(TOOL)) return;PER.forEach(t=>{const v=get(PKEY[t]);if(v){P.tools[t]=v;mergeCore(P.core,MAP[t].get(v));}});}
function sw(id){const s=loadStore();flush(s);s.active=id;saveStore(s);location.reload();}
function dl(name,data){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>a.remove(),300);}
function note(t){const n=document.getElementById('msnote');if(n) n.textContent=t;}

// ---- project bar ----
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function bar(){if(!PER.includes(TOOL)) return;const h=document.querySelector('header');if(!h) return;const d=document.createElement('div');d.id='msbar';
 d.style.cssText='display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:7px 28px;background:#1F5566;color:#fff;font:13px "Segoe UI",system-ui,sans-serif';h.after(d);refresh();}
function refresh(){const d=document.getElementById('msbar');if(!d) return;const s=loadStore();const P=s.projects[s.active];const c=P?P.core:{};
 const ids=Object.keys(s.projects).sort((a,b)=>(s.projects[a].core.name||'').localeCompare(s.projects[b].core.name||''));
 d.innerHTML='<span style="opacity:.8">Project<\/span><select id="mssel" style="width:auto;max-width:340px;font-size:13px;padding:3px 6px;border-radius:5px">'+ids.map(id=>'<option value="'+id+'" '+(id===s.active?'selected':'')+'>'+esc(s.projects[id].core.name||'(untitled)')+'<\/option>').join('')+'<\/select>'+
 '<button id="msnew" style="font-size:12.5px;padding:3px 10px;background:transparent;color:#fff;border-color:rgba(255,255,255,.4)">New project<\/button>'+
 '<span style="opacity:.85;flex:1;min-width:200px">'+esc([c.number,c.to,c.installation,c.service,c.fy?'FY'+c.fy:''].filter(has).join(' · ')||'Shared record: title, installation, task order and amounts are entered once and used by every tool')+'<\/span>'+
 '<span id="msnote" style="color:#F2B632"><\/span>'+
 '<button id="msmore" style="font-size:12.5px;padding:3px 10px;background:transparent;color:#fff;border-color:rgba(255,255,255,.4)">Projects…<\/button>';
 d.querySelector('#mssel').onchange=e=>sw(e.target.value);
 d.querySelector('#msnew').onclick=()=>{const n=prompt('Name of the new project');if(!n) return;const s2=loadStore();flush(s2);const id=uid();s2.projects[id]={id,core:{name:n.trim()},tools:{},created:today()};s2.active=id;saveStore(s2);location.reload();};
 d.querySelector('#msmore').onclick=manage;}
function manage(){const s=loadStore();const dlg=document.createElement('dialog');dlg.style.cssText='border:none;border-radius:12px;padding:0;max-width:760px;width:94vw';
 const rows=Object.values(s.projects).sort((a,b)=>(a.core.name||'').localeCompare(b.core.name||''));
 dlg.innerHTML='<div style="padding:20px 22px;font:14px \'Segoe UI\',system-ui,sans-serif;color:#10303F"><h2 style="margin:0 0 4px;font:600 20px Bahnschrift,Segoe UI,sans-serif">Projects<\/h2><p style="margin:0 0 12px;color:#4f6873;font-size:13.5px">Every project lives in this browser’s shared record. Each tool keeps its own work for each project. Export everything to move to another computer or to keep a backup.<\/p>'+
 '<table style="width:100%;border-collapse:collapse;font-size:13px"><tr><th style="text-align:left;padding:6px">Project<\/th><th style="text-align:left">Task order<\/th><th style="text-align:left">Tools used<\/th><th><\/th><\/tr>'+rows.map(p=>'<tr style="border-top:1px solid #c9d6d3"><td style="padding:6px">'+esc(p.core.name||'(untitled)')+(p.id===s.active?' <b>(open)<\/b>':'')+'<\/td><td>'+esc(p.core.to||'')+'<\/td><td>'+esc(Object.keys(p.tools).filter(t=>t!=='record').map(t=>t.toUpperCase()).join(', ')||'–')+'<\/td><td style="white-space:nowrap"><button data-ren="'+p.id+'">Rename<\/button> '+(p.id!==s.active?'<button data-del="'+p.id+'">Delete<\/button>':'')+'<\/td><\/tr>').join('')+'<\/table>'+
 '<div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap"><button id="msexp">Export all<\/button><button id="msimp">Import…<\/button><input type="file" id="msf" accept=".json" hidden><span style="flex:1"><\/span><button id="mscl">Close<\/button><\/div><\/div>';
 document.body.appendChild(dlg);dlg.showModal();const close=()=>{dlg.close();dlg.remove();};
 dlg.querySelector('#mscl').onclick=close;
 dlg.querySelectorAll('[data-ren]').forEach(b=>b.onclick=()=>{const s2=loadStore();flush(s2);const p=s2.projects[b.dataset.ren];const n=prompt('Project name',p.core.name||'');if(!n) return;p.core.name=n.trim();saveStore(s2);location.reload();});
 dlg.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const s2=loadStore();const p=s2.projects[b.dataset.del];if(!confirm('Delete “'+(p.core.name||'project')+'” and everything every tool holds for it? This cannot be undone. Export first if you need a copy.')) return;delete s2.projects[p.id];saveStore(s2);close();manage();});
 dlg.querySelector('#msexp').onclick=()=>{const s2=loadStore();flush(s2);saveStore(s2);const all={schema:'milcon-backup-1',exported:new Date().toISOString(),store:s2,irma:get('irma_project'),quinn:get('quinn_project'),paula:get('paula_project')};dl('Corbel_all_projects_'+today()+'.json',JSON.stringify(all));};
 dlg.querySelector('#msimp').onclick=()=>dlg.querySelector('#msf').click();
 dlg.querySelector('#msf').onchange=e=>{const f=e.target.files[0];if(!f) return;f.text().then(t=>{try{const j=JSON.parse(t);if(j.schema!=='milcon-backup-1') throw new Error('Not a Corbel backup file');if(!confirm('Replace everything in this browser with the backup from '+(j.exported||'').slice(0,10)+'?')) return;raw('milcon_store',JSON.stringify(j.store));['irma','quinn','paula'].forEach(k=>{if(j[k]) raw(k+'_project',JSON.stringify(j[k]));});const a=j.store.projects[j.store.active];PER.forEach(t=>{const v=a&&a.tools[t];if(v) raw(PKEY[t],JSON.stringify(v));else ls.removeItem(PKEY[t]);});location.reload();}catch(err){alert('Could not import: '+err.message);}});};}

// ---- task order suggestions in IRMA and QUINN ----
function toList(){if(TOOL!=='irma'&&TOOL!=='quinn') return;const dl2=document.createElement('datalist');dl2.id='ms-to';dl2.innerHTML=window.MS.tos().map(t=>'<option value="'+esc(t)+'">').join('');document.body.appendChild(dl2);
 const tag=()=>document.querySelectorAll('input[data-k="to"]:not([list])').forEach(i=>i.setAttribute('list','ms-to'));new MutationObserver(tag).observe(document.body,{childList:true,subtree:true});tag();}
document.addEventListener('DOMContentLoaded',()=>{bar();toList();});
})();
</script>

<style>

:root{--paper:#E9F0EE;--ink:#10303F;--depth:#1F5566;--shoal:#7FB7B2;--buoy:#F2B632;--line:#c9d6d3;--card:#fff;--mute:#4f6873;--ok:#1e6b45;--okbg:#e1f1e8;--warn:#8a5a00;--warnbg:#fdf1d6;--bad:#9b2c2c;--badbg:#f8e3e3}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 "Segoe UI",system-ui,sans-serif;color:var(--ink);background:var(--paper)}
a{color:var(--depth)}
header{display:flex;align-items:center;gap:18px;padding:14px 28px;background:var(--ink);color:#fff;flex-wrap:wrap}
header .home{color:var(--shoal);text-decoration:none;font-size:14px}
header h1{margin:0;font:600 22px/1.1 Bahnschrift,"DIN Alternate","Segoe UI",sans-serif;letter-spacing:.01em}
header .sp{flex:1}
header .saved{font-size:12.5px;color:var(--shoal)}
button{font:inherit;font-size:14px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:7px 14px;border-radius:6px;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--buoy);outline-offset:1px}
button.go{background:var(--depth);border-color:var(--depth);color:#fff}
button.go:disabled{opacity:.5;cursor:default}
button.sm{font-size:12.5px;padding:3px 9px}
button.link{border:none;background:none;color:var(--depth);padding:2px 4px;text-decoration:underline}
header button{background:transparent;color:#fff;border-color:rgba(255,255,255,.35)}
.wrap{max-width:1320px;margin:0 auto;padding:22px 28px 60px;display:grid;grid-template-columns:230px minmax(0,1fr);gap:22px}
@media(max-width:900px){.wrap{grid-template-columns:1fr}}
nav.steps{position:sticky;top:16px;align-self:start;display:grid;gap:4px}
nav.steps button{text-align:left;border:1px solid transparent;background:transparent;padding:9px 12px;display:flex;gap:10px;align-items:center;border-radius:8px}
nav.steps button .n{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--shoal);display:grid;place-items:center;font-size:12px;flex:none;color:var(--depth)}
nav.steps button.on{background:#fff;border-color:var(--line);font-weight:600}
nav.steps button.on .n{background:var(--depth);border-color:var(--depth);color:#fff}
nav.steps button .c{margin-left:auto;font-size:12px;color:var(--mute);font-weight:400}
nav.steps .gate{margin-top:10px;font-size:12.5px;color:var(--mute);padding:10px 12px;border-top:1px solid var(--line)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px 22px;margin-bottom:18px}
h2{font:600 21px/1.2 Bahnschrift,"Segoe UI",sans-serif;margin:0 0 4px}
h3{font:600 16px/1.2 Bahnschrift,"Segoe UI",sans-serif;margin:18px 0 8px;color:var(--depth)}
.lead{color:var(--mute);margin:0 0 14px;font-size:14px;max-width:78ch}
.mentor{font-size:13.5px;background:#f3f8f7;border-left:3px solid var(--shoal);padding:9px 12px;border-radius:4px;margin:0 0 14px;max-width:90ch}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px 14px}
.form .wide{grid-column:1/-1}
label.f{font-size:12.5px;color:var(--mute);display:block;margin-bottom:2px}
input,select,textarea{width:100%;font:inherit;font-size:14px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}
textarea{min-height:70px;resize:vertical;line-height:1.45}
textarea.tall{min-height:200px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--mute);font-weight:600;white-space:nowrap}
td input,td select,td textarea{font-size:13px;padding:4px 6px}
td textarea{min-height:44px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.pill{font-size:11.5px;border-radius:10px;padding:1px 8px;border:1px solid var(--line);color:var(--mute);white-space:nowrap;display:inline-block;margin:1px 2px 1px 0}
.pill.ok{background:var(--okbg);border-color:#b9dcc8;color:var(--ok)}
.pill.warn{background:var(--warnbg);border-color:#ecd59a;color:var(--warn)}
.pill.bad{background:var(--badbg);border-color:#e6bcbc;color:var(--bad)}
.small{font-size:12.5px;color:var(--mute)}
.empty{color:var(--mute);padding:22px 8px;text-align:center;font-size:14px}
.card{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:10px 0;background:#fff}
.card.withdrawn{opacity:.55}
.card .hd{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.card .id{font:600 14px Bahnschrift,"Segoe UI",sans-serif;color:var(--depth)}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px 10px}
@media(max-width:1000px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.flags{margin-top:6px}
q.ev{background:#fff6d8;font-size:12.5px;color:var(--mute);quotes:"\201C" "\201D"}
.check li{margin:4px 0;list-style:none}
.check{padding-left:0}
.check .y::before{content:"\2713";color:var(--ok);font-weight:700;margin-right:8px}
.check .n::before{content:"\25CB";color:var(--warn);margin-right:8px}
.quad{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.quad div{border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:70px;font-size:13px}
.quad b{display:block;font-size:12px;color:var(--mute);font-weight:600;margin-bottom:3px}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:1000px){.cols2{grid-template-columns:1fr}}
.qbank li{margin:5px 0;font-size:13.5px}
.engines{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.eng{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:14px;padding:3px 10px;font-size:12.5px}
.dot{width:9px;height:9px;border-radius:50%;background:#c4cfcc}
.dot.ok{background:var(--ok)}.dot.run{background:var(--buoy)}.dot.err{background:var(--bad)}
dialog{border:none;border-radius:12px;padding:0;max-width:760px;width:94vw;box-shadow:0 20px 60px rgba(16,48,63,.35)}
dialog::backdrop{background:rgba(16,48,63,.45)}
.dlg{padding:20px 22px}
.slot{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:12px 0}
.slot h4{margin:0 0 8px;font:600 15px Bahnschrift,"Segoe UI",sans-serif}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}
.grid2 label{font-size:12.5px;color:var(--mute)}
.foot{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.score{font-weight:700;padding:1px 7px;border-radius:5px}
.s-hi{background:var(--badbg);color:var(--bad)}.s-md{background:var(--warnbg);color:var(--warn)}.s-lo{background:var(--okbg);color:var(--ok)}
.outs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.outs .card h4{margin:0 0 4px;font:600 15px Bahnschrift,"Segoe UI",sans-serif}
.outs .card p{margin:0 0 10px;font-size:13px;color:var(--mute)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{header,nav.steps{display:none}.wrap{display:block}}

.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.num input{text-align:right}
.matrix td,.matrix th{text-align:center}
.matrix td:first-child,.matrix th:first-child{text-align:left}
.matrix select{width:auto}
.lead-alt{background:var(--okbg)}
.out-alt{opacity:.55}
.bar{height:16px;background:var(--depth);border-radius:3px}
.bar.lo{background:var(--ok)}
.chart{display:grid;grid-template-columns:200px 1fr 120px;gap:6px 10px;align-items:center;font-size:13.5px}
.big{font:600 26px Bahnschrift,"Segoe UI",sans-serif;color:var(--depth)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin:10px 0}
.kpis .card{margin:0}
.kpis .small{display:block}
.find.warn{background:var(--warnbg);border:1px solid #ecd59a;border-left:3px solid var(--warn);color:var(--ink,#1b2b33);padding:9px 12px;border-radius:4px;margin:0 0 12px;font-size:13.5px}
</style>
</head>

on Gas Distribution Line","LF",70.06,0.12],["8931","Utility Tunnel","LF",805.06,1.04],["8932","Utility Channels","LF",533.34,0.24],["8951","Miscellaneous Storage Tank and Basin","GA",2.25,0.02],["9110","Land","AC",null,null],["9900","Land Rights","AC",null,null]],"om":[[2024,1.0],[2025,1.024],[2026,1.0495999999999999],[2027,1.0716415999999997],[2028,1.0930744319999999],[2029,1.1149359206399998],[2030,1.1372346390527999],[2031,1.1599793318338558]]}</script>
<script>
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const today=()=>new Date().toLocaleDateString('en-CA');
const $$=(n,d=0)=>(n<0?'-':'')+'$'+Math.abs(n).toLocaleString('en-US',{maximumFractionDigits:d,minimumFractionDigits:d});
const $k=n=>{const a=Math.abs(n);return (n<0?'-':'')+(a>=1e9?'$'+(a/1e9).toFixed(2)+'B':a>=1e6?'$'+(a/1e6).toFixed(2)+'M':a>=1e3?'$'+(a/1e3).toFixed(0)+'K':'$'+a.toFixed(0));};

// OMB Circular A-94 Appendix C, revised March 6, 2026, valid calendar year 2026
const APPC={edition:'OMB Circular A-94 Appendix C, revised March 6, 2026 (calendar year 2026)',url:'https://www.whitehouse.gov/wp-content/uploads/2026/03/CircularA-94Appendix-C.pdf',
 terms:[3,5,7,10,20,30],real:[1.1,1.3,1.4,1.6,2.0,2.0],nominal:[3.4,3.5,3.6,3.7,4.0,4.1]};
function appcRate(years,kind){const T=APPC.terms,R=APPC[kind];if(years<=T[0]) return R[0];if(years>=30) return R[R.length-1];
 for(let i=0;i<T.length-1;i++) if(years>=T[i]&&years<=T[i+1]) return R[i]+(R[i+1]-R[i])*(years-T[i])/(T[i+1]-T[i]);return R[R.length-1];}

const ATYPES={status_quo:'Status quo (baseline)',renovate:'Renovate or modernize existing',convert:'Convert another existing facility',new:'New construction',addition:'Addition to existing',lease:'Lease',joint:'Joint use or other installation',host_nation:'Host-nation funded or provided',other:'Other'};
const CATS={design:['Design and planning',false],construction:['Construction',false],sioh:['Supervision, inspection and overhead (SIOH)',false],contingency:['Contingency',false],equipment:['Equipment and furnishings',false],demolition:['Demolition',false],land:['Land acquisition',false],relocation:['Relocation and moving',false],om:['Operations and maintenance',true],srm:['Sustainment and repair',true],utilities:['Utilities and energy',true],personnel:['Personnel',true],lease:['Lease payments',true],mission:['Mission cost (workarounds, downtime)',true],other1:['Other one-time',false],otherR:['Other recurring',true]};
const INVEST=['design','construction','sioh','contingency','equipment','demolition','land','relocation','other1'];
const DEF_CRIT=[['Meets mission requirements',30],['Schedule to capability',20],['AT/FP and security',15],['Resilience (typhoon, seismic, utilities)',15],['Operational efficiency and layout',10],['Execution risk',10]];

const BLANK=()=>({schema:'earl-1',id:uid(),created:new Date().toISOString(),
 project:{name:'',installation:'',service:''},objective:'',assumptions:'',base_fy:new Date().getFullYear()+1,lead:3,life:25,dollars:'real',rate_override:'',convention:'mixed',
 alts:[{id:uid(),name:'Status quo',type:'status_quo',desc:'Continue in the existing facilities with no new investment.',screen:'',screen_reason:'',costs:[],residual:{on:false,life:40},scores:{}}],
 reqs:[],cells:{},criteria:DEF_CRIT.map(([n,w])=>({id:uid(),name:n,weight:w})),recommend:{alt:'',rationale:''},log:[]});
let E=load()||BLANK();let STEP=(E.build&&E.build.applied)?'done':(E.alts.length<=1&&!E.build)?'build':'basis';
function load(){try{const j=JSON.parse(localStorage.getItem('earl_project')||'null');return j&&window.MSfill?MSfill(BLANK(),j):j;}catch(e){return null;}}
let saveT=null;
function save(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem('earl_project',JSON.stringify(E));
 const rec=JSON.parse(localStorage.getItem('milcon_record')||'{}');const R=results();const rec_alt=E.alts.find(a=>a.id===E.recommend.alt);
 rec.earl={updated:new Date().toISOString(),rate:rate(),period:period(),base_fy:E.base_fy,alternatives:R.rows.map(r=>({name:r.a.name,type:r.a.type,npv:Math.round(r.npv),screened_out:!r.ok,weighted:r.ws})),recommended:rec_alt?{name:rec_alt.name,type:rec_alt.type,npv:Math.round(R.rows.find(r=>r.a===rec_alt).npv),rationale:E.recommend.rationale}:null};
 if(rec_alt&&Array.isArray(rec.rtm)){const h=rec.rtm[0];const ci=h.indexOf('EARL alternative'),ri=h.indexOf('Req ID');if(ci>=0) rec.rtm.slice(1).forEach(row=>{const q=E.reqs.find(x=>x.src===row[ri]);row[ci]=q?rec_alt.name+': '+({pass:'meets',partial:'partly meets',fail:'does not meet'}[E.cells[rec_alt.id+'|'+q.id]]||'not assessed'):rec_alt.name;});}
 localStorage.setItem('milcon_record',JSON.stringify(rec));
 $('#saved').textContent='Saved in this browser '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});}catch(e){console.warn(e);$('#saved').textContent='Not saved – use Save file';}},300);}
function log(what,detail){E.log.push({at:new Date().toISOString(),what,detail:detail||''});}

// ---------- engine ----------
const period=()=>Math.max(1,(Number(E.lead)||0)+(Number(E.life)||1));
function rate(p){if(E.rate_override!==''&&!isNaN(Number(E.rate_override))) return Number(E.rate_override);return appcRate(p||period(),E.dollars==='nominal'?'nominal':'real');}
function factor(n,i,mid){return 1/Math.pow(1+i/100,mid?n-0.5:n);}
function invBasis(a,cf){return a.costs.filter(c=>INVEST.includes(c.cat)&&c.cat!=='land'&&c.cat!=='demolition'&&c.cat!=='relocation').reduce((s,c)=>s+(Number(c.amount)||0)*(cf?cf(c):1)*Math.max(1,(Number(c.end)||Number(c.start)||1)-(Number(c.start)||1)+1),0);}
function residual(a,N,cf){if(!a.residual?.on) return 0;const L=Number(a.residual.life)||40;const inSvc=(Number(E.lead)||0)+1;const used=Math.max(0,N-inSvc+1);return invBasis(a,cf)*Math.max(0,(L-used)/L);}
function stream(a,opt={}){const N=opt.N||period();const y=new Array(N+1).fill(0);const yr=new Array(N+1).fill(0);const m=opt.mult||{};
 a.costs.forEach(c=>{const s=Math.max(1,Number(c.start)||1),e=Math.min(N,Number(CATS[c.cat]?.[1]?(c.end||N):(c.end||c.start))||s);const amt=(Number(c.amount)||0)*(opt.cf?opt.cf(c):1)*(m[c.cat]??1)*(m._all??1)*(INVEST.includes(c.cat)?(m._inv??1):1);
  for(let t=s;t<=e;t++){if(CATS[c.cat]?.[1]) yr[t]+=amt;else y[t]+=amt;}});
 return {one:y,rec:yr,res:residual(a,N,opt.cf)*(m._inv??1)*(m._all??1),N};}
function npv(a,opt={}){const i=opt.rate??rate(opt.N);const st=stream(a,opt);let pv=0,und=0;const cum=[0];
 for(let t=1;t<=st.N;t++){const conv=E.convention;const f1=factor(t,i,conv==='mid');const f2=factor(t,i,conv!=='end');
  const v=st.one[t]*f1+st.rec[t]*f2;pv+=v;und+=st.one[t]+st.rec[t];cum.push(pv);}
 const rv=st.res*factor(st.N,i,false);pv-=rv;und-=st.res;cum[st.N]-=rv;
 return {pv,und,rv:st.res,cum,inv:st.one.reduce((s,x)=>s+x,0),annRec:st.rec[st.N]||0};}
function feasible(a){if(a.screen==='out') return false;return !E.reqs.some(q=>q.must&&E.cells[a.id+'|'+q.id]==='fail');}
function failReasons(a){const r=[];if(a.screen==='out') r.push(a.screen_reason||'Screened out');E.reqs.filter(q=>q.must&&E.cells[a.id+'|'+q.id]==='fail').forEach(q=>r.push('Fails: '+q.text));return r;}
function wscore(a){const W=E.criteria.reduce((s,c)=>s+(Number(c.weight)||0),0)||1;return E.criteria.reduce((s,c)=>s+(Number(c.weight)||0)*(Number(a.scores[c.id])||0),0)/W;}
function results(opt={}){const rows=E.alts.map(a=>{const n=npv(a,opt);const unpriced=feasible(a)&&!a.costs.some(c=>Number(c.amount)>0);return {a,unpriced,ok:feasible(a)&&!unpriced,npv:n.pv,und:n.und,rv:n.rv,cum:n.cum,ws:wscore(a)};});
 const ok=rows.filter(r=>r.ok).sort((x,y)=>x.npv-y.npv);ok.forEach((r,i)=>r.rank=i+1);return {rows,ok,lead:ok[0],second:ok[1]};}

// ---------- uncertainty ranges ----------
// EARL's planning ranges for inputs it estimated; costs you enter by hand are taken as given.
const RANGE={inv:[0.85,1.30,'Construction and design priced from the DoD tables'],sus:[0.90,1.20,'Sustainment priced from the DoD tables'],ask:[0.80,1.20,'Lease, joint-use or host-nation figures from your answers'],est:[0.50,1.50,'Status quo costs EARL estimated']};
function rClass(c){if(c.sqAuto) return (c.est??/estimate confirmed/.test(c.label||''))?'est':null;if(!c.auto) return null;if(c.src==='ask') return 'ask';return CATS[c.cat]?.[1]?'sus':'inv';}
function cfOf(side){return c=>{const k=rClass(c);return k?RANGE[k][side]:1;};}
function npvRange(a){return {lo:npv(a,{cf:cfOf(0)}).pv,hi:npv(a,{cf:cfOf(1)}).pv};}
function rangeInfo(){const R=results();const rg={};R.ok.forEach(r=>rg[r.a.id]=npvRange(r.a));let holds=null,beat=[];
 if(R.lead&&R.second){beat=R.ok.slice(1).filter(r=>rg[r.a.id].lo<=rg[R.lead.a.id].hi);holds=!beat.length;}
 // the estimated lines that move the leader's answer most
 const drv=[];if(R.lead){const a=R.lead.a;a.costs.forEach(c=>{const k=rClass(c);if(!k) return;const one={...a,costs:[c]};const sw=npv(one,{cf:cfOf(1)}).pv-npv(one,{cf:cfOf(0)}).pv;if(sw>0) drv.push({c,k,sw});});drv.sort((x,y)=>y.sw-x.sw);}
 return {R,rg,holds,beat,drv:drv.slice(0,3)};}
const $r=(g)=>g?$k(g.lo)+' – '+$k(g.hi):'—';

function rangeText(RI){const R=RI.R;if(!R.lead) return 'No alternative is costed yet.';if(RI.holds===null) return 'Only one alternative is costed, so there is nothing to compare it with.';
 if(RI.holds) return 'The ranking holds: even at the high end of its range, '+R.lead.a.name+' costs less than every other alternative at the low end of its range.';
 return 'The ranking depends on estimates: '+RI.beat.map(r=>r.a.name).join(', ')+' could cost less than '+R.lead.a.name+' if the estimates move within their ranges.';}
function vDone(){const v=$('#view');const RI=rangeInfo();const R=RI.R;const rec=E.alts.find(x=>x.id===E.recommend.alt)||(R.lead&&R.lead.a);const rr=rec&&R.rows.find(x=>x.a===rec);
 const org=a=>a.type==='status_quo'?'<span class="pill">Baseline</span>':a.origin==='notes'?'<span class="pill ok">Your notes</span>':a.origin==='standard'?'<span class="pill">Standard</span>':a.origin?'<span class="pill warn">AI suggestion</span>':'<span class="pill">You</span>';
 const todo=[];const est=E.alts.flatMap(a=>a.costs.filter(c=>rClass(c)==='est'));if(est.length) todo.push(est.length+' status quo cost estimate'+(est.length>1?'s':'')+' (confirmed when you applied; reconfirm with CE or finance)');
 const un=R.rows.filter(r=>r.unpriced);if(un.length) todo.push('Not costed, so not ranked: '+un.map(r=>r.a.name).join(', ')+'. Add their costs under Adjust details → Life-cycle costs.');
 const ai=Object.keys(E.cellWhy||{}).length;if(ai) todo.push(ai+' screening calls proposed by AI. Review them under Adjust details → Alternatives and screening.');
 if(RI.drv.length&&RI.holds===false) todo.push('Firm up first: '+RI.drv.map(d=>(d.c.label||'').split(/ – |: /)[0]+' ('+$k(d.sw)+' swing)').join('; ')+'.');
 const gp=(noraData()?.gaps||[]).find(g=>Number(g.qty_have)>=0&&Number(g.qty_need)>Number(g.qty_have)&&g.qty_have!=='');if(R.lead&&R.lead.a.type==='status_quo'&&gp) todo.unshift('The status quo ranks first, but NORA shows a gap ('+gp.qty_have+' of '+gp.qty_need+' '+(gp.unit||'')+' for '+(gp.area||'the requirement')+'). If it cannot meet a must-have, screen it out under Adjust details → Alternatives and screening.');
 if(!E.recommend.rationale) todo.push('No rationale yet. Write it with AI below or by hand under Adjust details → Recommendation.');
 const stale=E.build&&E.build.noraSig&&noraSig()&&E.build.noraSig!==noraSig();
 v.innerHTML=(stale?'<div class="panel"><div class="find warn"><b>NORA has changed since this AoA was built.</b> Requirements, gaps or constraints were added or edited. Build again to bring the courses of action, screening and costs up to date; your earlier answers are kept in the assumptions.</div><div class="row"><button class="go" id="dRe">Build again</button><button id="dKeep">Keep as is</button></div></div>':'')+'<div class="panel"><h2>Your analysis of alternatives</h2>'+
  (rec&&rr&&rr.ok?'<div class="kpis"><div class="card"><span class="small">Recommended</span><span class="big">'+esc(rec.name)+'</span><span class="small">'+esc(ATYPES[rec.type])+'</span></div><div class="card"><span class="small">NPV of cost, '+period()+' years</span><span class="big">'+$k(rr.npv)+'</span><span class="small">Likely '+$r(RI.rg[rec.id])+'</span></div><div class="card"><span class="small">Ranking</span><span class="big">'+(RI.holds===null?'—':RI.holds?'Holds':'Close')+'</span><span class="small">'+(RI.holds===false?'depends on estimates':'across estimate ranges')+'</span></div></div>'+
   '<div class="mentor">'+esc(rangeText(RI))+'</div>':'<div class="find warn">No alternative is costed and feasible yet. Use Adjust details to add costs, or build again.</div>')+
  '<div class="row"><button class="go" id="dAoA">Download AoA</button><button id="dMemo">Download memo</button><button id="dAI">'+(E.recommend.rationale?'Rewrite rationale with AI':'Write rationale with AI')+'</button></div>'+
  '<p class="small">The recommended alternative also passes to PIPER and fills the EARL column of NORA’s traceability matrix.</p></div>'+
  '<div class="panel"><h2>Ranking</h2><table><thead><tr><th>Rank</th><th>Alternative</th><th>From</th><th class="num">NPV of cost</th><th class="num">Likely range</th><th class="num">Non-cost score</th></tr></thead><tbody>'+
  R.rows.slice().sort((x,y)=>(y.ok-x.ok)||(x.npv-y.npv)).map(r=>'<tr class="'+(r===R.lead?'lead-alt':r.ok?'':'out-alt')+'"><td>'+(r.rank||'—')+'</td><td>'+esc(r.a.name)+(r.ok?'':'<br><span class="small">'+esc(r.unpriced?'Not costed':'Screened out: '+failReasons(r.a).join('; '))+'</span>')+'</td><td>'+org(r.a)+'</td><td class="num">'+(r.ok?$k(r.npv):'—')+'</td><td class="num">'+(r.ok?$r(RI.rg[r.a.id]):'—')+'</td><td class="num">'+r.ws.toFixed(2)+'</td></tr>').join('')+'</tbody></table>'+
  '<p class="small">Likely range: '+Object.values(RANGE).map(x=>x[2]+' '+Math.round((x[0]-1)*100)+'% to +'+Math.round((x[1]-1)*100)+'%').join('; ')+'. Costs you entered are taken as given.</p></div>'+
  (todo.length?'<div class="panel"><h2>Check before you send it</h2><ul>'+todo.map(t=>'<li>'+esc(t)+'</li>').join('')+'</ul></div>':'')+
  (E.recommend.rationale?'<div class="panel"><h2>Rationale</h2><p>'+esc(E.recommend.rationale).replace(/\n/g,'<br>')+'</p>'+(E.recommend.ai_check?'<div class="mentor">'+esc(E.recommend.ai_check)+'</div>':'')+'</div>':'');

 const p=period();[0,rate(),3,7].filter((x,i,a)=>a.indexOf(x)===i).forEach(i=>flip('Discount rate '+i.toFixed(2)+'%'+(i===7?' (Circular A-94, 1992, base rate)':i===rate()?' (base case)':''),{rate:i}));
 [-5,5].forEach(d=>{const L=Math.max(1,Number(E.life)+d);flip('Economic life '+L+' years',{N:(Number(E.lead)||0)+L,rate:E.rate_override!==''?rate():appcRate((Number(E.lead)||0)+L,E.dollars==='nominal'?'nominal':'real')});});
 const cats=[...new Set(E.alts.filter(feasible).flatMap(a=>a.costs.filter(c=>Number(c.amount)).map(c=>c.cat)))];
 cats.forEach(c=>[-20,20].forEach(d=>flip((CATS[c]?.[0]||c)+' '+(d>0?'+':'')+d+'%',{mult:{[c]:1+d/100}})));

 let be=null;if(R.second){const L=R.lead.a,S=R.second;const inv=npv(L,{mult:{_inv:1}}).pv,inv2=npv(L,{mult:{_inv:2}}).pv;const dInv=inv2-inv;if(dInv>0) be=(S.npv-R.lead.npv)/dInv*100;}
 return {R,rows:out,be};}

  '<h1>Economic Analysis and Recommendation: '+esc(p.name||'(untitled)')+'</h1><div class="m">'+esc([p.installation,p.service].filter(Boolean).join(' · '))+'<br>Prepared by '+esc(E.recommend.by||'—')+', '+today()+', in accordance with DoDI 7041.03. Prepared with EARL; the decision rests with '+esc(E.recommend.authority||'the decision authority')+'.</div>'+
 '<h2>1. Recommendation</h2><p>'+esc(E.recommend.rationale||(a?a.name+' is recommended.':'(not yet selected)'))+'</p>'+
 '<h2>2. Objective</h2><p>'+esc(E.objective||'—')+'</p>'+
 '<h2>3. Ground rules and assumptions</h2>'+tb(['Item','Value'],[['Base fiscal year','FY'+E.base_fy],['Period of analysis',N+' years (lead time '+E.lead+', economic life '+E.life+')'],['Dollars',E.dollars==='nominal'?'Then-year':'Constant FY'+E.base_fy],['Discount rate',rate().toFixed(2)+'% '+(E.rate_override!==''?'(override)':'('+APPC.edition+', interpolated)')],['Convention',{mixed:'Mid-year for recurring, end-of-year for one-time',mid:'Mid-year',end:'End-of-year'}[E.convention]]])+(E.assumptions?'<p>'+esc(E.assumptions).replace(/\n/g,'<br>')+'</p>':'')+
 '<h2>4. Alternatives considered</h2>'+tb(['Alternative','Type','Description','Status'],E.alts.map(x=>[x.name,ATYPES[x.type],x.desc,feasible(x)?'Carried forward':'Screened out: '+failReasons(x).join('; ')]))+
 (E.reqs.length?'<h2>5. Screening against requirements and constraints</h2>'+tb(['Criterion'].concat(E.alts.map(x=>x.name)),E.reqs.map(q=>[(q.src&&q.src!=='manual'&&!q.src.startsWith('C:')?q.src+' ':'')+q.text].concat(E.alts.map(x=>({pass:'Meets',partial:'Partly',fail:'Fails'}[E.cells[x.id+'|'+q.id]]||'—'))))):'')+
 '<h2>6. Life-cycle cost comparison</h2>'+tb(['Rank','Alternative','NPV of cost','Undiscounted','Residual credit','Non-cost score'],R.rows.slice().sort((x,y)=>(y.ok-x.ok)||(x.npv-y.npv)).map(r=>[r.rank||'—',r.a.name,$$(r.npv),$$(r.und),$$(r.rv),r.ws.toFixed(2)]))+
 '<h2>7. Non-cost factors</h2>'+tb(['Factor','Weight'].concat(E.alts.map(x=>x.name)),E.criteria.map(c=>[c.name,c.weight].concat(E.alts.map(x=>x.scores[c.id]??'—'))))+E.alts.filter(x=>x.why).map(x=>'<p><b>'+esc(x.name)+':</b> '+esc(x.why)+'</p>').join('')+
 (S?'<h2>8. Sensitivity</h2>'+(S.be!=null?'<p>Break-even: '+esc(S.R.lead.a.name)+' remains lowest-cost until its investment costs rise '+S.be.toFixed(1)+'%.</p>':'')+tb(['Case','Lowest-cost alternative'].concat(R.ok.map(r=>r.a.name)),S.rows.map(x=>[x.lbl,x.leader+(x.changes?' (changes)':'')].concat(R.ok.map(r=>$k(x.npvs[r.a.id]))))):'')+
 '<h2>9. Decision</h2>'+tb(['Decision authority','Decision','Date'],[[E.recommend.authority||'',({approved:'Approved',returned:'Returned for rework',other:'Other alternative chosen'})[E.recommend.decision]||'Pending',E.recommend.date||'']])+
 '</body></html>';}

$('#bSave').onclick=()=>{dl(fname('EARL','json'),JSON.stringify(E,null,1),'application/json');log('Analysis file saved');save();};
$('#bNew').onclick=()=>{if(!confirm('Start a new analysis? Save a file of the current one first if you need it.')) return;E=BLANK();log('Analysis created');save();STEP='basis';render();};
$('#bOpen').onclick=()=>$('#fOpen').click();
$('#fOpen').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f) return;f.text().then(t=>{try{const j=JSON.parse(t);if(j.schema!=='earl-1') throw new Error('Not an EARL analysis file');E=Object.assign(BLANK(),j);log('Analysis file opened',f.name);save();STEP='basis';render();}catch(err){alert('Could not open: '+err.message);}});};
if(!E.log.length) log('Analysis created');
render();save();

<script id="carl-ai">/* CARL shared AI: AI and CARL's library for every tool on carlcompliance.com,
   through CARL's server, on CARL's keys, for anyone signed in to
   carl.carlcompliance.com. No key is ever in this page. Signed out, the CARL
   engines simply stay off and each tool keeps working without them. */
(function(){
 var BASE='https://carl.carlcompliance.com';
 try{BASE=localStorage.getItem('carl_ai_base')||BASE;}catch(e){}
 var ST={ok:null,user:'',msg:'Checking CARL sign-in…'},READY=[];
 var TOOL=function(){return window.MS_TOOL||document.title;};
 function proj(){try{return (window.MS&&MS.active&&MS.active())||'default';}catch(e){return 'default';}}
 // ---- usage, per project and tool, kept in this browser
 function useGet(){try{return JSON.parse(localStorage.getItem('carl_ai_usage')||'{}');}catch(e){return {};}}
 function useAdd(kind,u,cached){try{var U=useGet(),p=proj(),t=TOOL();U[p]=U[p]||{};var r=U[p][t]=U[p][t]||{calls:0,cached:0,in:0,out:0,library:0};
  if(kind==='library') r.library++;else if(cached) r.cached++;else{r.calls++;r.in+=(u&&u.in)||0;r.out+=(u&&u.out)||0;}localStorage.setItem('carl_ai_usage',JSON.stringify(U));}catch(e){}}
 // ---- answer cache: the same question to the same engine is answered once
 var CK='carl_ai_cache';
 function h(s){var a=5381,b=52711;for(var i=0;i<s.length;i++){var c=s.charCodeAt(i);a=(a*33)^c;b=(b*33)^c;}return (a>>>0).toString(36)+(b>>>0).toString(36)+s.length.toString(36);}
 function cGet(k){try{var C=JSON.parse(localStorage.getItem(CK)||'{}');return C[k]?C[k].r:null;}catch(e){return null;}}
 function cPut(k,r){try{var C=JSON.parse(localStorage.getItem(CK)||'{}');C[k]={r:r,t:Date.now()};var ks=Object.keys(C);if(ks.length>150){ks.sort(function(a,b){return C[a].t-C[b].t;}).slice(0,ks.length-150).forEach(function(x){delete C[x];});}
  var s=JSON.stringify(C);if(s.length>1500000){ks=Object.keys(C).sort(function(a,b){return C[a].t-C[b].t;});ks.slice(0,Math.ceil(ks.length/2)).forEach(function(x){delete C[x];});s=JSON.stringify(C);}localStorage.setItem(CK,s);}catch(e){}}
 // ---- one notice per browser session before anything leaves the page
 function cuiOk(){try{if(sessionStorage.getItem('carl_ai_cui')) return true;}catch(e){}
  var ok=confirm('This sends the text to commercial AI services through CARL.\n\nDo not send CUI, classified or other controlled information.\n\nContinue?');
  if(ok){try{sessionStorage.setItem('carl_ai_cui','1');}catch(e){}}return ok;}
 async function post(path,body){var r=await fetch(BASE+path,{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  var t=await r.text(),j={};try{j=JSON.parse(t);}catch(e){}
  if(r.status===401) throw new Error('Sign in to CARL at carl.carlcompliance.com, then reload this page.');
  if(!r.ok) throw new Error(j.error||('CARL HTTP '+r.status));return j;}
 // engine: 'claude' | 'gemini' | 'fast'. Returns the model's JSON object.
 // Engines are named for their job on screen; which service runs each stays here.
 var ENG={'reader-a':'claude','reader-b':'gemini','reviewer':'claude'};
 async function ask(engine,sys,user,images,opt){opt=opt||{};engine=ENG[engine]||engine;engine=/gemini/i.test(engine)?'gemini':/fast/i.test(engine)?'fast':'claude';
  var key=h(engine+'\u0001'+(sys||'')+'\u0001'+(user||'')+'\u0001'+((images||[]).join('').length));
  if(!opt.fresh){var c=cGet(key);if(c){useAdd('ai',null,true);return c;}}
  if(!cuiOk()) throw new Error('Cancelled – nothing was sent.');
  var j=await post('/api/assist',{engine:engine,system:sys||'',user:user||'',images:(images||[]).slice(0,8),tool:TOOL()});
  if(!j.result||typeof j.result!=='object') throw new Error('CARL returned no JSON');
  useAdd('ai',j.usage,false);cPut(key,j.result);return j.result;}
 // Verbatim passages from CARL's library: [{src,section,page,text,rank}]
 async function library(query,k){if(!cuiOk()) throw new Error('Cancelled – nothing was sent.');var j=await post('/api/library',{query:String(query||'').slice(0,2000),k:k||8,tool:TOOL()});useAdd('library');return j.passages||[];}
 function usageText(){var U=useGet()[proj()]||{},L=[];Object.keys(U).forEach(function(t){var r=U[t];L.push(t+': '+r.calls+' AI calls ('+Math.round((r.in+r.out)/1000)+'K tokens), '+r.cached+' from cache, '+r.library+' library searches');});return L.length?L.join('\n'):'No CARL AI use in this project yet.';}
 function badge(){var bar=document.getElementById('msbar')||document.body,b=document.getElementById('carlai');
  if(!b){b=document.createElement('span');b.id='carlai';b.style.cssText='margin-left:auto;font-size:12px;padding:2px 8px;border-radius:10px;white-space:nowrap;cursor:default'+(bar===document.body?';position:fixed;right:14px;bottom:12px;z-index:50;box-shadow:0 1px 4px rgba(0,0,0,.2)':'');bar.appendChild(b);
   b.onclick=function(e){if(e.target.tagName==='A') return;alert('CARL AI use in this project, this browser:\n\n'+usageText());};}
  if(!badge.obs&&window.MutationObserver&&bar!==document.body){badge.obs=new MutationObserver(function(){if(!document.getElementById('carlai')) badge();});badge.obs.observe(bar,{childList:true});}
  b.style.background=ST.ok?'#e3f4e3':'#f1f1f1';b.style.color=ST.ok?'#0b6b0b':'#555';
  b.innerHTML=ST.ok?'AI: CARL ✓'+(ST.user?' ('+String(ST.user).replace(/[<&]/g,'')+')':''):'AI: <a href="'+BASE+'/signin" target="_blank" rel="noopener">sign in to CARL<\/a>';
  b.title=ST.ok?'Click for AI use in this project':ST.msg;}
 window.CARLAI={ask:ask,library:library,base:BASE,state:function(){return ST;},ready:function(f){if(ST.ok!==null) f(ST);else READY.push(f);},usage:usageText};

 // ---- tools with AI settings (SCOTT, NORA, SOPHIE, IRMA): CARL as a provider
 if(typeof callAI==='function'&&typeof loadSettings==='function'){
  var LABEL='CARL – shared AI on CARL’s keys (sign in to CARL)';
  try{var ent=Object.entries(PROVIDERS);Object.keys(PROVIDERS).forEach(function(k){delete PROVIDERS[k];});PROVIDERS.carl=LABEL;ent.forEach(function(e){if(e[0]!=='carl') PROVIDERS[e[0]]=e[1];});}catch(e){}
  var DEF=function(){return [{provider:'carl',label:'Reader A',role:'reader',model:'reader-a',enabled:true},{provider:'carl',label:'Reader B',role:'reader',model:'reader-b',enabled:true},{provider:'carl',label:'Reviewer',role:'arbiter',model:'reviewer',enabled:true}];};
  var _load=loadSettings,_save=typeof saveSettings==='function'?saveSettings:null,_call=callAI,_base=typeof defaultBase==='function'?defaultBase:null;
  loadSettings=function(){var s=_load();
   if(!s.slots.some(function(x){return x.key||x.provider==='carl';})) s.slots=DEF().map(function(d,i){return Object.assign({},SLOT_DEF,s.slots[i]||{},d,{key:''});});
   s.slots.forEach(function(x){if(x.provider==='carl'){if(x.role==='arbiter'){x.model='reviewer';x.label='Reviewer';}else if(/gemini|reader-b/i.test(x.model)){x.model='reader-b';x.label='Reader B';}else{x.model='reader-a';x.label='Reader A';}}});
   s.slots.forEach(function(x){if(x.provider==='carl'&&x.enabled&&ST.ok!==true){x.enabled=false;x._carlOff=true;}});return s;};
  if(_save) saveSettings=function(){var off=SET.slots.filter(function(x){return x._carlOff&&!x.enabled;});off.forEach(function(x){x.enabled=true;});try{return _save.apply(this,arguments);}finally{off.forEach(function(x){x.enabled=false;});}};
  if(_base) defaultBase=function(p){return p==='carl'?'carl.carlcompliance.com':_base(p);};
  callAI=async function(slot,sys,user,images){if(slot.provider!=='carl') return _call.apply(this,arguments);
   // The connection test goes to the quick tier; real work stays on the slot's model.
   var test=sys==='Reply with JSON only.'&&/"ok":true/.test(user||'');return ask(test?'fast':slot.model,sys,user,images,{fresh:test});};
 }
 fetch(BASE+'/api/assist',{credentials:'include'}).then(function(r){return r.json().catch(function(){return {};}).then(function(j){
   if(r.ok&&j.ok) ST={ok:true,user:j.user||'',msg:'Signed in to CARL'};
   else ST={ok:false,msg:r.status===401?'Not signed in to CARL':(j.error||('CARL HTTP '+r.status))};});})
  .catch(function(){ST={ok:false,msg:'CARL could not be reached'};})
  .then(function(){try{if(typeof loadSettings==='function'&&typeof SET!=='undefined') SET=loadSettings();}catch(e){}try{if(typeof renderEngines==='function') renderEngines();}catch(e){}
   READY.splice(0).forEach(function(f){try{f(ST);}catch(e){}});
   // Redraw once so the tool's own text reflects CARL being available.
   if(ST.ok&&typeof render==='function'&&typeof callAI!=='function'){try{render();}catch(e){}}
   if(ST.ok&&typeof render==='function'&&typeof callAI==='function'&&window.MS_TOOL==='irma'){try{render();}catch(e){}}
   if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',badge);else badge();});
 // Connecting other AI services (the .mil build's GenAI.mil, for one) is an administrator task.
 function gate(){var adm=false;try{adm=localStorage.getItem('carl_ai_admin')==='1';}catch(e){}var b=document.getElementById('bSettings');if(b&&!adm) b.style.display='none';}
 if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',gate);else gate();
})();
</script>
