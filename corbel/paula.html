<!DOCTYPE html>
<html lang="en">
<head>
<script id="corbel-pf">/* Corbel portfolios: each portfolio keeps its own copy of every tool's data in this browser.
   "My portfolio" uses the plain keys; any other portfolio stores its keys as pf:<id>:<key>. */
(function(){
 var ls;try{ls=window.localStorage;}catch(e){return;}if(!ls||window.CorbelPF) return;
 var SP=Storage.prototype,g=SP.getItem,s=SP.setItem,r=SP.removeItem;
 var SHARED={corbel_portfolio:1,carl_ai_base:1,carl_ai_cache:1};
 function cur(){try{return g.call(ls,'corbel_portfolio')||'';}catch(e){return '';}}
 function nk(k){var c=cur();k=String(k);return c&&!SHARED[k]&&k.indexOf('pf:')!==0?'pf:'+c+':'+k:k;}
 SP.getItem=function(k){return g.call(this,this===ls?nk(k):k);};
 SP.setItem=function(k,v){return s.call(this,this===ls?nk(k):k,v);};
 SP.removeItem=function(k){return r.call(this,this===ls?nk(k):k);};
 var NAMES={'':'My portfolio',test:'Test portfolio'};
 function keysOf(id){var out=[],p='pf:'+id+':';for(var i=0;i<ls.length;i++){var k=ls.key(i);if(k&&k.indexOf(p)===0) out.push(k);}return out;}
 function wipe(id){keysOf(id).forEach(function(k){r.call(ls,k);});}
 function seed(id){return fetch('/corbel/test_portfolio.json',{cache:'no-cache'}).then(function(x){if(!x.ok) throw new Error('Test data not found');return x.json();}).then(function(j){
   wipe(id);Object.keys(j.keys||{}).forEach(function(k){s.call(ls,'pf:'+id+':'+k,typeof j.keys[k]==='string'?j.keys[k]:JSON.stringify(j.keys[k]));});s.call(ls,'pf:'+id+':corbel_seeded',j.version||'1');});}
 window.CorbelPF={cur:cur,name:function(){return NAMES[cur()]||cur();},names:NAMES,
  use:function(id){id=id||'';var go=function(){if(id) s.call(ls,'corbel_portfolio',id);else r.call(ls,'corbel_portfolio');};
   if(id==='test'&&!g.call(ls,'pf:test:corbel_seeded')) return seed('test').then(go);go();return Promise.resolve();},
  reset:function(id){return seed(id||'test');}};
 function band(){if(!cur()||document.getElementById('pfband')) return;var d=document.createElement('div');d.id='pfband';
  d.style.cssText='background:#C9A227;color:#10303F;font:600 13px/1.3 "Segoe UI",system-ui,sans-serif;padding:6px 14px;text-align:center;position:relative;z-index:50';
  d.innerHTML=(NAMES[cur()]||cur())+' – sample data, kept apart from your real projects. <a href="/corbel/" style="color:#10303F;text-decoration:underline">Switch on the Corbel home page</a>';
  document.body.insertBefore(d,document.body.firstChild);}
 document.addEventListener('click',function(e){var a=e.target&&e.target.closest&&e.target.closest('a[download]');if(a&&cur()){var n=a.getAttribute('download')||'';if(n&&n.indexOf('TEST_')!==0) a.setAttribute('download','TEST_'+n);}},true);
 if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',band);else band();
})();
</script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PAULA – Portfolio Analytics, Updates, and Leadership Advisor</title>
<script id="ms-core">window.MS_TOOL='paula';
/* Corbel shared project record. Inlined into each tool; runs before the tool's own script. */
(function(){
'use strict';
const TOOL=window.MS_TOOL||'';
const PKEY={nora:'nora_project',earl:'earl_project',piper:'piper_project',sophie:'sophie_project',record:'milcon_record',paula:'paula_project'};
const PER=['nora','earl','piper','sophie','record'];
const ls=window.localStorage;const orig=Storage.prototype.setItem;
const today=()=>new Date().toLocaleDateString('en-CA');
const uid=()=>Math.random().toString(36).slice(2,10);
function get(k){try{return JSON.parse(ls.getItem(k)||'null');}catch(e){return null;}}
function raw(k,v){orig.call(ls,k,v);}
function loadStore(){const s=get('milcon_store');return s&&s.projects?s:{schema:'milcon-store-1',active:'',projects:{}};}
let full=false;
function saveStore(s){try{raw('milcon_store',JSON.stringify(s));full=false;}catch(e){full=true;note('Browser storage is full. Use “Export all” to keep a copy, then delete old projects.');}}
function fill(base,obj){if(obj==null) return obj;for(const k of Object.keys(base)){if(obj[k]===undefined) obj[k]=base[k];else if(base[k]&&typeof base[k]==='object'&&!Array.isArray(base[k])&&obj[k]&&typeof obj[k]==='object'&&!Array.isArray(obj[k])) fill(base[k],obj[k]);}return obj;}
window.MSfill=fill;

// ---- field maps: what each tool shares with the record ----
const SVC={army:'Army',navy:'Navy',usmc:'Marine Corps',af:'Air Force',ussf:'Space Force',dha:'DHA',def_agency:'Defense-Wide',joint:'Joint'};
const LOC={us_hawaii:'Hawaii',us_alaska:'Alaska',guam:'Guam',cnmi:'CNMI',american_samoa:'American Samoa',wake:'Wake Island',japan:'Japan',korea:'Korea',australia:'Australia',philippines:'Philippines',palau:'Palau',fsm:'FSM',marshall_islands:'Marshall Islands',papua_new_guinea:'Papua New Guinea',singapore:'Singapore'};
const inv=o=>Object.fromEntries(Object.entries(o).map(([k,v])=>[v,k]));
const PIPER_SVC={'DHA':'Defense Health Agency','Defense Health Agency':'Defense Health Agency'};
const has=v=>v!==undefined&&v!==null&&String(v).trim()!=='';
const set=(o,k,v)=>{if(has(v)) o[k]=v;};
const MAP={
 nora:{skel:()=>({schema:'nora-1',project:{}}),
  get:s=>({name:s.project?.name,installation:s.project?.installation,service:SVC[s.project?.service],country:LOC[s.project?.location],need_date:s.project?.need_date,_ev:{'Requirement validated':s.validation?.service_date||s.validation?.installation_date||''}}),
  put:(s,c)=>{s.project=s.project||{};set(s.project,'name',c.name);set(s.project,'installation',c.installation);if(inv(SVC)[c.service]) s.project.service=inv(SVC)[c.service];if(inv(LOC)[c.country]) s.project.location=inv(LOC)[c.country];set(s.project,'need_date',c.need_date);}},
 earl:{skel:()=>({schema:'earl-1',project:{}}),
  get:s=>({name:s.project?.name,installation:s.project?.installation,service:s.project?.service,_ev:{'Economic analysis approved':s.recommend?.decision==='approved'?(s.recommend.date||today()):''}}),
  put:(s,c)=>{s.project=s.project||{};set(s.project,'name',c.name);set(s.project,'installation',c.installation);set(s.project,'service',c.service);}},
 piper:{skel:()=>({schema:'piper-1',b:{},ex:{}}),
  get:s=>({name:s.b?.title,installation:s.b?.installation,number:s.b?.project_no,fy:s.b?.fy,catcode:s.b?.catcode,service:s.b?.component==='Defense Health Agency'?'DHA':s.b?.component,authorized:s.ex?.auth,cwe:s.ex?.cwe,_ev:{'1391 validated':(s.versions||[]).length?'':''}}),
  put:(s,c)=>{s.b=s.b||{};s.ex=s.ex||{};set(s.b,'title',c.name);set(s.b,'installation',c.installation);set(s.b,'project_no',c.number);set(s.b,'fy',c.fy);set(s.b,'catcode',c.catcode);if(has(c.service)) s.b.component=PIPER_SVC[c.service]||c.service;set(s.ex,'auth',c.authorized);set(s.ex,'cwe',c.cwe);}},
 sophie:{skel:()=>({schema:'sophie-1',p:{}}),
  get:s=>({name:s.p?.title,installation:s.p?.installation,to:s.p?.contract,buildings:s.p?.buildings,_ev:{'SOW final':(s.sections||[]).length&&s.sections.every(x=>x.status==='final')?'@today':''}}),
  put:(s,c)=>{s.p=s.p||{};set(s.p,'title',c.name);set(s.p,'installation',c.installation);set(s.p,'contract',c.to);set(s.p,'buildings',c.buildings);}},
 record:{skel:()=>null,get:r=>({programmed:r?.piper?.rounded||undefined}),put:()=>{}}};
const PAULA_F=['name','number','to','service','installation','country','fy','pm','programmed','authorized','award','cwe','obligated','expended','ntp','baseline_finish','forecast_finish','pct'];
function mergeCore(core,o){if(!o) return false;let ch=false;for(const [k,v] of Object.entries(o)){if(k==='_ev') continue;if(has(v)&&String(core[k]??'')!==String(v)){core[k]=v;ch=true;}}
 core.events=core.events||{};for(const [k,v] of Object.entries(o._ev||{})){if(v==='@today'){if(!core.events[k]){core.events[k]=today();ch=true;}}else if(has(v)&&core.events[k]!==v){core.events[k]=v;ch=true;}}return ch;}

// ---- startup: put the active project's state where the tool expects it ----
let S=loadStore();
if(!Object.keys(S.projects).length&&PER.some(t=>ls.getItem(PKEY[t]))){const id=uid();const p={id,core:{},tools:{},created:today()};PER.forEach(t=>{const v=get(PKEY[t]);if(v){p.tools[t]=v;mergeCore(p.core,MAP[t].get(v));}});p.core.name=p.core.name||'Project 1';S.projects[id]=p;S.active=id;saveStore(S);}
if(PER.includes(TOOL)){
 if(!S.active||!S.projects[S.active]){const first=Object.keys(S.projects)[0];if(first) S.active=first;else{const id=uid();S.projects[id]={id,core:{name:'New project'},tools:{},created:today()};S.active=id;}saveStore(S);}
 const P=S.projects[S.active];
 PER.forEach(t=>{let v=P.tools[t];if(!v&&t===TOOL) v=MAP[t].skel();if(v){if(t!=='record') MAP[t].put(v,P.core);raw(PKEY[t],JSON.stringify(v));}else ls.removeItem(PKEY[t]);});
}
if(TOOL==='paula') paulaIn();

// ---- every save flows back into the record ----
Storage.prototype.setItem=function(k,v){orig.call(this,k,v);if(this!==ls) return;try{onWrite(k,v);}catch(e){console.warn('Corbel record',e);}};
function onWrite(k,v){const t=Object.keys(PKEY).find(x=>PKEY[x]===k);if(!t) return;const St=loadStore();
 if(t==='paula'){paulaOut(St,JSON.parse(v));return;}
 if(!PER.includes(TOOL)) return;const P=St.projects[St.active];if(!P) return;const val=JSON.parse(v);P.tools[t]=val;mergeCore(P.core,MAP[t].get(val));P.updated=new Date().toISOString();saveStore(St);S=St;refresh();}

// ---- PAULA: one PAULA project per record project, same id ----
function paulaIn(){let pa=get('paula_project');if(!pa) pa={schema:'paula-1',created:new Date().toISOString(),projects:[],t:{},me:'',log:[]};let ch=false;
 for(const [id,p] of Object.entries(S.projects)){let pp=pa.projects.find(x=>x.id===id);if(!pp){pp={id,phase:1,risks:[],milestones:[],updates:[],override:{level:'',reason:''}};pa.projects.push(pp);ch=true;}
  PAULA_F.forEach(f=>{if(has(p.core[f])&&String(pp[f]??'')!==String(p.core[f])){pp[f]=p.core[f];ch=true;}});
  const ph={'Requirement validated':2,'Economic analysis approved':3,'1391 validated':4,'SOW final':6};
  const T=p.tools||{},rc=T.record||{};const lv=[[1,'NORA',!!T.nora],[3,'EARL recommendation',!!(rc.earl&&rc.earl.recommended)],[3,'PIPER 1391',!!(rc.piper&&(rc.piper.rounded||rc.piper.contract))],[5,'SOPHIE SOW',!!(T.sophie&&(T.sophie.sections||[]).length)]].filter(x=>x[2]);
  lv.forEach(([n,src])=>{if(Number(pp.phase||1)<n&&!pp.phase_manual){pp.phase=n;pp.phase_src=src;ch=true;}});
  if(rc.piper&&rc.piper.contract&&!has(pp.cwe)){pp.cwe=rc.piper.contract;ch=true;}
  for(const [n,d] of Object.entries(p.core.events||{})){if(!d) continue;let m=(pp.milestones||[]).find(x=>x.name===n);if(!m){m={id:uid(),name:n,baseline:'',forecast:'',actual:''};pp.milestones=(pp.milestones||[]).concat([m]);ch=true;}if(!m.actual){m.actual=d;ch=true;}if(ph[n]&&Number(pp.phase||1)<ph[n]&&!pp.phase_manual){pp.phase=ph[n];pp.phase_src=n;ch=true;}}}
 if(ch) raw('paula_project',JSON.stringify(pa));}
function paulaOut(St,pa){let ch=false;(pa.projects||[]).forEach(pp=>{if(pp.sample) return;let p=St.projects[pp.id];if(!p){if(!has(pp.name)) return;p=St.projects[pp.id]={id:pp.id,core:{},tools:{},created:today()};ch=true;}
  const o={};PAULA_F.forEach(f=>o[f]=pp[f]);if(mergeCore(p.core,o)) ch=true;});if(ch) saveStore(St);}

// ---- public helpers ----
window.MS={store:()=>loadStore(),active:()=>{const s=loadStore();return s.projects[s.active]||null;},has:id=>!!loadStore().projects[id],
 openIn:(id,tool)=>{const s=loadStore();if(!s.projects[id]) return;flush(s);s.active=id;saveStore(s);location.href=tool+'.html';},
 tos:()=>[...new Set(Object.values(loadStore().projects).map(p=>p.core.to).filter(has))].sort()};
function flush(s){const P=s.projects[s.active];if(!P||!PER.includes(TOOL)) return;PER.forEach(t=>{const v=get(PKEY[t]);if(v){P.tools[t]=v;mergeCore(P.core,MAP[t].get(v));}});}
function sw(id){const s=loadStore();flush(s);s.active=id;saveStore(s);location.reload();}
function dl(name,data){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>a.remove(),300);}
function note(t){const n=document.getElementById('msnote');if(n) n.textContent=t;}

// ---- project bar ----
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function bar(){if(!PER.includes(TOOL)) return;const h=document.querySelector('header');if(!h) return;const d=document.createElement('div');d.id='msbar';
 d.style.cssText='display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:7px 28px;background:#1F5566;color:#fff;font:13px "Segoe UI",system-ui,sans-serif';h.after(d);refresh();}
function refresh(){const d=document.getElementById('msbar');if(!d) return;const s=loadStore();const P=s.projects[s.active];const c=P?P.core:{};
 const ids=Object.keys(s.projects).sort((a,b)=>(s.projects[a].core.name||'').localeCompare(s.projects[b].core.name||''));
 d.innerHTML='<span style="opacity:.8">Project<\/span><select id="mssel" style="width:auto;max-width:340px;font-size:13px;padding:3px 6px;border-radius:5px">'+ids.map(id=>'<option value="'+id+'" '+(id===s.active?'selected':'')+'>'+esc(s.projects[id].core.name||'(untitled)')+'<\/option>').join('')+'<\/select>'+
 '<button id="msnew" style="font-size:12.5px;padding:3px 10px;background:transparent;color:#fff;border-color:rgba(255,255,255,.4)">New project<\/button>'+
 '<span style="opacity:.85;flex:1;min-width:200px">'+esc([c.number,c.to,c.installation,c.service,c.fy?'FY'+c.fy:''].filter(has).join(' · ')||'Shared record: title, installation, task order and amounts are entered once and used by every tool')+'<\/span>'+
 '<span id="msnote" style="color:#F2B632"><\/span>'+
 '<button id="msmore" style="font-size:12.5px;padding:3px 10px;background:transparent;color:#fff;border-color:rgba(255,255,255,.4)">Projects…<\/button>';
 d.querySelector('#mssel').onchange=e=>sw(e.target.value);
 d.querySelector('#msnew').onclick=()=>{const n=prompt('Name of the new project');if(!n) return;const s2=loadStore();flush(s2);const id=uid();s2.projects[id]={id,core:{name:n.trim()},tools:{},created:today()};s2.active=id;saveStore(s2);location.reload();};
 d.querySelector('#msmore').onclick=manage;}
function manage(){const s=loadStore();const dlg=document.createElement('dialog');dlg.style.cssText='border:none;border-radius:12px;padding:0;max-width:760px;width:94vw';
 const rows=Object.values(s.projects).sort((a,b)=>(a.core.name||'').localeCompare(b.core.name||''));
 dlg.innerHTML='<div style="padding:20px 22px;font:14px \'Segoe UI\',system-ui,sans-serif;color:#10303F"><h2 style="margin:0 0 4px;font:600 20px Bahnschrift,Segoe UI,sans-serif">Projects<\/h2><p style="margin:0 0 12px;color:#4f6873;font-size:13.5px">Every project lives in this browser’s shared record. Each tool keeps its own work for each project. Export everything to move to another computer or to keep a backup.<\/p>'+
 '<table style="width:100%;border-collapse:collapse;font-size:13px"><tr><th style="text-align:left;padding:6px">Project<\/th><th style="text-align:left">Task order<\/th><th style="text-align:left">Tools used<\/th><th><\/th><\/tr>'+rows.map(p=>'<tr style="border-top:1px solid #c9d6d3"><td style="padding:6px">'+esc(p.core.name||'(untitled)')+(p.id===s.active?' <b>(open)<\/b>':'')+'<\/td><td>'+esc(p.core.to||'')+'<\/td><td>'+esc(Object.keys(p.tools).filter(t=>t!=='record').map(t=>t.toUpperCase()).join(', ')||'–')+'<\/td><td style="white-space:nowrap"><button data-ren="'+p.id+'">Rename<\/button> '+(p.id!==s.active?'<button data-del="'+p.id+'">Delete<\/button>':'')+'<\/td><\/tr>').join('')+'<\/table>'+
 '<div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap"><button id="msexp">Export all<\/button><button id="msimp">Import…<\/button><input type="file" id="msf" accept=".json" hidden><span style="flex:1"><\/span><button id="mscl">Close<\/button><\/div><\/div>';
 document.body.appendChild(dlg);dlg.showModal();const close=()=>{dlg.close();dlg.remove();};
 dlg.querySelector('#mscl').onclick=close;
 dlg.querySelectorAll('[data-ren]').forEach(b=>b.onclick=()=>{const s2=loadStore();flush(s2);const p=s2.projects[b.dataset.ren];const n=prompt('Project name',p.core.name||'');if(!n) return;p.core.name=n.trim();saveStore(s2);location.reload();});
 dlg.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const s2=loadStore();const p=s2.projects[b.dataset.del];if(!confirm('Delete “'+(p.core.name||'project')+'” and everything every tool holds for it? This cannot be undone. Export first if you need a copy.')) return;delete s2.projects[p.id];saveStore(s2);close();manage();});
 dlg.querySelector('#msexp').onclick=()=>{const s2=loadStore();flush(s2);saveStore(s2);const all={schema:'milcon-backup-1',exported:new Date().toISOString(),store:s2,irma:get('irma_project'),quinn:get('quinn_project'),paula:get('paula_project')};dl('Corbel_all_projects_'+today()+'.json',JSON.stringify(all));};
 dlg.querySelector('#msimp').onclick=()=>dlg.querySelector('#msf').click();
 dlg.querySelector('#msf').onchange=e=>{const f=e.target.files[0];if(!f) return;f.text().then(t=>{try{const j=JSON.parse(t);if(j.schema!=='milcon-backup-1') throw new Error('Not a Corbel backup file');if(!confirm('Replace everything in this browser with the backup from '+(j.exported||'').slice(0,10)+'?')) return;raw('milcon_store',JSON.stringify(j.store));['irma','quinn','paula'].forEach(k=>{if(j[k]) raw(k+'_project',JSON.stringify(j[k]));});const a=j.store.projects[j.store.active];PER.forEach(t=>{const v=a&&a.tools[t];if(v) raw(PKEY[t],JSON.stringify(v));else ls.removeItem(PKEY[t]);});location.reload();}catch(err){alert('Could not import: '+err.message);}});};}

// ---- task order suggestions in IRMA and QUINN ----
function toList(){if(TOOL!=='irma'&&TOOL!=='quinn') return;const dl2=document.createElement('datalist');dl2.id='ms-to';dl2.innerHTML=window.MS.tos().map(t=>'<option value="'+esc(t)+'">').join('');document.body.appendChild(dl2);
 const tag=()=>document.querySelectorAll('input[data-k="to"]:not([list])').forEach(i=>i.setAttribute('list','ms-to'));new MutationObserver(tag).observe(document.body,{childList:true,subtree:true});tag();}
document.addEventListener('DOMContentLoaded',()=>{bar();toList();});
})();
</script>

<style>

:root{--paper:#E9F0EE;--ink:#10303F;--depth:#1F5566;--shoal:#7FB7B2;--buoy:#F2B632;--line:#c9d6d3;--card:#fff;--mute:#4f6873;--ok:#1e6b45;--okbg:#e1f1e8;--warn:#8a5a00;--warnbg:#fdf1d6;--bad:#9b2c2c;--badbg:#f8e3e3}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 "Segoe UI",system-ui,sans-serif;color:var(--ink);background:var(--paper)}
a{color:var(--depth)}
header{display:flex;align-items:center;gap:18px;padding:14px 28px;background:var(--ink);color:#fff;flex-wrap:wrap}
header .home{color:var(--shoal);text-decoration:none;font-size:14px}
header h1{margin:0;font:600 22px/1.1 Bahnschrift,"DIN Alternate","Segoe UI",sans-serif;letter-spacing:.01em}
header .sp{flex:1}
header .saved{font-size:12.5px;color:var(--shoal)}
button{font:inherit;font-size:14px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:7px 14px;border-radius:6px;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--buoy);outline-offset:1px}
button.go{background:var(--depth);border-color:var(--depth);color:#fff}
button.go:disabled{opacity:.5;cursor:default}
button.sm{font-size:12.5px;padding:3px 9px}
button.link{border:none;background:none;color:var(--depth);padding:2px 4px;text-decoration:underline}
header button{background:transparent;color:#fff;border-color:rgba(255,255,255,.35)}
.wrap{max-width:1320px;margin:0 auto;padding:22px 28px 60px;display:grid;grid-template-columns:230px minmax(0,1fr);gap:22px}
@media(max-width:900px){.wrap{grid-template-columns:1fr}}
nav.steps{position:sticky;top:16px;align-self:start;display:grid;gap:4px}
nav.steps button{text-align:left;border:1px solid transparent;background:transparent;padding:9px 12px;display:flex;gap:10px;align-items:center;border-radius:8px}
nav.steps button .n{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--shoal);display:grid;place-items:center;font-size:12px;flex:none;color:var(--depth)}
nav.steps button.on{background:#fff;border-color:var(--line);font-weight:600}
nav.steps button.on .n{background:var(--depth);border-color:var(--depth);color:#fff}
nav.steps button .c{margin-left:auto;font-size:12px;color:var(--mute);font-weight:400}
nav.steps .gate{margin-top:10px;font-size:12.5px;color:var(--mute);padding:10px 12px;border-top:1px solid var(--line)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px 22px;margin-bottom:18px}
h2{font:600 21px/1.2 Bahnschrift,"Segoe UI",sans-serif;margin:0 0 4px}
h3{font:600 16px/1.2 Bahnschrift,"Segoe UI",sans-serif;margin:18px 0 8px;color:var(--depth)}
.lead{color:var(--mute);margin:0 0 14px;font-size:14px;max-width:78ch}
.mentor{font-size:13.5px;background:#f3f8f7;border-left:3px solid var(--shoal);padding:9px 12px;border-radius:4px;margin:0 0 14px;max-width:90ch}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px 14px}
.form .wide{grid-column:1/-1}
label.f{font-size:12.5px;color:var(--mute);display:block;margin-bottom:2px}
input,select,textarea{width:100%;font:inherit;font-size:14px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}
textarea{min-height:70px;resize:vertical;line-height:1.45}
textarea.tall{min-height:200px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--mute);font-weight:600;white-space:nowrap}
td input,td select,td textarea{font-size:13px;padding:4px 6px}
td textarea{min-height:44px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.pill{font-size:11.5px;border-radius:10px;padding:1px 8px;border:1px solid var(--line);color:var(--mute);white-space:nowrap;display:inline-block;margin:1px 2px 1px 0}
.pill.ok{background:var(--okbg);border-color:#b9dcc8;color:var(--ok)}
.pill.warn{background:var(--warnbg);border-color:#ecd59a;color:var(--warn)}
.pill.bad{background:var(--badbg);border-color:#e6bcbc;color:var(--bad)}
.small{font-size:12.5px;color:var(--mute)}
.empty{color:var(--mute);padding:22px 8px;text-align:center;font-size:14px}
.card{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:10px 0;background:#fff}
.card.withdrawn{opacity:.55}
.card .hd{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.card .id{font:600 14px Bahnschrift,"Segoe UI",sans-serif;color:var(--depth)}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px 10px}
@media(max-width:1000px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.flags{margin-top:6px}
q.ev{background:#fff6d8;font-size:12.5px;color:var(--mute);quotes:"\201C" "\201D"}
.check li{margin:4px 0;list-style:none}
.check{padding-left:0}
.check .y::before{content:"\2713";color:var(--ok);font-weight:700;margin-right:8px}
.check .n::before{content:"\25CB";color:var(--warn);margin-right:8px}
.quad{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.quad div{border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:70px;font-size:13px}
.quad b{display:block;font-size:12px;color:var(--mute);font-weight:600;margin-bottom:3px}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:1000px){.cols2{grid-template-columns:1fr}}
.qbank li{margin:5px 0;font-size:13.5px}
.engines{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.eng{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:14px;padding:3px 10px;font-size:12.5px}
.dot{width:9px;height:9px;border-radius:50%;background:#c4cfcc}
.dot.ok{background:var(--ok)}.dot.run{background:var(--buoy)}.dot.err{background:var(--bad)}
dialog{border:none;border-radius:12px;padding:0;max-width:760px;width:94vw;box-shadow:0 20px 60px rgba(16,48,63,.35)}
dialog::backdrop{background:rgba(16,48,63,.45)}
.dlg{padding:20px 22px}
.slot{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:12px 0}
.slot h4{margin:0 0 8px;font:600 15px Bahnschrift,"Segoe UI",sans-serif}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}
.grid2 label{font-size:12.5px;color:var(--mute)}
.foot{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.score{font-weight:700;padding:1px 7px;border-radius:5px}
.s-hi{background:var(--badbg);color:var(--bad)}.s-md{background:var(--warnbg);color:var(--warn)}.s-lo{background:var(--okbg);color:var(--ok)}
.outs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.outs .card h4{margin:0 0 4px;font:600 15px Bahnschrift,"Segoe UI",sans-serif}
.outs .card p{margin:0 0 10px;font-size:13px;color:var(--mute)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{header,nav.steps{display:none}.wrap{display:block}}

:root{--s1:#2a78d6;--s2:#eb6834;--good:#0ca30c;--watch:#fab219;--crit:#d03b3b;--na:#c3c2b7;--grid:#e1e0d9;--axis:#c3c2b7;--muted2:#898781;--surf:#fcfcfb;--seq250:#86b6ef;--seq350:#5598e7;--seq450:#2a78d6;--seq550:#1c5cab;--seq650:#104281}
.wrap{grid-template-columns:200px minmax(0,1fr)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.filters select,.filters input{width:auto;font-size:13px;padding:5px 8px}
.filters .small{margin-left:auto}
.grid{display:grid;gap:14px}
.g-kpi{grid-template-columns:1.3fr repeat(5,1fr)}
.g-2{grid-template-columns:1.6fr 1fr}.g-11{grid-template-columns:1fr 1fr}
@media(max-width:1200px){.g-kpi{grid-template-columns:repeat(3,1fr)}.g-2,.g-11{grid-template-columns:1fr}}
.tile{background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.tile .lab{font-size:12.5px;color:var(--mute)}
.tile .val{font:600 26px/1.15 system-ui,"Segoe UI",sans-serif;color:var(--ink);margin-top:4px}
.tile .sub{font-size:12px;color:var(--mute);margin-top:3px}
.hero .val{font-size:44px}
.card2{background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.card2 h3{margin:0 0 2px;font:600 15px system-ui,"Segoe UI",sans-serif;color:var(--ink)}
.card2 .cap{font-size:12.5px;color:var(--mute);margin:0 0 8px}
.card2 svg{display:block;width:100%;height:auto;overflow:visible}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--mute);margin-top:6px}
.leg span{display:inline-flex;align-items:center;gap:6px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:2px}
.leg i.ln{height:2px;width:14px;border-radius:1px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:10px;padding:1px 8px;white-space:nowrap}
.chip.g{background:#e3f4e3;color:#006300}.chip.w{background:#fff3d6;color:#7a5600}.chip.c{background:#fbe3e3;color:#9b2c2c}.chip.n{background:#eeedea;color:#52514e}
.att{display:flex;flex-direction:column;gap:8px;max-height:420px;overflow:auto}
.att .it{border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer;background:#fff}
.att .it:hover{border-color:var(--shoal)}
.att .it b{font-size:13.5px}.att .it .r{font-size:12px;color:var(--mute);margin-top:3px}
#tip{position:fixed;z-index:50;pointer-events:none;background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:0 6px 20px rgba(16,48,63,.15);padding:7px 10px;font-size:12.5px;display:none;max-width:320px}
#tip .tv{font-weight:700;color:#0b0b0b}#tip .tl{color:#52514e}
.ptable td,.ptable th{font-size:13px}.ptable tr.clk{cursor:pointer}.ptable tr.clk:hover td{background:#f3f8f7}
.ptable th{cursor:pointer;user-select:none}
.parts{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.parts div{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;font-size:12.5px}
.meter{height:10px;border-radius:5px;background:#cde2fb;position:relative;overflow:hidden;margin-top:8px}
.meter b{position:absolute;left:0;top:0;bottom:0;background:var(--s1);border-radius:5px}
.tabs2{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.tabs2 button.on{background:var(--depth);color:#fff;border-color:var(--depth)}
.samp{background:#fff3d6;border:1px solid #ecd59a;color:#7a5600;border-radius:8px;padding:6px 10px;font-size:12.5px;margin-bottom:12px}
@media(max-width:900px){.wrap{grid-template-columns:1fr}nav.steps{position:static!important;top:auto}.wrap>*{min-width:0}.panel,.card2{overflow-x:auto}header{flex-wrap:wrap}.g-kpi{grid-template-columns:1fr 1fr}.g-kpi>*:first-child{grid-column:1/-1}.filters{flex-wrap:wrap}.filters select,.filters input{flex:1 1 140px;max-width:100%;min-width:0}main,#view{min-width:0;max-width:100%;overflow-x:hidden}svg{max-width:100%;height:auto}}
@media print{.filters,nav.steps,header,.noprint{display:none!important}.wrap{display:block}}

// ---------- health engine ----------
const base=p=>N(p.authorized)||N(p.programmed);
const est=p=>N(p.cwe)||N(p.award)||N(p.programmed);
const value=p=>N(p.cwe)||N(p.award)||N(p.authorized)||N(p.programmed);
function lastUpd(p){return p.updates.slice().sort((a,b)=>a.date.localeCompare(b.date)).pop();}
function spi(p,asOf){if(!p.ntp||!p.baseline_finish||p.pct==='') return null;const tot=dd(p.ntp,p.baseline_finish);const el=dd(p.ntp,asOf||today());if(tot<=0||el<=0) return null;const tp=Math.min(1,el/tot);if(tp<.1) return null;return {spi:(N(p.pct)/100)/tp,tp};}
function health(p,asOf){const T=P.t,parts=[];const now=asOf||today();const add=(dim,l,r)=>parts.push({dim,l,r});
 const b=base(p),e=est(p),hasE=!!(N(p.cwe)||N(p.award)),A=N(p.authorized);
 // 1 Legal authority: the estimate against the amount Congress authorized (10 U.S.C. 2853).
 if(A&&hasE){const d=e-A,g=d/A,lim=Math.min(LAW.costPct.v/100*A,2*T.umc);
  if(d>lim) add('Legal authority',2,'Up '+M(d)+' ('+pct(g,1)+') – beyond the '+LAW.costPct.cite+' limit of '+M(lim)+'; needs a waiver and congressional notice before obligating');
  else if(d>0) add('Legal authority',A>LAW.report.v&&g>=.25?1:0,'Up '+M(d)+', inside the '+M(lim)+' variation limit; the Secretary concerned must determine it is needed for unusual cost variations ('+LAW.costPct.cite+')'+(A>LAW.report.v&&g>=.25?' – also needs the 2853(f) report':''));
  else add('Legal authority',0,'Within the authorized amount');}
 else add('Legal authority',-1,A?'No current estimate yet':'No authorized amount recorded');
 // 2 Funds available: can the money on hand cover the estimate?
 const F=N(p.funded);if(F&&hasE){const h=(F-e)/F;
  add('Funds',e>F?2:h*100<T.fundsWatch?1:0,e>F?'Estimate exceeds funds available by '+M(e-F):h*100<T.fundsWatch?'Only '+M(F-e)+' ('+pct(h,1)+') headroom left':M(F-e)+' headroom ('+pct(h,1)+')');}
 else add('Funds',-1,F?'No current estimate yet':'Funds available not recorded');
 // 3 Scope: against the 1391 justification data (10 U.S.C. 2853(b), (d)).
 const sa=N(p.scope_auth),sn=N(p.scope_now),su=p.scope_unit||'';if(sa&&sn){const g=(sn-sa)/sa*100;
  if(g<-LAW.scopeCut.v) add('Scope',2,'Cut '+Math.abs(g).toFixed(1)+'% – beyond the 25% limit of '+LAW.scopeCut.cite+'; needs a waiver and notice');
  else if(g>LAW.scopeUp.v) add('Scope',2,'Up '+g.toFixed(1)+'% – no waiver can approve more than 10% ('+LAW.scopeUp.cite+')');
  else if(g>0) add('Scope',1,'Up '+g.toFixed(1)+'% – needs a waiver and 14-day congressional notice ('+LAW.scopeUp.cite+')');
  else if(g<0) add('Scope',0,'Cut '+Math.abs(g).toFixed(1)+'%, within 25% – facility must stay complete and usable');
  else add('Scope',0,'As in the 1391: '+sn.toLocaleString()+' '+su);}
 else add('Scope',-1,'Scope not recorded');
 // 4 Cost performance: growth against the baseline, by your thresholds.
 if(b&&hasE){const g=(e-b)/b;
  if(g*100>T.costCrit) add('Cost',2,'Up '+pct(g,1)+' on '+M(b));else if(g*100>T.costWatch) add('Cost',1,'Up '+pct(g,1)+' on '+M(b));else add('Cost',0,(g>=0?'Up ':'Down ')+pct(Math.abs(g),1));}
 else add('Cost',-1,'No estimate against the authorized amount yet');
 if(N(p.phase)>=7&&p.baseline_finish&&p.forecast_finish){const s=dd(p.baseline_finish,p.forecast_finish);const sp=spi(p,now);let l=s>T.slipCrit?2:s>T.slipWatch?1:0;let r=s>0?s+' days late to baseline':'On or ahead of baseline';
  if(sp&&N(p.phase)===7){const l2=sp.spi<T.spiCrit?2:sp.spi<T.spiWatch?1:0;if(l2>l){l=l2;}r+='; '+Math.round(N(p.pct))+'% complete at '+pct(sp.tp)+' of time';}add('Schedule',l,r);}
 else{const late=p.milestones.filter(m=>!m.actual&&(m.forecast||m.baseline)&&dd(m.baseline||m.forecast,now)>0);const worst=late.reduce((x,m)=>Math.max(x,dd(m.baseline||m.forecast,now)),0);
  add('Schedule',late.length?(worst>60?2:1):(p.milestones.length?0:-1),late.length?late.length+' milestone'+(late.length>1?'s':'')+' past due, worst '+worst+' days':(p.milestones.length?'Milestones on time':'No milestones recorded'));}
 const or=p.risks.filter(r=>r.status!=='closed');const mx=or.reduce((x,r)=>Math.max(x,N(r.l)*N(r.i)),0);
 add('Risk',or.length?(mx>=T.riskCrit?2:mx>=T.riskWatch?1:0):-1,or.length?'Highest open risk scores '+mx+' of 25 ('+or.length+' open)':'No open risks recorded');
 const ir=irmaFor(p),q=quinnFor(p);if(ir||q){const n=(ir?ir.overdue:0)+(q?q.aged:0);add('Actions',n>=T.actCrit?2:n>=T.actWatch?1:0,[ir?ir.overdue+' RFI/submittal past suspense of '+ir.open+' open':'',q?q.aged+' deficiencies open over 30 days':''].filter(Boolean).join('; '));}
 const lu=lastUpd(p);const stale=!lu||dd(lu.date,today())>T.stale;
 let overall=parts.reduce((x,y)=>Math.max(x,y.l),-1);if(overall<0) overall=0;let ov=false;
 if(p.override&&p.override.level!==''){overall=N(p.override.level);ov=true;}
 return {overall,parts,stale,lastDate:lu?lu.date:'',override:ov};}

function aiOk(){if(window.CARLAI&&CARLAI.state().ok) return true;alert('Sign in to CARL (carl.carlcompliance.com) to write with AI, then reload this page.');return false;}
function numBad(t,src){const S=String(src).replace(/,/g,'');return [...new Set((String(t).match(/\d[\d,.]*/g)||[]).map(x=>x.replace(/,/g,'').replace(/\.$/,'')).filter(x=>x.length>1&&!S.includes(x)))];}
function projFacts(p,h){const L=[];const b=base(p),e=est(p);const U=p.updates.slice().sort((a,c)=>a.date.localeCompare(c.date));const u=U[U.length-1];const ir=irmaFor(p),q=quinnFor(p);
 L.push('PROJECT: '+[p.name,p.number,p.to&&('task order '+p.to),p.installation,p.service,'phase '+p.phase+' '+PHASES[p.phase],p.contractor&&('contractor '+p.contractor)].filter(Boolean).join('; '));
 L.push('HEALTH: '+LEVEL[h.overall].n+(h.override?' (override: '+p.override.reason+')':''));h.parts.forEach(z=>L.push('  '+z.dim+': '+(z.l<0?'not assessed':LEVEL[z.l].n)+' – '+z.r));
 L.push('MONEY: authorized '+M(b)+', current estimate '+M(e)+', award '+M(N(p.award))+', obligated '+M(N(p.obligated))+', expended '+M(N(p.expended)));
 L.push('SCHEDULE: NTP '+(p.ntp||'–')+', baseline finish '+(p.baseline_finish||'–')+', forecast finish '+(p.forecast_finish||'–')+', '+(p.pct!==''?Math.round(N(p.pct))+'% complete':'percent complete not reported'));
 if(u) L.push('LATEST UPDATE '+u.date+': done: '+(u.done||'')+' | next: '+(u.next||'')+' | concerns: '+(u.concerns||'none'));
 p.risks.filter(r=>r.status!=='closed').forEach(r=>L.push('OPEN RISK (score '+N(r.l)*N(r.i)+'): '+r.text+(r.response?'; response: '+r.response:'')));
 p.milestones.filter(m=>!m.actual).forEach(m=>L.push('MILESTONE: '+m.name+' baseline '+(m.baseline||'–')+' forecast '+(m.forecast||'–')));
 if(ir) L.push('RFIS AND SUBMITTALS: '+ir.open+' open, '+ir.overdue+' past suspense');if(q) L.push('DEFICIENCIES: '+q.open+' open, '+q.aged+' open over 30 days');
 if(p.decisions) L.push('DECISIONS NEEDED: '+p.decisions);return L;}

Return ONLY JSON: {"text":"the paragraphs, separated by a blank line"}`;

  p.ai_note={text:t,at:new Date().toISOString(),check:bad.length?'Check these numbers, not found in the project data: '+bad.join(', '):''};save();vOne();}
 catch(err){alert('Failed: '+err.message);b.disabled=false;b.textContent='Explain with AI';}}

// ---------- chart helpers ----------
function niceMax(v){if(v<=0) return 1;const e=Math.pow(10,Math.floor(Math.log10(v)));const f=v/e;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*e;}
function rbar(x,y,w,h,r,dir){r=Math.min(r,dir==='h'?h/2:w/2,dir==='h'?w:h);if(w<=0||h<=0) return '';
 return dir==='h'?'M'+x+','+y+'h'+(w-r)+'a'+r+','+r+' 0 0 1 '+r+','+r+'v'+(h-2*r)+'a'+r+','+r+' 0 0 1 -'+r+','+r+'h-'+(w-r)+'z':'M'+x+','+(y+h)+'v-'+(h-r)+'a'+r+','+r+' 0 0 1 '+r+',-'+r+'h'+(w-2*r)+'a'+r+','+r+' 0 0 1 '+r+','+r+'v'+(h-r)+'z';}
function hbars(rows,{fmt=M,colors,w=520,lab=150}={}){const bh=18,gap=12,H=rows.length*(bh+gap)+4;const mx=niceMax(Math.max(...rows.map(r=>r.v),1));const W=w-lab-70;
 return '<svg viewBox="0 0 '+w+' '+H+'" role="img">'+rows.map((r,i)=>{const y=i*(bh+gap)+2;const bw=Math.max(r.v>0?3:0,r.v/mx*W);const c=colors?colors[i]:'var(--s1)';
  return '<text x="'+(lab-8)+'" y="'+(y+13)+'" text-anchor="end" font-size="12.5" fill="#52514e">'+esc(r.k.length>24?r.k.slice(0,23)+'…':r.k)+'</text><g'+tipA(fmt(r.v)+'\n'+r.k+(r.t?'\n'+r.t:''))+'><rect x="'+lab+'" y="'+(y-4)+'" width="'+(W+60)+'" height="'+(bh+8)+'" fill="transparent"/><path d="'+rbar(lab,y,bw,bh,4,'h')+'" fill="'+c+'"/></g><text x="'+(lab+bw+6)+'" y="'+(y+13)+'" font-size="12.5" fill="#0b0b0b">'+esc(fmt(r.v))+'</text>';}).join('')+'</svg>';}
function axisY(mx,x0,y0,y1,W,fmt,ticks=4){let s='';for(let i=0;i<=ticks;i++){const v=mx*i/ticks,y=y1-(y1-y0)*i/ticks;s+='<line x1="'+x0+'" x2="'+W+'" y1="'+y+'" y2="'+y+'" stroke="'+(i?'var(--grid)':'var(--axis)')+'" stroke-width="1"/><text x="'+(x0-6)+'" y="'+(y+4)+'" text-anchor="end" font-size="11" fill="#898781">'+fmt(v)+'</text>';}return s;}
function stackCols(cats,series,{W=560,H=240,fmt=v=>v}={}){const x0=34,y0=10,y1=H-38,cw=(W-x0)/cats.length,bw=Math.min(24,cw*.55);const tot=cats.map((c,i)=>series.reduce((s,se)=>s+se.v[i],0));const mx=niceMax(Math.max(...tot,1));
 const tk=mx<=5?Math.max(1,Math.round(mx)):(mx%5===0?5:4);let s='<svg viewBox="0 0 '+W+' '+H+'" role="img">'+axisY(mx,x0,y0,y1,W,v=>Math.round(v),tk);
 cats.forEach((c,i)=>{const cx=x0+cw*i+cw/2;let y=y1;const nz=series.map((se,k)=>[k,se.v[i]]).filter(z=>z[1]>0);
  nz.forEach(([k,v],j)=>{const h=v/mx*(y1-y0);const top=j===nz.length-1;const yy=y-h;s+='<g'+tipA(v+' '+series[k].n.toLowerCase()+'\n'+c.full)+'>'+(top?'<path d="'+rbar(cx-bw/2,yy+(j?1:0),bw,h-(j?1:0),4,'v')+'" fill="'+series[k].c+'"/>':'<rect x="'+(cx-bw/2)+'" y="'+(yy+(j?1:0))+'" width="'+bw+'" height="'+Math.max(0,h-(j?2:0)-0)+'" fill="'+series[k].c+'"/>')+'<rect x="'+(cx-cw/2)+'" y="'+yy+'" width="'+cw+'" height="'+h+'" fill="transparent"/></g>';y=yy;});
  if(tot[i]) s+='<text x="'+cx+'" y="'+(y-5)+'" text-anchor="middle" font-size="11.5" fill="#0b0b0b">'+tot[i]+'</text>';
  s+='<text x="'+cx+'" y="'+(y1+15)+'" text-anchor="middle" font-size="11" fill="#52514e">'+esc(c.k)+'</text>'+(c.k2?'<text x="'+cx+'" y="'+(y1+28)+'" text-anchor="middle" font-size="10" fill="#898781">'+esc(c.k2)+'</text>':'');});
 return s+'</svg>';}
function lines(xs,series,{W=560,H=240,fmt=M,xfmt=x=>x,ref=null}={}){const x0=50,y0=12,y1=H-28,x1=W-70;const all=series.flatMap(s=>s.v.filter(v=>v!=null)).concat(ref?[ref.v]:[]);const mx=niceMax(Math.max(...all,1));const X=i=>x0+(xs.length>1?(x1-x0)*i/(xs.length-1):0),Y=v=>y1-(v/mx)*(y1-y0);

 series.forEach(se=>{let d='',last=null;se.v.forEach((v,i)=>{if(v==null) return;d+=(d?'L':'M')+X(i).toFixed(1)+','+Y(v).toFixed(1);last=i;});s+='<path d="'+d+'" fill="none" stroke="'+se.c+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';

 return s+'</svg>';}

const REGIONS={'Indo-Pacific':null,'Japan and Korea':[123,147,24,45],'Guam and CNMI':[143.4,146.6,12.9,16.2],'Philippines':[115,128,4,21],'Okinawa':[126.5,129,25.6,27.2],'Hawaii':[-161,-154,18.5,22.6],'Alaska':[-170,-140,54,71.5],'Australia':[110,156,-44,-9],'India and Diego Garcia':[66,96,-10,32]};
const MZ={v:null};
function mapEl(){return document.getElementById('pmap');}
function mzSet(v){const W=MAP.W,Hh=MAP.H;let [x,y,w,h]=v;const minW=W/40;if(w>W){w=W;h=Hh;}if(w<minW){h=h*minW/w;w=minW;}x=Math.max(0,Math.min(W-w,x));y=Math.max(0,Math.min(Hh-h,y));MZ.v=[x,y,w,h];const s=mapEl();if(!s) return;
 s.setAttribute('viewBox',MZ.v.map(n=>n.toFixed(2)).join(' '));const rw=s.getBoundingClientRect().width||W;const k=w/rw;s.querySelectorAll('g.mk').forEach(g=>g.setAttribute('transform','translate('+g.dataset.x+' '+g.dataset.y+') scale('+k.toFixed(4)+')'));}
function mzZoom(f,cx,cy){const W=MAP.W,Hh=MAP.H;const v=MZ.v||[0,0,W,Hh];if(cx==null){cx=v[0]+v[2]/2;cy=v[1]+v[3]/2;}const w=v[2]/f,h=v[3]/f;mzSet([cx-(cx-v[0])/f,cy-(cy-v[1])/f,w,h]);}
function mzRegion(name){const b=REGIONS[name];const W=MAP.W,Hh=MAP.H;if(!b){mzSet([0,0,W,Hh]);return;}
 const X=lon=>(((lon<-30?lon+360:lon)-MAP.L0)/(MAP.L1-MAP.L0))*W,Y=lat=>((MAP.B1-lat)/(MAP.B1-MAP.B0))*Hh;let x0=X(b[0]),x1=X(b[1]),y0=Y(b[3]),y1=Y(b[2]);let w=x1-x0,h=y1-y0;const ar=Hh/W;if(h/w>ar){const nw=h/ar;x0-=(nw-w)/2;w=nw;}else{const nh=w*ar;y0-=(nh-h)/2;h=nh;}mzSet([x0,y0,w,h]);}
function svgPt(s,e){const r=s.getBoundingClientRect(),v=MZ.v||[0,0,MAP.W,MAP.H];return [v[0]+(e.clientX-r.left)/r.width*v[2],v[1]+(e.clientY-r.top)/r.height*v[3]];}
(function(){const ptrs=new Map();let drag=null,moved=false,pinch=null;
 document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-mz],[data-mreg]');if(b){e.preventDefault();if(b.dataset.mreg) mzRegion(b.dataset.mreg);else if(b.dataset.mz==='reset') mzRegion('Indo-Pacific');else mzZoom(b.dataset.mz==='in'?2:.5);return;}
  if(moved&&e.target.closest&&e.target.closest('#pmap')){e.stopPropagation();e.preventDefault();moved=false;}},true);
 document.addEventListener('wheel',e=>{const s=e.target.closest&&e.target.closest('#pmap');if(!s) return;e.preventDefault();const [cx,cy]=svgPt(s,e);mzZoom(e.deltaY<0?1.25:.8,cx,cy);},{passive:false});
 document.addEventListener('dblclick',e=>{const s=e.target.closest&&e.target.closest('#pmap');if(!s) return;const [cx,cy]=svgPt(s,e);mzZoom(e.shiftKey?.5:2,cx,cy);});
 document.addEventListener('pointerdown',e=>{const s=e.target.closest&&e.target.closest('#pmap');if(!s) return;ptrs.set(e.pointerId,[e.clientX,e.clientY]);moved=false;
  if(ptrs.size===1) drag={x:e.clientX,y:e.clientY,v:(MZ.v||[0,0,MAP.W,MAP.H]).slice(),s};else if(ptrs.size===2){const a=[...ptrs.values()];pinch={d:Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]),v:(MZ.v||[0,0,MAP.W,MAP.H]).slice(),c:svgPt(s,{clientX:(a[0][0]+a[1][0])/2,clientY:(a[0][1]+a[1][1])/2})};drag=null;}});
 document.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId)) return;ptrs.set(e.pointerId,[e.clientX,e.clientY]);
  if(pinch&&ptrs.size===2){const a=[...ptrs.values()];const d=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);const f=d/pinch.d;const v=pinch.v;const [cx,cy]=pinch.c;mzSet([cx-(cx-v[0])/f,cy-(cy-v[1])/f,v[2]/f,v[3]/f]);moved=true;return;}
  if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>4) moved=true;if(!moved) return;const r=drag.s.getBoundingClientRect();const v=drag.v;mzSet([v[0]-dx/r.width*v[2],v[1]-dy/r.height*v[3],v[2],v[3]]);drag.s.style.cursor='grabbing';}});
 window.addEventListener('resize',()=>{if(mapEl()) mzSet(MZ.v||[0,0,MAP.W,MAP.H]);});const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2) pinch=null;if(!ptrs.size&&drag){drag.s.style.cursor='grab';drag=null;}};document.addEventListener('pointerup',up);document.addEventListener('pointercancel',up);})();
function scatter(H){const W=560,Ht=300,x0=48,x1=W-16,y0=12,y1=Ht-36;const pts=H.filter(x=>N(x.p.award)&&x.p.baseline_finish&&x.p.forecast_finish).map(x=>({x,sx:dd(x.p.baseline_finish,x.p.forecast_finish),gy:(est(x.p)-base(x.p))/(base(x.p)||1)*100}));
 if(!pts.length) return '<div class="empty">No awarded projects with a baseline and forecast completion yet.</div>';
 const xmx=Math.max(60,...pts.map(p=>Math.abs(p.sx)))*1.1,ymx=Math.max(10,...pts.map(p=>Math.abs(p.gy)))*1.1;const X=v=>x0+(v+xmx)/(2*xmx)*(x1-x0),Y=v=>y1-(v+ymx)/(2*ymx)*(y1-y0);const mxv=Math.max(...pts.map(p=>value(p.x.p)));
 let s='<svg viewBox="0 0 '+W+' '+Ht+'" role="img"><rect x="'+X(0)+'" y="'+y0+'" width="'+(x1-X(0))+'" height="'+(Y(0)-y0)+'" fill="#fbe3e3" fill-opacity=".45"/>';
 [-1,-.5,0,.5,1].forEach(f=>{s+='<line x1="'+X(f*xmx)+'" x2="'+X(f*xmx)+'" y1="'+y0+'" y2="'+y1+'" stroke="'+(f?'var(--grid)':'var(--axis)')+'"/><text x="'+X(f*xmx)+'" y="'+(y1+15)+'" text-anchor="middle" font-size="11" fill="#898781">'+Math.round(f*xmx)+'</text>';s+='<line x1="'+x0+'" x2="'+x1+'" y1="'+Y(f*ymx)+'" y2="'+Y(f*ymx)+'" stroke="'+(f?'var(--grid)':'var(--axis)')+'"/><text x="'+(x0-6)+'" y="'+(Y(f*ymx)+4)+'" text-anchor="end" font-size="11" fill="#898781">'+Math.round(f*ymx)+'%</text>';});

 pts.sort((a,b)=>value(b.x.p)-value(a.x.p)).forEach(p=>{const r=5+Math.sqrt(value(p.x.p)/mxv)*12;s+='<g style="cursor:pointer" data-open="'+p.x.p.id+'"'+tipA(p.x.p.name+'\n'+(p.gy>=0?'+':'')+p.gy.toFixed(1)+'% cost · '+(p.sx>=0?'+':'')+p.sx+' days\n'+M(value(p.x.p))+' · '+LEVEL[p.x.h.overall].n)+'>'+shape(p.x.h.overall,X(p.sx),Y(p.gy),r)+'<circle cx="'+X(p.sx)+'" cy="'+Y(p.gy)+'" r="'+Math.max(12,r)+'" fill="transparent"/></g>';});
 const worst=pts.slice().sort((a,b)=>(b.gy/ymx+b.sx/xmx)-(a.gy/ymx+a.sx/xmx))[0];if(worst&&(worst.gy>0||worst.sx>0)) s+='<text x="'+(X(worst.sx)+(X(worst.sx)>x1-120?-12:12))+'" y="'+(Y(worst.gy)-10)+'" '+(X(worst.sx)>x1-120?'text-anchor="end" ':'')+'font-size="11.5" fill="#0b0b0b">'+esc(worst.x.p.name.slice(0,30))+'</text>';
 return s+'</svg>';}

function funnel(L){const k=[['Programmed (1391)',L.reduce((s,p)=>s+N(p.programmed),0)],['Authorized',L.reduce((s,p)=>s+N(p.authorized),0)],['Awarded',L.reduce((s,p)=>s+N(p.award),0)],['Obligated',L.reduce((s,p)=>s+N(p.obligated),0)],['Expended',L.reduce((s,p)=>s+N(p.expended),0)]];

function scurve(L){const A=L.filter(p=>N(p.award)&&p.ntp&&p.baseline_finish);if(!A.length) return '<div class="empty">No awarded projects with notice to proceed and baseline completion.</div>';

function parseCSV(t){const rows=[];let r=[''],q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){r[r.length-1]+='"';i++;}else q=false;}else r[r.length-1]+=c;}else if(c==='"') q=true;else if(c===',') r.push('');else if(c==='\n'){rows.push(r);r=[''];}else if(c!=='\r') r[r.length-1]+=c;}if(r.length>1||r[0]) rows.push(r);return rows;}

const fd=d=>{if(!d) return '';const x=new Date(d+'T00:00');return isNaN(x)?d:x.getDate()+' '+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][x.getMonth()]+' '+x.getFullYear();};
function suiteFacts(p){const since=(lastUpd(p)||{}).date||addD(today(),-14);const F2={done:[],next:[],con:[],src:new Set()};
 p.milestones.forEach(m=>{if(m.actual&&m.actual>since){F2.done.push(m.name+' completed '+fd(m.actual)+'.');F2.src.add('milestones');}const d=m.forecast||m.baseline;if(!m.actual&&d&&d>=today()&&d<=addD(today(),30)){F2.next.push(m.name+' due '+fd(d)+(m.baseline&&m.forecast&&m.forecast>m.baseline?' (forecast late)':'')+'.');F2.src.add('milestones');}});
 try{const Q=JSON.parse(localStorage.getItem('quinn_project')||'null');if(Q&&p.to){const bl=Q.registry.filter(r=>String(r.to||'').toLowerCase()===String(p.to).toLowerCase()).map(r=>r.building);
  if(bl.length){const rs=Q.records.filter(r=>bl.includes(r.building)&&r.date>since);if(rs.length){F2.done.push(rs.length+' inspection report'+(rs.length>1?'s':'')+' filed for '+bl.join(', ')+'.');F2.src.add('QUINN');}
   const cl=Q.issues.filter(i=>bl.includes(i.building)&&i.status==='closed'&&i.closed>since);if(cl.length){F2.done.push(cl.length+' deficienc'+(cl.length>1?'ies':'y')+' closed.');F2.src.add('QUINN');}}}}catch(e){}
 const q=quinnFor(p);if(q&&q.open){F2.con.push(q.open+' open deficienc'+(q.open>1?'ies':'y')+(q.aged?', '+q.aged+' open over 30 days':'')+'.');F2.src.add('QUINN');}
 const ir=irmaFor(p);if(ir&&ir.open){F2.con.push(ir.open+' open RFI'+(ir.open>1?'s and submittals':' or submittal')+(ir.overdue?', '+ir.overdue+' past suspense':'')+'.');F2.src.add('IRMA');}
 const h=health(p);h.parts.filter(z=>z.l>0).forEach(z=>{F2.con.push(z.dim+': '+z.r+'.');F2.src.add('health engine');});
 p.risks.filter(r=>r.status!=='closed'&&N(r.l)*N(r.i)>=P.t.riskWatch).forEach(r=>{F2.con.push('Risk: '+r.text+(r.response?' ('+r.response+')':'')+'.');F2.src.add('risks');});
 return F2;}
const UPD_SYS=`You draft a construction project's biweekly status update for a program manager. Three short fields in plain language, one to three sentences each: what was done this period, what is next, and concerns or help needed. Use ONLY facts in FACTS and state figures exactly as given. If a field has no facts, write "Nothing reported." No references to AI.
Return ONLY JSON: {"done":"…","next":"…","concerns":"…"}`;
function fillDraft(p){const F2=suiteFacts(p);const src=[...F2.src];const d=p.draft&&p.draft.date===today()?p.draft:{done:F2.done.join(' '),next:F2.next.join(' '),concerns:F2.con.join(' '),ai:false};
 [['u_done','done'],['u_next','next'],['u_con','concerns']].forEach(([id,k])=>{const el=$('#'+id);if(el&&!el.value) el.value=d[k]||'';});
 const box=$('#u_src');if(!box) return;
 box.innerHTML=(src.length?'Drafted from '+esc(src.join(', '))+(d.ai?', worded with AI':'')+'. Check it, add what the tools can’t know, then save.':'Nothing in the suite for this period yet. Write the update, or link the task order so QUINN and IRMA feed it.')+(d.check?' <b style="color:var(--crit)">'+esc(d.check)+'</b>':'')+
  (src.length&&window.CARLAI&&CARLAI.state().ok?' <button class="sm" id="bUAI">'+(d.ai?'Reword with AI':'Word it with AI')+'</button>':'');
 if($('#bUAI')) $('#bUAI').onclick=()=>aiDraft(p,F2,true);
 if(src.length&&!d.ai&&!(p.draft&&p.draft.date===today())&&window.CARLAI&&CARLAI.state().ok) aiDraft(p,F2,false);}
async function aiDraft(p,F2,force){const facts=['DONE: '+(F2.done.join(' ')||'none'),'NEXT: '+(F2.next.join(' ')||'none'),'CONCERNS: '+(F2.con.join(' ')||'none')].join('\n');
 const box=$('#u_src');if(box) box.textContent='Wording the draft with AI from the suite facts…';
 try{let j=await CARLAI.ask('claude',UPD_SYS,'PROJECT: '+(p.name||'')+'\nFACTS:\n'+facts);let bad=numBadW([j.done,j.next,j.concerns].join(' '),facts);if(bad.length){const j2=await CARLAI.ask('claude',UPD_SYS,'PROJECT: '+(p.name||'')+'\nFACTS:\n'+facts+'\n\nYOUR DRAFT:\n'+JSON.stringify(j)+'\n\nCORRECTIONS: these numbers are not in FACTS: '+bad.join(', ')+'. Fix them, keep everything else.');if(j2&&(j2.done||j2.concerns)){j=j2;bad=numBadW([j.done,j.next,j.concerns].join(' '),facts);}}
  p.draft={date:today(),done:String(j.done||''),next:String(j.next||''),concerns:String(j.concerns||''),ai:true,check:bad.length?'Check these numbers, not in the suite data: '+bad.join(', '):''};save();
  if(UPD===p.id&&VIEW==='upd'){[['u_done','done'],['u_next','next'],['u_con','concerns']].forEach(([id,k])=>{const el=$('#'+id);if(el&&(force||!el.dataset.typed)) el.value=p.draft[k];});fillDraft(p);}}
 catch(e){p.draft={date:today(),done:F2.done.join(' '),next:F2.next.join(' '),concerns:F2.con.join(' '),ai:false};if(UPD===p.id&&VIEW==='upd') fillDraft(p);}}

  var DEF=function(){return [{provider:'carl',label:'Reader A',role:'reader',model:'reader-a',enabled:true},{provider:'carl',label:'Reader B',role:'reader',model:'reader-b',enabled:true},{provider:'carl',label:'Reviewer',role:'arbiter',model:'reviewer',enabled:true}];};
  var _load=loadSettings,_save=typeof saveSettings==='function'?saveSettings:null,_call=callAI,_base=typeof defaultBase==='function'?defaultBase:null;
  loadSettings=function(){var s=_load();
   if(!s.slots.some(function(x){return x.key||x.provider==='carl';})) s.slots=DEF().map(function(d,i){return Object.assign({},SLOT_DEF,s.slots[i]||{},d,{key:''});});
   s.slots.forEach(function(x){if(x.provider==='carl'){if(x.role==='arbiter'){x.model='reviewer';x.label='Reviewer';}else if(/gemini|reader-b/i.test(x.model)){x.model='reader-b';x.label='Reader B';}else{x.model='reader-a';x.label='Reader A';}}});
   s.slots.forEach(function(x){if(x.provider==='carl'&&x.enabled&&ST.ok!==true){x.enabled=false;x._carlOff=true;}});return s;};
  if(_save) saveSettings=function(){var off=SET.slots.filter(function(x){return x._carlOff&&!x.enabled;});off.forEach(function(x){x.enabled=true;});try{return _save.apply(this,arguments);}finally{off.forEach(function(x){x.enabled=false;});}};
  if(_base) defaultBase=function(p){return p==='carl'?'carl.carlcompliance.com':_base(p);};
  callAI=async function(slot,sys,user,images){if(slot.provider!=='carl') return _call.apply(this,arguments);
   // The connection test goes to the quick tier; real work stays on the slot's model.
   var test=sys==='Reply with JSON only.'&&/"ok":true/.test(user||'');return ask(test?'fast':slot.model,sys,user,images,{fresh:test});};
 }
 fetch(BASE+'/api/assist',{credentials:'include'}).then(function(r){return r.json().catch(function(){return {};}).then(function(j){
   if(r.ok&&j.ok) ST={ok:true,user:j.user||'',msg:'Signed in to CARL'};
   else ST={ok:false,msg:r.status===401?'Not signed in to CARL':(j.error||('CARL HTTP '+r.status))};});})
  .catch(function(){ST={ok:false,msg:'CARL could not be reached'};})
  .then(function(){try{if(typeof loadSettings==='function'&&typeof SET!=='undefined') SET=loadSettings();}catch(e){}try{if(typeof renderEngines==='function') renderEngines();}catch(e){}
   READY.splice(0).forEach(function(f){try{f(ST);}catch(e){}});
   // Redraw once so the tool's own text reflects CARL being available.
   if(ST.ok&&typeof render==='function'&&typeof callAI!=='function'){try{render();}catch(e){}}
   if(ST.ok&&typeof render==='function'&&typeof callAI==='function'&&window.MS_TOOL==='irma'){try{render();}catch(e){}}
   if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',badge);else badge();});
 // Connecting other AI services (the .mil build's GenAI.mil, for one) is an administrator task.
 function gate(){var adm=false;try{adm=localStorage.getItem('carl_ai_admin')==='1';}catch(e){}var b=document.getElementById('bSettings');if(b&&!adm) b.style.display='none';}
 if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',gate);else gate();
})();
