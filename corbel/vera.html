<!DOCTYPE html>
<html lang="en">

<meta charset="utf-8">
<script id="corbel-pf">/* Corbel portfolios: each portfolio keeps its own copy of every tool's data in this browser.
   "My portfolio" uses the plain keys; any other portfolio stores its keys as pf:<id>:<key>. */
(function(){
 var ls;try{ls=window.localStorage;}catch(e){return;}if(!ls||window.CorbelPF) return;
 var SP=Storage.prototype,g=SP.getItem,s=SP.setItem,r=SP.removeItem;
 var SHARED={corbel_role:1,corbel_issues:1,corbel_portfolio:1,carl_ai_base:1,carl_ai_admin:1,paula_layout:1};// carl_ai_cache stays with its portfolio, so test answers never reach real work
 function cur(){try{return g.call(ls,'corbel_portfolio')||'';}catch(e){return '';}}
 function nk(k){var c=cur();k=String(k);return c&&!SHARED[k]&&k.indexOf('pf:')!==0?'pf:'+c+':'+k:k;}
 SP.getItem=function(k){return g.call(this,this===ls?nk(k):k);};
 SP.setItem=function(k,v){return s.call(this,this===ls?nk(k):k,v);};
 SP.removeItem=function(k){return r.call(this,this===ls?nk(k):k);};
 var NAMES={'':'My portfolio',test:'Test portfolio',ipac:'Indo-Pacific rehearsal'};var SEEDED={test:'test_portfolio.json',ipac:'ipac_portfolio.json'};
 function keysOf(id){var out=[],p='pf:'+id+':';for(var i=0;i<ls.length;i++){var k=ls.key(i);if(k&&k.indexOf(p)===0) out.push(k);}return out;}
 function wipe(id){keysOf(id).forEach(function(k){r.call(ls,k);});}
 function seed(id){return fetch('/corbel/'+(SEEDED[id]||'test_portfolio.json'),{cache:'no-cache'}).then(function(x){if(!x.ok) throw new Error('Portfolio data not found');return x.json();}).then(function(j){
   wipe(id);Object.keys(j.keys||{}).forEach(function(k){s.call(ls,'pf:'+id+':'+k,typeof j.keys[k]==='string'?j.keys[k]:JSON.stringify(j.keys[k]));});s.call(ls,'pf:'+id+':corbel_seeded',j.version||'1');});}
 window.CorbelPF={cur:cur,name:function(){return NAMES[cur()]||cur();},names:NAMES,
  use:function(id){id=id||'';var go=function(){if(id) s.call(ls,'corbel_portfolio',id);else r.call(ls,'corbel_portfolio');};
   if(SEEDED[id]&&!g.call(ls,'pf:'+id+':corbel_seeded')) return seed(id).then(go);go();return Promise.resolve();},
  reset:function(id){return seed(id||'test');},
  // One file holding every Corbel tool's data for the current portfolio, and the way back.
  TOOLKEYS:['milcon_store','milcon_record','nora_project','earl_project','piper_project','scott_project','sophie_project','sophie_to_scott','ccs_project','ccs_import','ccs_by_pid','cora_selection','scott_last','irma_project','quinn_project','paula_project','adam_portfolio','hank_portfolio','corbel_lessons','vera_assess'],
  backup:function(){var c=cur(),o={schema:'corbel-backup-1',portfolio:NAMES[c]||c||'My portfolio',saved:new Date().toISOString(),keys:{}},n=0;
   this.TOOLKEYS.forEach(function(k){var v=g.call(ls,nk(k));if(v!=null){o.keys[k]=v;n++;}});
   var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o)],{type:'application/json'}));a.download=(c?'TEST_':'')+'Corbel_Backup_'+new Date().toLocaleDateString('en-CA')+'.json';document.body.appendChild(a);a.click();setTimeout(function(){a.remove();},300);return n;},
  restore:function(file){return file.text().then(function(t){var j=JSON.parse(t);if(j.schema!=='corbel-backup-1'||!j.keys) throw new Error('That is not a Corbel backup file');
   var ks=Object.keys(j.keys).filter(function(k){return window.CorbelPF.TOOLKEYS.indexOf(k)>=0;});if(!ks.length) throw new Error('The backup holds no tool data');
   ks.forEach(function(k){s.call(ls,nk(k),j.keys[k]);});return {n:ks.length,saved:j.saved,from:j.portfolio};});}};
 function band(){if(!cur()||document.getElementById('pfband')) return;var d=document.createElement('div');d.id='pfband';
  d.style.cssText='background:#C9A227;color:#10303F;font:600 13px/1.3 "Segoe UI",system-ui,sans-serif;padding:6px 14px;text-align:center;position:relative;z-index:50';
  d.innerHTML=(NAMES[cur()]||cur())+(cur()==='ipac'?' – projects from the public FY2026 and FY2027 budget books (FY2025–2027 funding), for practice; kept apart from your real projects.':' – sample data, kept apart from your real projects.')+' <a href="/corbel/" style="color:#10303F;text-decoration:underline">Switch on the Corbel home page</a>';
  document.body.insertBefore(d,document.body.firstChild);}
 document.addEventListener('click',function(e){var a=e.target&&e.target.closest&&e.target.closest('a[download]');if(a&&cur()&&!a.hasAttribute('data-no-pf')&&!window.__corbelNoPf){var n=a.getAttribute('download')||'';if(n&&n.indexOf('TEST_')!==0) a.setAttribute('download','TEST_'+n);}},true);
 if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',band);else band();
})();
</script>
<script id="corbel-dt">/* Corbel dates: one date record per project, read the same way by every tool.
   PAULA owns award, notice to proceed and the forecast; HANK owns the turnover actuals.
   An actual date always beats a forecast. Where two tools disagree, both values are kept and flagged. */
(function(){
 if(window.CorbelDates) return;
 var ORDER=[['v1391','1391 validated'],['award','Contract award'],['ntp','Notice to proceed'],['subst','Substantial completion'],['pis','Placed in service'],['final','Final acceptance'],['closeout','Financial close-out']];
 var NAME={};ORDER.forEach(function(o){NAME[o[0]]=o[1];});NAME.possession='Government possession of part of the work';
 var MS={v1391:'1391 validated',award:'Contract award',ntp:'Notice to proceed',pis:'Beneficial occupancy'};
 var HK=['subst','possession','pis','final','closeout'];
 var ISO=/^\d{4}-\d{2}-\d{2}/;
 function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
 var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
 function fd(s){if(!s) return '';var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s);return m?(+m[3])+' '+MON[+m[2]-1]+' '+m[1]:s;}
 function load(k){try{return JSON.parse(localStorage.getItem(k)||'null');}catch(e){return null;}}
 function hank(){return load('hank_portfolio')||{};}
 function item(pid,H){return ((H||hank()).items||{})[pid]||null;}
 // Every recorded value for each date, with where it came from. The owning tool's value is listed first.
 function cands(p,H){var it=item(p.id,H)||{},d=it.dates||{},out={};
  function add(k,date,src,own){if(!ISO.test(date||'')) return;(out[k]=out[k]||[]).push({date:String(date).slice(0,10),src:src,own:own});}
  add('ntp',p.ntp,'PAULA project data','f:ntp');
  HK.forEach(function(k){add(k,d[k],'HANK turnover dates','h:'+k);});
  Object.keys(MS).forEach(function(k){var m=(p.milestones||[]).filter(function(x){return x.name===MS[k];})[0];if(m&&m.actual) add(k,m.actual,'PAULA milestone “'+MS[k]+'”','m:'+MS[k]);});
  return out;}
 function read(p,H){H=H||hank();var c=cands(p,H),v={},conf=[];
  Object.keys(c).forEach(function(k){var L=c[k];v[k]={date:L[0].date,src:L[0].src,n:NAME[k]};var u={};L.forEach(function(x){u[x.date]=1;});if(Object.keys(u).length>1) conf.push({k:k,n:NAME[k],vals:L});});
  return {v:v,conf:conf};}
 // The completion date every tool should use: an actual beats a projection, which beats the forecast.
 function finish(p,H){var r=read(p,H).v;
  if(r.subst) return {date:r.subst.date,kind:'actual',src:'Substantial completion, from HANK'};
  if(r.pis) return {date:r.pis.date,kind:'actual',src:'Placed in service, from '+(r.pis.src.indexOf('HANK')===0?'HANK':'PAULA')};
  if(p.seq&&p.seq.slip>0&&ISO.test(p.seq.finish||'')) return {date:p.seq.finish,kind:'projected',src:'PAULA projected completion'};
  if(ISO.test(p.forecast_finish||'')) return {date:p.forecast_finish,kind:'forecast',src:'PAULA forecast',yr:p.forecast_prec==='year'};
  if(ISO.test(p.baseline_finish||'')) return {date:p.baseline_finish,kind:'baseline',src:'PAULA baseline'};
  return null;}
 // Dates that cannot all be true.
 function check(p,H){H=H||hank();var R=read(p,H),v=R.v,out=[],t=today(),ph=+p.phase||0;
  R.conf.forEach(function(c){out.push({k:c.k,kind:'conflict',text:c.n+' is recorded twice: '+c.vals.map(function(x){return fd(x.date)+' ('+x.src+')';}).join(' and '),vals:c.vals});});
  var prev=null;ORDER.forEach(function(o){var x=v[o[0]];if(!x) return;if(prev&&x.date<prev.d) out.push({k:o[0],kind:'order',text:o[1]+' ('+fd(x.date)+') is before '+prev.n.toLowerCase()+' ('+fd(prev.d)+')'});if(!prev||x.date>prev.d) prev={d:x.date,n:o[1]};});
  if(v.possession&&v.ntp&&v.possession.date<v.ntp.date) out.push({k:'possession',kind:'order',text:'Possession of part of the work ('+fd(v.possession.date)+') is before notice to proceed ('+fd(v.ntp.date)+')'});
  Object.keys(v).forEach(function(k){if(v[k].date>t) out.push({k:k,kind:'future',text:NAME[k]+' is recorded as done on '+fd(v[k].date)+', which is still in the future'});});
  var start=v.ntp&&v.ntp.date;
  if(start&&ISO.test(p.forecast_finish||'')&&p.forecast_finish<start&&!v.subst) out.push({k:'forecast',kind:'order',text:'Forecast completion ('+fd(p.forecast_finish)+') is before notice to proceed ('+fd(start)+')'});
  if(start&&ISO.test(p.baseline_finish||'')&&p.baseline_finish<start) out.push({k:'baseline',kind:'order',text:'Baseline completion ('+fd(p.baseline_finish)+') is before notice to proceed ('+fd(start)+')'});
  if(ph>=8&&!v.subst&&!v.pis) out.push({k:'phase',kind:'phase',text:'The project is in close-out but has no substantial completion or placed-in-service date'});
  if(ph&&ph<7&&(v.subst||v.pis)) out.push({k:'phase',kind:'phase',text:'Turnover dates are recorded, but the project is still at phase '+ph});
  if(ph&&ph<6&&(v.ntp||v.award)&&!(+p.award>0)) out.push({k:'phase',kind:'phase',text:(v.ntp?'Notice to proceed':'Contract award')+' is recorded, but the project is still at phase '+ph});
  return out;}
 // Settle a conflict: write the chosen date to every place that holds a value for it.
 // mem.paula / mem.hank are the calling tool's live objects; the other store is updated in this browser.
 function pick(pid,k,date,mem){mem=mem||{};var PA=mem.paula||load('paula_project'),HA=mem.hank||load('hank_portfolio'),ch=[];
  var p=PA&&(PA.projects||[]).filter(function(x){return x.id===pid;})[0];
  if(p){if(k==='ntp'&&p.ntp!==date){p.ntp=date;ch.push('PAULA project data');}
   var m=MS[k]&&(p.milestones||[]).filter(function(x){return x.name===MS[k];})[0];if(m&&(m.actual||k==='ntp')&&m.actual!==date){m.actual=date;ch.push('PAULA milestone');}}
  var it=HA&&HA.items&&HA.items[pid];if(it&&it.dates&&HK.indexOf(k)>=0&&it.dates[k]&&it.dates[k]!==date){it.dates[k]=date;ch.push('HANK');}
  try{if(!mem.paula&&PA&&p) localStorage.setItem('paula_project',JSON.stringify(PA));if(!mem.hank&&HA&&it) localStorage.setItem('hank_portfolio',JSON.stringify(HA));}catch(e){}
  return ch;}

 // ---------- one capability date, read the same way by every tool ----------
 // Order of evidence: an actual, then the sequenced projection, then the forecast, then the baseline, then an estimate from the fiscal year.
 // live: the caller's own sequencing result for this project ({pf,slip}), when it has one; otherwise the stamp PAULA saved (p.seq).
 function adamT(){var a=(window.CORBEL_ADAM&&window.CORBEL_ADAM())||load('adam_portfolio')||{};var t=a.t||{};return {build:+t.build>0?+t.build:30,risk:t.risk!=null&&t.risk!==''?+t.risk:6};}
 function bod(p){return (p.milestones||[]).filter(function(m){return m.name==='Beneficial occupancy';})[0]||null;}
 function ymAdd(ym,n){var a=+ym.slice(0,4),b=+ym.slice(5,7)-1+n;a+=Math.floor(b/12);b=((b%12)+12)%12;return a+'-'+String(b+1).padStart(2,'0');}
 // A completion cannot come before the project's award, the start of its fiscal year, or its design completing. A forecast or projection that does is set aside and flagged.
 function msD(p,n){var m=(p.milestones||[]).filter(function(x){return x.name===n;})[0];return m?String(m.actual||m.forecast||m.baseline||'').slice(0,10):'';}
 function floorOf(p){var c=[];var fy=+p.fy;if(fy>2000) c.push([(fy-1)+'-10-01','the start of FY'+fy]);var aw=msD(p,'Contract award');if(ISO.test(aw)) c.push([aw,'its award']);var dc=msD(p,'Design complete');if(ISO.test(dc)) c.push([dc,'design complete']);
  c.sort(function(a,b){return a[0]<b[0]?1:-1;});return c[0]||null;}
 function projFinish(p,live,H){var f=finish(p,H);if(f&&f.kind==='actual') return {date:f.date,kind:'actual',src:f.src,est:false};
  var fl=floorOf(p),aside=[];var ok=function(d,what){if(fl&&String(d).slice(0,10)<fl[0]){aside.push(what+' '+fd(String(d).slice(0,10))+' is before '+fl[1]+' – check');return false;}return true;};var r=projFinish0(p,live,ok);if(r&&aside.length){r.flag=aside.join('; ');r.src+=' ('+aside[0]+', so it was not used)';}return r;}
 function projFinish0(p,live,ok){
  var sq=live&&live.slip>0&&ISO.test(live.pf||'')?{finish:live.pf,slip:live.slip}:(p.seq&&p.seq.slip>0&&ISO.test(p.seq.finish||'')?p.seq:null);
  if(sq&&ok(sq.finish,'The projection')) return {date:String(sq.finish).slice(0,10),kind:'projected',src:'Projected completion, '+Math.round(sq.slip/30.4)+' months past its forecast'+(p.seq&&p.seq.chain?': '+p.seq.chain:''),est:false};
  var m=bod(p);
  if(ISO.test(p.forecast_finish||'')&&ok(p.forecast_finish,'The forecast completion')) return {date:p.forecast_finish.slice(0,10),kind:'forecast',src:p.forecast_prec==='year'?'Forecast completion, year only (counted as 31 Dec)':'Forecast completion',est:false,yr:p.forecast_prec==='year'};
  if(m&&ISO.test(m.forecast||'')&&ok(m.forecast,'The forecast beneficial occupancy')) return {date:m.forecast.slice(0,10),kind:'forecast',src:'Forecast beneficial occupancy',est:false};
  if(ISO.test(p.baseline_finish||'')&&ok(p.baseline_finish,'The baseline completion')) return {date:p.baseline_finish.slice(0,10),kind:'baseline',src:'Baseline completion',est:false};
  if(m&&ISO.test(m.baseline||'')&&ok(m.baseline,'The baseline beneficial occupancy')) return {date:m.baseline.slice(0,10),kind:'baseline',src:'Baseline beneficial occupancy',est:false};
  var fy=+p.fy;if(fy>2000){var T=adamT(),now=today().slice(0,7),late=!(+p.award>0)&&(fy+'-09')<now,st=late?now:fy+'-09';
   return {date:ymAdd(st,T.build)+'-01',kind:'estimate',src:late?'Estimate: FY'+fy+' has passed with no award recorded, so award is assumed now, plus '+T.build+' months to build (assumption)':'Estimate: awarded by the end of FY'+fy+' plus '+T.build+' months to build (assumption)',est:true};}
  return null;}
 var KIND={actual:'actual',projected:'projection',forecast:'forecast',baseline:'baseline',estimate:'estimate'};
 // The rule in words, from the same order the code follows, for any method note.
 var ORDER_WORDS='an actual completion, then the sequenced projection, then the forecast, then the baseline, then an estimate from the fiscal year; a forecast or projection earlier than the project’s award, fiscal-year start or design completion is set aside and flagged';
 function ruleText(){var T=adamT();return 'Completion is taken in this order: '+ORDER_WORDS+' (award by the end of the fiscal year plus '+T.build+' months to build, an assumption you can adjust). Late is counted in days: up to '+T.risk+' months past the need date is at risk; more is late.';}
 // Months late (positive) or early (negative) against a need date, and the one status rule: on time, at risk (late by up to the ADAM window), late.
 function moN(s){return +String(s).slice(0,4)*12+(+String(s).slice(5,7))-1;}
 function capSt(gap){if(gap==null) return 'noneed';var r=adamT().risk;return gap<=0?'ok':gap<=r?'risk':'late';}
 // Lateness is counted in days: late by more than the window (6 months by default) is late, so 6 months 26 days is late, not at risk.
 // Months shown: whole months late, rounded up; whole months spare, rounded down.
 function dD(s){s=String(s||'');return s.length===7?s+'-01':s.slice(0,10);}
 function addMo(d,n){var y=+d.slice(0,4),m=+d.slice(5,7)-1+n,dd=+d.slice(8,10);y+=Math.floor(m/12);m=((m%12)+12)%12;var last=new Date(Date.UTC(y,m+1,0)).getUTCDate();return y+'-'+String(m+1).padStart(2,'0')+'-'+String(Math.min(dd,last)).padStart(2,'0');}
 function gapMo(fin,need){if(!fin||!need) return null;var a=Date.parse(dD(fin)),b=Date.parse(dD(need));var d=(a-b)/864e5;var r=d>0?Math.ceil(d/30.4375):-Math.floor(-d/30.4375);return r===0?0:r;}
 function capStD(fin,need){if(!need) return 'noneed';if(!fin) return 'unk';var f=dD(fin),n=dD(need);if(f<=n) return 'ok';return f<=addMo(n,adamT().risk)?'risk':'late';}
 // A capability: the latest completion among its required projects sets the date. byId(pid) returns the project; live(pid) the caller's sequencing for it.
 function capability(r,byId,live,H){var L=(r.links||[]).filter(function(l){return l.role!=='supports';}).map(function(l){return byId(l.pid);}).filter(Boolean);
  if(!L.length) return {st:'none',req:[]};var D=L.map(function(p){return {p:p,d:projFinish(p,live?live(p.id):null,H)};}),miss=D.filter(function(x){return !x.d;}),known=D.filter(function(x){return x.d;});
  if(!known.length) return {st:'unk',req:L,miss:miss};known.sort(function(a,b){return a.d.date<b.d.date?1:a.d.date>b.d.date?-1:0;});var bind=known[0];
  var gap=r.need?gapMo(bind.d.date,r.need):null,st=capStD(bind.d.date,r.need);if(miss.length&&st==='ok') st='unk';
  return {st:st,req:L,cap:bind.d.date,gap:gap,bind:bind,miss:miss,est:!!bind.d.est,flag:bind.d.flag||'',basis:bind.d.src+' ('+KIND[bind.d.kind]+')'};}
 // ---------- capacity as well as date: one rule, read the same way by ADAM, PAULA and the briefs ----------
 // r.caps: [{id,measure,ac,unit,need,src,deliv:[{pid,n}]}]. Each project's date comes from projFinish. Numbers are only what was entered.
 var CAPM=[['parking','Aircraft parking spots','spots'],['rwlen','Runway length','ft'],['pcn','Runway strength','PCN'],['fuel','Fuel storage','bbl'],['thru','Fuel throughput','gal/day'],['hyd','Hydrant outlets','outlets'],['berthl','Berth length','ft'],['berthd','Berth depth','ft'],['pier','Pier or wharf count','piers'],['other','Other','']];
 // A year-only forecast is counted as 31 Dec of that year and shown as the year.
 function fyo(d,yr){return yr&&/^\d{4}/.test(d||'')?d.slice(0,4)+' (year only)':fmy(d);}
 function fmy(d){var m=/^(\d{4})-(\d{2})/.exec(d||'');return m?MON[+m[2]-1]+' '+m[1]:'';}
 function capMeta(c){var m=CAPM.filter(function(x){return x[0]===c.measure;})[0]||CAPM[CAPM.length-1];return {key:m[0],name:c.measure==='other'?(c.label||'Other'):m[1]+(c.measure==='parking'&&c.ac?' ('+c.ac+')':''),unit:c.unit||m[2]};}
 function capacity(r,byId,live,H){var out=[];(r.caps||[]).forEach(function(c){var need=+c.need||0,M=capMeta(c);if(!need) return;
   var rows=(c.deliv||[]).map(function(d){var p=byId(d.pid);if(!p||!(+d.n>0)) return null;var f=projFinish(p,live?live(p.id):null,H);return {p:p,n:+d.n,date:f?f.date:'',est:!!(f&&f.est),yr:!!(f&&f.yr)};}).filter(Boolean);
   rows.sort(function(a,b){return !a.date?1:!b.date?-1:a.date<b.date?-1:a.date>b.date?1:0;});
   var cum=0,steps=[],full='',fyr=false,byNeed=0,nd=r.need?dD(r.need):'',undated=0;rows.forEach(function(x){if(!x.date){undated+=x.n;return;}cum+=x.n;steps.push({date:x.date,cum:cum,p:x.p.name});if(!full&&cum>=need){full=x.date;fyr=x.yr;}if(nd&&x.date<=nd) byNeed+=x.n;});
   var total=cum+undated,u=M.unit?' '+M.unit:'',L={cap:c,name:M.name,unit:M.unit,need:need,steps:steps,full:full,byNeed:byNeed,total:total,undated:undated,src:c.src||''};
   if(!rows.length){L.st='none';L.text=M.name+': '+need+u+' needed; no project delivers it yet';}
   else if(!full){L.st='partial';L.share=Math.min(1,(nd?byNeed:cum)/need);L.text=(nd?byNeed:cum)+' of '+need+u+(nd?' by the need date':'')+'; full capacity not yet planned ('+total+u+' in all'+(undated?', '+undated+' with no date':'')+')';}
   else if(!nd){L.st='ok';L.text='Full capacity by '+fyo(full,fyr)+' (no need date)';}
   else if(full<=nd){var sp=-gapMo(full,nd);L.st='ok';L.text='Full capacity by '+fyo(full,fyr)+(sp>0?' ('+sp+' mo spare)':' (on the date)');}
   else if(byNeed>0){L.st='partial';L.share=byNeed/need;L.text=byNeed+' of '+need+u+' by the need date; full capacity '+fyo(full,fyr);}
   else{var g=gapMo(full,nd);L.st=capStD(full,nd);L.text='Full capacity by '+fyo(full,fyr)+' (+'+g+' mo late)';}
   L.line=M.name+': '+L.text;out.push(L);});
  var part=out.filter(function(x){return x.st==='partial';});return {lines:out,partial:part.length>0,share:part.length?Math.min.apply(null,part.map(function(x){return x.share||0;})):1,any:out.length>0};}
 // A logged time in this computer's local time zone (logs are stored in UTC).
 function lt(iso){var d=new Date(iso);if(isNaN(d)) return String(iso||'').slice(0,16).replace('T',' ');var z=function(n){return String(n).padStart(2,'0');};return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())+' '+z(d.getHours())+':'+z(d.getMinutes());}
 window.CorbelDates={ORDER:ORDER,NAME:NAME,read:read,finish:finish,check:check,pick:pick,fd:fd,lt:lt,projFinish:projFinish,fyo:fyo,fmy:fmy,capability:capability,capacity:capacity,CAPM:CAPM,capMeta:capMeta,capSt:capSt,capStD:capStD,gapMo:gapMo,ruleText:ruleText,KIND:KIND,adamT:adamT};
})();

<script id="corbel-id">/* Corbel identity: one Service name, one installation name and one project number form across every tool,

  if(omAmt&&cMin>LAWR.umcOM.v) F.push([2,'O&M funding on a '+lawM(cMin)+' minor construction project: O&M may pay only for projects up to '+lawM(LAWR.umcOM.v)+'.','umcOM']);

 if(!a&&omAmt&&work==='new'&&cost>LAWR.umcOM.v) F.push([1,'O&M funding on new work above '+lawM(LAWR.umcOM.v)+': O&M cannot pay for construction above that amount. Record the construction authority.','umcOM']);

 // posture: capabilities late or only partial

// Date and place from a JPEG's EXIF block, where present.
function exif(buf){try{const d=new DataView(buf);if(d.getUint16(0)!==0xFFD8) return {};let o=2;while(o<d.byteLength-4){const m=d.getUint16(o);const len=d.getUint16(o+2);if(m===0xFFE1&&d.getUint32(o+4)===0x45786966){return tiff(d,o+10);}if((m&0xFF00)!==0xFF00) break;o+=2+len;}}catch(e){}return {};
 function tiff(d,t){const le=d.getUint16(t)===0x4949;const u16=x=>d.getUint16(x,le),u32=x=>d.getUint32(x,le);const out={};
  const ifd=(off,cb)=>{const n=u16(t+off);for(let i=0;i<n;i++){const e=t+off+2+i*12;cb(u16(e),u16(e+2),u32(e+4),e+8);}};
  const str=(p,n)=>{let s='';for(let i=0;i<n-1;i++) s+=String.fromCharCode(d.getUint8(t+p+i));return s;};
  const rat=p=>u32(t+p)/u32(t+p+4);let exO=0,gpO=0;
  ifd(u32(t+4),(tag,ty,n,v)=>{if(tag===0x8769) exO=u32(v);if(tag===0x8825) gpO=u32(v);if(tag===0x0132&&!out.date) out.date=str(u32(v),n);});
  if(exO) ifd(exO,(tag,ty,n,v)=>{if(tag===0x9003) out.date=str(u32(v),n);});
  if(gpO){const g={};ifd(gpO,(tag,ty,n,v)=>{if(tag===1||tag===3) g[tag]=String.fromCharCode(d.getUint8(v));if(tag===2||tag===4){const p=u32(v);g[tag]=rat(p)+rat(p+8)/60+rat(p+16)/3600;}});if(g[2]!=null&&g[4]!=null){out.lat=+(g[2]*(g[1]==='S'?-1:1)).toFixed(5);out.lon=+(g[4]*(g[3]==='W'?-1:1)).toFixed(5);}}
  if(out.date) out.date=out.date.replace(/^(\d{4}):(\d{2}):(\d{2}).*/,'$1-$2-$3');return out;}}

 const wg=(PA&&PA.wg||[]).filter(g=>(g.pids||[]).some(id=>ids.includes(id))).map(g=>g.members||'').join('; ');
 const att=[...new Set(String((last&&last.att)||'').split(';').concat(wg.split(';')).map(x=>x.trim()).filter(Boolean))].join('; ');
 const of=a.findings.filter(f=>f.site===site.id&&isOpen(f)&&eff(f)!=='sound').sort((x,y)=>RORD.indexOf(eff(x))-RORD.indexOf(eff(y)));
 return {att,purpose:of.length?'Check: '+of.slice(0,4).map(f=>f.stmt).join('; '):'Site familiarization and progress check'};}

<script id="carl-ai">/* CARL shared AI: AI and CARL's library for every tool on carlcompliance.com,

  var _load=loadSettings,_save=typeof saveSettings==='function'?saveSettings:null,_call=callAI,_base=typeof defaultBase==='function'?defaultBase:null;

   s.slots.forEach(function(x){if(x.provider==='carl'){if(x.role==='arbiter'){x.model='reviewer';x.label='Reviewer';}else if(/gemini|reader-b/i.test(x.model)){x.model='reader-b';x.label='Reader B';}else{x.model='reader-a';x.label='Reader A';}}});
