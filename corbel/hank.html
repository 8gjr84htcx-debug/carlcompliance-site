<!DOCTYPE html>
<html lang="en">

<meta charset="utf-8">
<script id="corbel-pf">/* Corbel portfolios: each portfolio keeps its own copy of every tool's data in this browser.
   "My portfolio" uses the plain keys; any other portfolio stores its keys as pf:<id>:<key>. */
(function(){
 var ls;try{ls=window.localStorage;}catch(e){return;}if(!ls||window.CorbelPF) return;
 var SP=Storage.prototype,g=SP.getItem,s=SP.setItem,r=SP.removeItem;
 var SHARED={corbel_role:1,corbel_issues:1,corbel_portfolio:1,carl_ai_base:1,carl_ai_admin:1,paula_layout:1};// carl_ai_cache stays with its portfolio, so test answers never reach real work
 function cur(){try{return g.call(ls,'corbel_portfolio')||'';}catch(e){return '';}}
 function nk(k){var c=cur();k=String(k);return c&&!SHARED[k]&&k.indexOf('pf:')!==0?'pf:'+c+':'+k:k;}
 SP.getItem=function(k){return g.call(this,this===ls?nk(k):k);};
 SP.setItem=function(k,v){return s.call(this,this===ls?nk(k):k,v);};
 SP.removeItem=function(k){return r.call(this,this===ls?nk(k):k);};
 var NAMES={'':'My portfolio',test:'Test portfolio',ipac:'Indo-Pacific rehearsal'};var SEEDED={test:'test_portfolio.json',ipac:'ipac_portfolio.json'};
 function keysOf(id){var out=[],p='pf:'+id+':';for(var i=0;i<ls.length;i++){var k=ls.key(i);if(k&&k.indexOf(p)===0) out.push(k);}return out;}
 function wipe(id){keysOf(id).forEach(function(k){r.call(ls,k);});}
 function seed(id){return fetch('/corbel/'+(SEEDED[id]||'test_portfolio.json'),{cache:'no-cache'}).then(function(x){if(!x.ok) throw new Error('Portfolio data not found');return x.json();}).then(function(j){
   wipe(id);Object.keys(j.keys||{}).forEach(function(k){s.call(ls,'pf:'+id+':'+k,typeof j.keys[k]==='string'?j.keys[k]:JSON.stringify(j.keys[k]));});s.call(ls,'pf:'+id+':corbel_seeded',j.version||'1');});}
 window.CorbelPF={cur:cur,name:function(){return NAMES[cur()]||cur();},names:NAMES,
  use:function(id){id=id||'';var go=function(){if(id) s.call(ls,'corbel_portfolio',id);else r.call(ls,'corbel_portfolio');};
   if(SEEDED[id]&&!g.call(ls,'pf:'+id+':corbel_seeded')) return seed(id).then(go);go();return Promise.resolve();},
  reset:function(id){return seed(id||'test');},
  // One file holding every Corbel tool's data for the current portfolio, and the way back.
  TOOLKEYS:['milcon_store','milcon_record','nora_project','earl_project','piper_project','scott_project','sophie_project','sophie_to_scott','ccs_project','ccs_import','ccs_by_pid','cora_selection','scott_last','irma_project','quinn_project','paula_project','adam_portfolio','hank_portfolio','corbel_lessons','vera_assess'],
  backup:function(){var c=cur(),o={schema:'corbel-backup-1',portfolio:NAMES[c]||c||'My portfolio',saved:new Date().toISOString(),keys:{}},n=0;
   this.TOOLKEYS.forEach(function(k){var v=g.call(ls,nk(k));if(v!=null){o.keys[k]=v;n++;}});
   var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o)],{type:'application/json'}));a.download=(c?'TEST_':'')+'Corbel_Backup_'+new Date().toLocaleDateString('en-CA')+'.json';document.body.appendChild(a);a.click();setTimeout(function(){a.remove();},300);return n;},
  restore:function(file){return file.text().then(function(t){var j=JSON.parse(t);if(j.schema!=='corbel-backup-1'||!j.keys) throw new Error('That is not a Corbel backup file');
   var ks=Object.keys(j.keys).filter(function(k){return window.CorbelPF.TOOLKEYS.indexOf(k)>=0;});if(!ks.length) throw new Error('The backup holds no tool data');
   ks.forEach(function(k){s.call(ls,nk(k),j.keys[k]);});return {n:ks.length,saved:j.saved,from:j.portfolio};});}};
 function band(){if(!cur()||document.getElementById('pfband')) return;var d=document.createElement('div');d.id='pfband';
  d.style.cssText='background:#C9A227;color:#10303F;font:600 13px/1.3 "Segoe UI",system-ui,sans-serif;padding:6px 14px;text-align:center;position:relative;z-index:50';
  d.innerHTML=(NAMES[cur()]||cur())+(cur()==='ipac'?' – projects from the public FY2026 and FY2027 budget books (FY2025–2027 funding), for practice; kept apart from your real projects.':' – sample data, kept apart from your real projects.')+' <a href="/corbel/" style="color:#10303F;text-decoration:underline">Switch on the Corbel home page</a>';
  document.body.insertBefore(d,document.body.firstChild);}
 document.addEventListener('click',function(e){var a=e.target&&e.target.closest&&e.target.closest('a[download]');if(a&&cur()&&!a.hasAttribute('data-no-pf')&&!window.__corbelNoPf){var n=a.getAttribute('download')||'';if(n&&n.indexOf('TEST_')!==0) a.setAttribute('download','TEST_'+n);}},true);
 if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',band);else band();
})();
</script>
<script id="corbel-dt">/* Corbel dates: one date record per project, read the same way by every tool.
   PAULA owns award, notice to proceed and the forecast; HANK owns the turnover actuals.
   An actual date always beats a forecast. Where two tools disagree, both values are kept and flagged. */
(function(){
 if(window.CorbelDates) return;
 var ORDER=[['v1391','1391 validated'],['award','Contract award'],['ntp','Notice to proceed'],['subst','Substantial completion'],['pis','Placed in service'],['final','Final acceptance'],['closeout','Financial close-out']];
 var NAME={};ORDER.forEach(function(o){NAME[o[0]]=o[1];});NAME.possession='Government possession of part of the work';
 var MS={v1391:'1391 validated',award:'Contract award',ntp:'Notice to proceed',pis:'Beneficial occupancy'};
 var HK=['subst','possession','pis','final','closeout'];
 var ISO=/^\d{4}-\d{2}-\d{2}/;
 function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
 var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
 function fd(s){if(!s) return '';var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s);return m?(+m[3])+' '+MON[+m[2]-1]+' '+m[1]:s;}
 function load(k){try{return JSON.parse(localStorage.getItem(k)||'null');}catch(e){return null;}}
 function hank(){return load('hank_portfolio')||{};}
 function item(pid,H){return ((H||hank()).items||{})[pid]||null;}
 // Every recorded value for each date, with where it came from. The owning tool's value is listed first.
 function cands(p,H){var it=item(p.id,H)||{},d=it.dates||{},out={};
  function add(k,date,src,own){if(!ISO.test(date||'')) return;(out[k]=out[k]||[]).push({date:String(date).slice(0,10),src:src,own:own});}
  add('ntp',p.ntp,'PAULA project data','f:ntp');
  HK.forEach(function(k){add(k,d[k],'HANK turnover dates','h:'+k);});
  Object.keys(MS).forEach(function(k){var m=(p.milestones||[]).filter(function(x){return x.name===MS[k];})[0];if(m&&m.actual) add(k,m.actual,'PAULA milestone “'+MS[k]+'”','m:'+MS[k]);});
  return out;}
 function read(p,H){H=H||hank();var c=cands(p,H),v={},conf=[];
  Object.keys(c).forEach(function(k){var L=c[k];v[k]={date:L[0].date,src:L[0].src,n:NAME[k]};var u={};L.forEach(function(x){u[x.date]=1;});if(Object.keys(u).length>1) conf.push({k:k,n:NAME[k],vals:L});});
  return {v:v,conf:conf};}
 // The completion date every tool should use: an actual beats a projection, which beats the forecast.
 function finish(p,H){var r=read(p,H).v;
  if(r.subst) return {date:r.subst.date,kind:'actual',src:'Substantial completion, from HANK'};
  if(r.pis) return {date:r.pis.date,kind:'actual',src:'Placed in service, from '+(r.pis.src.indexOf('HANK')===0?'HANK':'PAULA')};
  if(p.seq&&p.seq.slip>0&&ISO.test(p.seq.finish||'')) return {date:p.seq.finish,kind:'projected',src:'PAULA projected completion'};
  if(ISO.test(p.forecast_finish||'')) return {date:p.forecast_finish,kind:'forecast',src:'PAULA forecast',yr:p.forecast_prec==='year'};
  if(ISO.test(p.baseline_finish||'')) return {date:p.baseline_finish,kind:'baseline',src:'PAULA baseline'};
  return null;}
 // Dates that cannot all be true.
 function check(p,H){H=H||hank();var R=read(p,H),v=R.v,out=[],t=today(),ph=+p.phase||0;
  R.conf.forEach(function(c){out.push({k:c.k,kind:'conflict',text:c.n+' is recorded twice: '+c.vals.map(function(x){return fd(x.date)+' ('+x.src+')';}).join(' and '),vals:c.vals});});
  var prev=null;ORDER.forEach(function(o){var x=v[o[0]];if(!x) return;if(prev&&x.date<prev.d) out.push({k:o[0],kind:'order',text:o[1]+' ('+fd(x.date)+') is before '+prev.n.toLowerCase()+' ('+fd(prev.d)+')'});if(!prev||x.date>prev.d) prev={d:x.date,n:o[1]};});
  if(v.possession&&v.ntp&&v.possession.date<v.ntp.date) out.push({k:'possession',kind:'order',text:'Possession of part of the work ('+fd(v.possession.date)+') is before notice to proceed ('+fd(v.ntp.date)+')'});
  Object.keys(v).forEach(function(k){if(v[k].date>t) out.push({k:k,kind:'future',text:NAME[k]+' is recorded as done on '+fd(v[k].date)+', which is still in the future'});});
  var start=v.ntp&&v.ntp.date;
  if(start&&ISO.test(p.forecast_finish||'')&&p.forecast_finish<start&&!v.subst) out.push({k:'forecast',kind:'order',text:'Forecast completion ('+fd(p.forecast_finish)+') is before notice to proceed ('+fd(start)+')'});
  if(start&&ISO.test(p.baseline_finish||'')&&p.baseline_finish<start) out.push({k:'baseline',kind:'order',text:'Baseline completion ('+fd(p.baseline_finish)+') is before notice to proceed ('+fd(start)+')'});
  if(ph>=8&&!v.subst&&!v.pis) out.push({k:'phase',kind:'phase',text:'The project is in close-out but has no substantial completion or placed-in-service date'});
  if(ph&&ph<7&&(v.subst||v.pis)) out.push({k:'phase',kind:'phase',text:'Turnover dates are recorded, but the project is still at phase '+ph});
  if(ph&&ph<6&&(v.ntp||v.award)&&!(+p.award>0)) out.push({k:'phase',kind:'phase',text:(v.ntp?'Notice to proceed':'Contract award')+' is recorded, but the project is still at phase '+ph});
  return out;}
 // Settle a conflict: write the chosen date to every place that holds a value for it.
 // mem.paula / mem.hank are the calling tool's live objects; the other store is updated in this browser.
 function pick(pid,k,date,mem){mem=mem||{};var PA=mem.paula||load('paula_project'),HA=mem.hank||load('hank_portfolio'),ch=[];
  var p=PA&&(PA.projects||[]).filter(function(x){return x.id===pid;})[0];
  if(p){if(k==='ntp'&&p.ntp!==date){p.ntp=date;ch.push('PAULA project data');}
   var m=MS[k]&&(p.milestones||[]).filter(function(x){return x.name===MS[k];})[0];if(m&&(m.actual||k==='ntp')&&m.actual!==date){m.actual=date;ch.push('PAULA milestone');}}
  var it=HA&&HA.items&&HA.items[pid];if(it&&it.dates&&HK.indexOf(k)>=0&&it.dates[k]&&it.dates[k]!==date){it.dates[k]=date;ch.push('HANK');}
  try{if(!mem.paula&&PA&&p) localStorage.setItem('paula_project',JSON.stringify(PA));if(!mem.hank&&HA&&it) localStorage.setItem('hank_portfolio',JSON.stringify(HA));}catch(e){}
  return ch;}

 // ---------- one capability date, read the same way by every tool ----------
 // Order of evidence: an actual, then the sequenced projection, then the forecast, then the baseline, then an estimate from the fiscal year.
 // live: the caller's own sequencing result for this project ({pf,slip}), when it has one; otherwise the stamp PAULA saved (p.seq).
 function adamT(){var a=(window.CORBEL_ADAM&&window.CORBEL_ADAM())||load('adam_portfolio')||{};var t=a.t||{};return {build:+t.build>0?+t.build:30,risk:t.risk!=null&&t.risk!==''?+t.risk:6};}
 function bod(p){return (p.milestones||[]).filter(function(m){return m.name==='Beneficial occupancy';})[0]||null;}
 function ymAdd(ym,n){var a=+ym.slice(0,4),b=+ym.slice(5,7)-1+n;a+=Math.floor(b/12);b=((b%12)+12)%12;return a+'-'+String(b+1).padStart(2,'0');}
 // A completion cannot come before the project's award, the start of its fiscal year, or its design completing. A forecast or projection that does is set aside and flagged.
 function msD(p,n){var m=(p.milestones||[]).filter(function(x){return x.name===n;})[0];return m?String(m.actual||m.forecast||m.baseline||'').slice(0,10):'';}
 function floorOf(p){var c=[];var fy=+p.fy;if(fy>2000) c.push([(fy-1)+'-10-01','the start of FY'+fy]);var aw=msD(p,'Contract award');if(ISO.test(aw)) c.push([aw,'its award']);var dc=msD(p,'Design complete');if(ISO.test(dc)) c.push([dc,'design complete']);
  c.sort(function(a,b){return a[0]<b[0]?1:-1;});return c[0]||null;}
 function projFinish(p,live,H){var f=finish(p,H);if(f&&f.kind==='actual') return {date:f.date,kind:'actual',src:f.src,est:false};
  var fl=floorOf(p),aside=[];var ok=function(d,what){if(fl&&String(d).slice(0,10)<fl[0]){aside.push(what+' '+fd(String(d).slice(0,10))+' is before '+fl[1]+' – check');return false;}return true;};var r=projFinish0(p,live,ok);if(r&&aside.length){r.flag=aside.join('; ');r.src+=' ('+aside[0]+', so it was not used)';}return r;}
 function projFinish0(p,live,ok){
  var sq=live&&live.slip>0&&ISO.test(live.pf||'')?{finish:live.pf,slip:live.slip}:(p.seq&&p.seq.slip>0&&ISO.test(p.seq.finish||'')?p.seq:null);
  if(sq&&ok(sq.finish,'The projection')) return {date:String(sq.finish).slice(0,10),kind:'projected',src:'Projected completion, '+Math.round(sq.slip/30.4)+' months past its forecast'+(p.seq&&p.seq.chain?': '+p.seq.chain:''),est:false};
  var m=bod(p);
  if(ISO.test(p.forecast_finish||'')&&ok(p.forecast_finish,'The forecast completion')) return {date:p.forecast_finish.slice(0,10),kind:'forecast',src:p.forecast_prec==='year'?'Forecast completion, year only (counted as 31 Dec)':'Forecast completion',est:false,yr:p.forecast_prec==='year'};
  if(m&&ISO.test(m.forecast||'')&&ok(m.forecast,'The forecast beneficial occupancy')) return {date:m.forecast.slice(0,10),kind:'forecast',src:'Forecast beneficial occupancy',est:false};
  if(ISO.test(p.baseline_finish||'')&&ok(p.baseline_finish,'The baseline completion')) return {date:p.baseline_finish.slice(0,10),kind:'baseline',src:'Baseline completion',est:false};
  if(m&&ISO.test(m.baseline||'')&&ok(m.baseline,'The baseline beneficial occupancy')) return {date:m.baseline.slice(0,10),kind:'baseline',src:'Baseline beneficial occupancy',est:false};
  var fy=+p.fy;if(fy>2000){var T=adamT(),now=today().slice(0,7),late=!(+p.award>0)&&(fy+'-09')<now,st=late?now:fy+'-09';
   return {date:ymAdd(st,T.build)+'-01',kind:'estimate',src:late?'Estimate: FY'+fy+' has passed with no award recorded, so award is assumed now, plus '+T.build+' months to build (assumption)':'Estimate: awarded by the end of FY'+fy+' plus '+T.build+' months to build (assumption)',est:true};}
  return null;}
 var KIND={actual:'actual',projected:'projection',forecast:'forecast',baseline:'baseline',estimate:'estimate'};
 // The rule in words, from the same order the code follows, for any method note.
 var ORDER_WORDS='an actual completion, then the sequenced projection, then the forecast, then the baseline, then an estimate from the fiscal year; a forecast or projection earlier than the project’s award, fiscal-year start or design completion is set aside and flagged';
 function ruleText(){var T=adamT();return 'Completion is taken in this order: '+ORDER_WORDS+' (award by the end of the fiscal year plus '+T.build+' months to build, an assumption you can adjust). Late is counted in days: up to '+T.risk+' months past the need date is at risk; more is late.';}
 // Months late (positive) or early (negative) against a need date, and the one status rule: on time, at risk (late by up to the ADAM window), late.
 function moN(s){return +String(s).slice(0,4)*12+(+String(s).slice(5,7))-1;}
 function capSt(gap){if(gap==null) return 'noneed';var r=adamT().risk;return gap<=0?'ok':gap<=r?'risk':'late';}
 // Lateness is counted in days: late by more than the window (6 months by default) is late, so 6 months 26 days is late, not at risk.
 // Months shown: whole months late, rounded up; whole months spare, rounded down.
 function dD(s){s=String(s||'');return s.length===7?s+'-01':s.slice(0,10);}
 function addMo(d,n){var y=+d.slice(0,4),m=+d.slice(5,7)-1+n,dd=+d.slice(8,10);y+=Math.floor(m/12);m=((m%12)+12)%12;var last=new Date(Date.UTC(y,m+1,0)).getUTCDate();return y+'-'+String(m+1).padStart(2,'0')+'-'+String(Math.min(dd,last)).padStart(2,'0');}
 function gapMo(fin,need){if(!fin||!need) return null;var a=Date.parse(dD(fin)),b=Date.parse(dD(need));var d=(a-b)/864e5;var r=d>0?Math.ceil(d/30.4375):-Math.floor(-d/30.4375);return r===0?0:r;}
 function capStD(fin,need){if(!need) return 'noneed';if(!fin) return 'unk';var f=dD(fin),n=dD(need);if(f<=n) return 'ok';return f<=addMo(n,adamT().risk)?'risk':'late';}
 // A capability: the latest completion among its required projects sets the date. byId(pid) returns the project; live(pid) the caller's sequencing for it.
 function capability(r,byId,live,H){var L=(r.links||[]).filter(function(l){return l.role!=='supports';}).map(function(l){return byId(l.pid);}).filter(Boolean);
  if(!L.length) return {st:'none',req:[]};var D=L.map(function(p){return {p:p,d:projFinish(p,live?live(p.id):null,H)};}),miss=D.filter(function(x){return !x.d;}),known=D.filter(function(x){return x.d;});
  if(!known.length) return {st:'unk',req:L,miss:miss};known.sort(function(a,b){return a.d.date<b.d.date?1:a.d.date>b.d.date?-1:0;});var bind=known[0];
  var gap=r.need?gapMo(bind.d.date,r.need):null,st=capStD(bind.d.date,r.need);if(miss.length&&st==='ok') st='unk';
  return {st:st,req:L,cap:bind.d.date,gap:gap,bind:bind,miss:miss,est:!!bind.d.est,flag:bind.d.flag||'',basis:bind.d.src+' ('+KIND[bind.d.kind]+')'};}
 // ---------- capacity as well as date: one rule, read the same way by ADAM, PAULA and the briefs ----------
 // r.caps: [{id,measure,ac,unit,need,src,deliv:[{pid,n}]}]. Each project's date comes from projFinish. Numbers are only what was entered.
 var CAPM=[['parking','Aircraft parking spots','spots'],['rwlen','Runway length','ft'],['pcn','Runway strength','PCN'],['fuel','Fuel storage','bbl'],['thru','Fuel throughput','gal/day'],['hyd','Hydrant outlets','outlets'],['berthl','Berth length','ft'],['berthd','Berth depth','ft'],['pier','Pier or wharf count','piers'],['other','Other','']];
 // A year-only forecast is counted as 31 Dec of that year and shown as the year.
 function fyo(d,yr){return yr&&/^\d{4}/.test(d||'')?d.slice(0,4)+' (year only)':fmy(d);}
 function fmy(d){var m=/^(\d{4})-(\d{2})/.exec(d||'');return m?MON[+m[2]-1]+' '+m[1]:'';}
 function capMeta(c){var m=CAPM.filter(function(x){return x[0]===c.measure;})[0]||CAPM[CAPM.length-1];return {key:m[0],name:c.measure==='other'?(c.label||'Other'):m[1]+(c.measure==='parking'&&c.ac?' ('+c.ac+')':''),unit:c.unit||m[2]};}
 function capacity(r,byId,live,H){var out=[];(r.caps||[]).forEach(function(c){var need=+c.need||0,M=capMeta(c);if(!need) return;
   var rows=(c.deliv||[]).map(function(d){var p=byId(d.pid);if(!p||!(+d.n>0)) return null;var f=projFinish(p,live?live(p.id):null,H);return {p:p,n:+d.n,date:f?f.date:'',est:!!(f&&f.est),yr:!!(f&&f.yr)};}).filter(Boolean);
   rows.sort(function(a,b){return !a.date?1:!b.date?-1:a.date<b.date?-1:a.date>b.date?1:0;});
   var cum=0,steps=[],full='',fyr=false,byNeed=0,nd=r.need?dD(r.need):'',undated=0;rows.forEach(function(x){if(!x.date){undated+=x.n;return;}cum+=x.n;steps.push({date:x.date,cum:cum,p:x.p.name});if(!full&&cum>=need){full=x.date;fyr=x.yr;}if(nd&&x.date<=nd) byNeed+=x.n;});
   var total=cum+undated,u=M.unit?' '+M.unit:'',L={cap:c,name:M.name,unit:M.unit,need:need,steps:steps,full:full,byNeed:byNeed,total:total,undated:undated,src:c.src||''};
   if(!rows.length){L.st='none';L.text=M.name+': '+need+u+' needed; no project delivers it yet';}
   else if(!full){L.st='partial';L.share=Math.min(1,(nd?byNeed:cum)/need);L.text=(nd?byNeed:cum)+' of '+need+u+(nd?' by the need date':'')+'; full capacity not yet planned ('+total+u+' in all'+(undated?', '+undated+' with no date':'')+')';}
   else if(!nd){L.st='ok';L.text='Full capacity by '+fyo(full,fyr)+' (no need date)';}
   else if(full<=nd){var sp=-gapMo(full,nd);L.st='ok';L.text='Full capacity by '+fyo(full,fyr)+(sp>0?' ('+sp+' mo spare)':' (on the date)');}
   else if(byNeed>0){L.st='partial';L.share=byNeed/need;L.text=byNeed+' of '+need+u+' by the need date; full capacity '+fyo(full,fyr);}
   else{var g=gapMo(full,nd);L.st=capStD(full,nd);L.text='Full capacity by '+fyo(full,fyr)+' (+'+g+' mo late)';}
   L.line=M.name+': '+L.text;out.push(L);});
  var part=out.filter(function(x){return x.st==='partial';});return {lines:out,partial:part.length>0,share:part.length?Math.min.apply(null,part.map(function(x){return x.share||0;})):1,any:out.length>0};}
 // A logged time in this computer's local time zone (logs are stored in UTC).
 function lt(iso){var d=new Date(iso);if(isNaN(d)) return String(iso||'').slice(0,16).replace('T',' ');var z=function(n){return String(n).padStart(2,'0');};return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())+' '+z(d.getHours())+':'+z(d.getMinutes());}
 window.CorbelDates={ORDER:ORDER,NAME:NAME,read:read,finish:finish,check:check,pick:pick,fd:fd,lt:lt,projFinish:projFinish,fyo:fyo,fmy:fmy,capability:capability,capacity:capacity,CAPM:CAPM,capMeta:capMeta,capSt:capSt,capStD:capStD,gapMo:gapMo,ruleText:ruleText,KIND:KIND,adamT:adamT};
})();

<script id="corbel-id">/* Corbel identity: one Service name, one installation name and one project number form across every tool,

// HANK closes projects out: turnover, the DD Form 1354 data, the warranty clock, the close-out checklist and lessons learned.
// Sources checked 18 Nov 2026: DD Form 1354 (AUG 2022, WHS forms site); UFC 1-300-08 (3 Apr 2023); FAR 52.246-21 (acquisition.gov).
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const today=()=>new Date().toLocaleDateString('en-CA');
const N=v=>{const x=Number(String(v??'').replace(/[$,]/g,''));return isFinite(x)?x:0;};
const M=n=>{const a=Math.abs(n);return (n<0?'-':'')+(a>=1e9?'$'+(a/1e9).toFixed(2)+'B':a>=1e6?'$'+(a/1e6).toFixed(a>=1e8?0:1)+'M':a>=1e3?'$'+Math.round(a/1e3)+'K':'$'+Math.round(a));};
const dd=(a,b)=>Math.round((new Date(b+'T00:00')-new Date(a+'T00:00'))/864e5);
const addD=(d,n)=>{const x=new Date(d+'T00:00');x.setDate(x.getDate()+n);return x.toLocaleDateString('en-CA');};
const addM=(d,n)=>{const x=new Date(d+'T00:00');x.setMonth(x.getMonth()+n);const z=k=>String(k).padStart(2,'0');return x.getFullYear()+'-'+z(x.getMonth()+1)+'-'+z(x.getDate());};
const addY=(d,n)=>{const x=new Date(d+'T00:00');x.setFullYear(x.getFullYear()+n);return x.toLocaleDateString('en-CA');};
const fd=d=>{if(!d) return '';const x=new Date(d+'T00:00');return isNaN(x)?d:x.getDate()+' '+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][x.getMonth()]+' '+x.getFullYear();};
const ymd=d=>String(d||'').replace(/-/g,'');
const SRC={form:'DD Form 1354, AUG 2022',ufc:'UFC 1-300-08 (3 Apr 2023)',war:'FAR 52.246-21',asof:'checked 18 Nov 2026'};
// Close-out checklist. Owner keys: dca (design and construction agent), co (contracting officer), ctr (contractor), rpao (real property accountable officer), pm (program office), user (facility user).
const OWN={dca:'Design and construction agent',co:'Contracting officer',ctr:'Contractor',rpao:'Real property accountable officer',pm:'Program office',user:'Facility user'};
const CHK=[['punch','Punch list and deficiencies corrected','ctr','Contract inspection clause; deficiencies listed in block 27 of the DD Form 1354'],
 ['d1354','Draft DD Form 1354 started once funding is authorized','dca',SRC.ufc+' ¶ 2-6.1.1, 3-1.2.1.1'],
 ['pis','Placed-in-service date recorded','dca',SRC.form+' block 7a'],
 ['i1354','Interim DD Form 1354 signed by the agent at placed-in-service, after substantial completion','dca',SRC.ufc+' ¶ 2-6.2.2, 3-1.2.1.1'],
 ['accept','Interim DD Form 1354 accepted into the property system (block 25)','rpao',SRC.ufc+' ¶ 3-1.4.2'],
 ['omsi','As-built drawings, O&M manuals and warranties delivered','ctr','Contract closeout submittals'],
 ['train','Operations and maintenance training given to the user','ctr','Contract closeout submittals'],
 ['final','Final acceptance of the work','co','Contract inspection and acceptance clauses'],
 ['war','Warranty period tracked from final acceptance (or from possession of any part)','pm',SRC.war+' (b)'],
 ['winsp','Warranty inspection before the warranty ends','dca','Practice: inspect before the one-year warranty ends'],
 ['costs','Final costs known','dca',SRC.ufc+' ¶ 2-6.3.1; aim for the fiscal quarter of the placed-in-service date (¶ 4-1.28)'],
 ['f1354','Final DD Form 1354 at project close-out','dca',SRC.ufc+' ¶ 2-6.3.1, 3-1.2.1.3'],
 ['finpay','Final payment: completion and acceptance of all work, a proper voucher, and the contractor’s release of claims','co','FAR 52.232-5(h)'],
 ['funds','Contract funds reviewed and excess funds deobligated; released funding reported to the program office','pm','FAR 4.804-5(a); funding lines in PAULA'],
 ['file','Contract file closed: within 6 months of physical completion for a firm-fixed-price contract','co','FAR 4.804-1(a)(2), 4.804-5'],
 ['lessons','Lessons learned recorded','pm','Program office practice']];
const LCAT=[['req','Requirement','NORA'],['alt','Alternatives and economics','EARL'],['cost','Cost and the 1391','PIPER'],['crit','Criteria','CORA'],['sow','Statement of work and acquisition','SOPHIE'],['rfi','RFIs and submittals','IRMA'],['qa','Quality and inspections','QUINN'],['sched','Schedule','PAULA'],['stake','Stakeholders and coordination','PAULA']];

const DEF={schema:'hank-1',items:{},lessons:[],me:'',warn:60,log:[]};
let G=load()||JSON.parse(JSON.stringify(DEF));let VIEW='list',CUR=null,TAB='dates';
function load(){try{const j=JSON.parse(localStorage.getItem('hank_portfolio')||'null');if(j){j.items=j.items||{};j.lessons=j.lessons||[];j.log=j.log||[];j.warn=j.warn||60;}return j;}catch(e){return null;}}
let saveT=null;
function save(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem('hank_portfolio',JSON.stringify(G));
 // Lessons go to a shared list the other Corbel tools can read.
 localStorage.setItem('corbel_lessons',JSON.stringify(G.lessons.map(l=>({...l,from:'HANK'}))));$('#saved').textContent='Saved in this browser '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});}catch(e){$('#saved').textContent='Not saved – use Save file';}},250);}
function log(w,d){G.log.push({at:new Date().toISOString(),what:w,detail:d||''});G.log=G.log.slice(-300);}
// ---------- projects from PAULA and the shared record ----------
function projects(){let pa=null,st=null;try{pa=JSON.parse(localStorage.getItem('paula_project')||'null');}catch(e){}try{st=JSON.parse(localStorage.getItem('milcon_store')||'null');}catch(e){}
 // one entry per project, as PAULA merges them: the same number, or the same name (any case or punctuation) at the same installation with no conflicting number
 const nz=t=>String(t||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim(),nn=t=>String(t||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
 const same=(a,b)=>{const n1=nn(a.number),n2=nn(b.number);if(n1&&n2) return n1===n2;const ia=nz(a.installation),ib=nz(b.installation);return !!nz(a.name)&&nz(a.name)===nz(b.name)&&(!ia||!ib||ia===ib);};
 const L=[];(pa&&pa.projects||[]).filter(p=>p.name).forEach(p=>{if(!L.some(q=>same(q,p))) L.push({...p});});
 // the shared record's copy of a PAULA project is the same project: one entry, under the id HANK already holds data for (else the record's, which the other tools use)
 Object.values(st&&st.projects||{}).forEach(r=>{const c=r.core||{};if(!c.name||L.some(p=>p.id===r.id)) return;const k=L.findIndex(p=>same(p,c));

  L.push({id:r.id,...c,phase:c.phase||1});});return L;}

// Default design and construction agent by place (the DoD construction agent there), then by Service. Change it on the DD Form 1354 tab when the project used another agent.
function dcaFor(p){const svc=String(p.service||'').toLowerCase(),loc=String(p.installation||'').toLowerCase()+' '+String(p.country||'').toLowerCase();const navy=/navy|marine/.test(svc);
 if(/guam|cnmi|northern mariana|tinian|saipan|rota/.test(loc)) return 'NAVFAC Marianas';

 if(/japan|okinawa|kadena|yokota|misawa|iwakuni|yokosuka|sasebo|atsugi|futenma|zama|hansen|schwab|foster|butler/.test(loc)) return navy?'NAVFAC Far East':'USACE Japan District';
 if(/korea|humphreys|osan|kunsan|daegu|chinhae/.test(loc)) return 'USACE Far East District';
 if(/alaska|eielson|elmendorf|jber|wainwright|clear/.test(loc)) return 'USACE Alaska District';
 if(/kwajalein|marshall|wake/.test(loc)) return navy?'NAVFAC Pacific':'USACE Honolulu District';

function rec(p){if(!G.items[p.id]) G.items[p.id]={pid:p.id,dates:{},chk:{},dd:{lines:[]},notes:''};const r=G.items[p.id];r.dates=r.dates||{};r.chk=r.chk||{};r.dd=r.dd||{lines:[]};r.dd.lines=r.dd.lines||[];return r;}
// QUINN: open deficiencies on the project's task order.
function quinnOpen(p){let q=null;try{q=JSON.parse(localStorage.getItem('quinn_project')||'null');}catch(e){}if(!q) return null;const to=String(p.to||'').trim().toLowerCase();
 // by task order, or by the suite project the QUINN entries were made under
 const bl=(q.registry||[]).filter(r=>(to&&String(r.to||'').trim().toLowerCase()===to)||r.pid===p.id).map(r=>r.building);if(!bl.length&&!(q.issues||[]).some(i=>i.pid===p.id)) return null;const iss=(q.issues||[]).filter(i=>bl.includes(i.building)||i.pid===p.id);return {open:iss.filter(i=>i.status!=='closed'),all:iss,buildings:bl};}
// Warranty: one year from final acceptance; a part the Government took possession of earlier runs one year from possession (FAR 52.246-21(b)).
function warranty(r){const fa=r.dates.final,pos=r.dates.possession;const X=(r.wx||[]).filter(w=>w.what&&(w.start||(w.from==='final'&&fa)||(w.from==='pis'&&r.dates.pis))&&Number(w.years)>0);if(!fa&&!pos&&!X.length) return null;const L=[];if(pos&&(!fa||pos<fa)) L.push({what:'Parts in Government possession from '+fd(pos),start:pos,end:addY(pos,1)});if(fa) L.push({what:'The work, from final acceptance',start:fa,end:addY(fa,1)});
 // Longer warranties the contract or a manufacturer gives (roofing, equipment), counted from the date you set.
 X.forEach(w=>{const st=w.start||(w.from==='final'?fa:r.dates.pis);const y=Number(w.years);L.push({what:w.what+' ('+(y%1?y:y)+'-year'+(w.basis?', '+w.basis:'')+')',start:st,end:addM(st,Math.round(y*12)),ext:true});});
 const up=L.filter(x=>x.end>=today()).sort((a,b)=>a.end.localeCompare(b.end));const first=up[0]||L.slice().sort((a,b)=>b.end.localeCompare(a.end))[0];const last=L.slice().sort((a,b)=>b.end.localeCompare(a.end))[0];return {L,first,last,left:dd(today(),first.end)};}
function chkState(p,r,k){const s=r.chk[k]||{};if(s.st) return s;
 // Worked out from the record where it can be.
 if(k==='pis'&&r.dates.pis) return {st:'done',date:r.dates.pis,auto:'From the dates tab'};
 if(k==='final'&&r.dates.final) return {st:'done',date:r.dates.final,auto:'From the dates tab'};
 if(k==='war'&&r.dates.final) return {st:'done',date:r.dates.final,auto:'Warranty clock running'};
 if(k==='d1354'&&r.dd.draft) return {st:'done',date:r.dd.draft,auto:'Draft started date'};
 if(k==='closeout'&&r.dates.closeout) return {st:'done',date:r.dates.closeout,auto:'From the dates tab'};
 if(k==='i1354'&&r.dd.interim) return {st:'done',date:r.dd.interim,auto:'Interim signed date'};
 if(k==='accept'&&r.dd.accepted) return {st:'done',date:r.dd.accepted,auto:'Accepted date'};
 if(k==='f1354'&&r.dd.finalDate) return {st:'done',date:r.dd.finalDate,auto:'Final 1354 date'};

 if(k==='punch'){const q=quinnOpen(p);if(q) return q.open.length?{st:'open',auto:q.open.length+' open deficienc'+(q.open.length===1?'y':'ies')+' in QUINN'}:{st:'done',auto:'No open deficiencies in QUINN'};}

 (T.sup||[]).forEach(x=>{if(!(N(x.qty)&&N(x.unit))) return;L.push({cat:'',catd:String(x.item||'').split(' – ')[0].slice(0,80),uma:x.um||'',q1:String(N(x.qty)),cost:String(Math.round(N(x.qty)*N(x.unit))),sup:true});});

 const open=P.flatMap(p=>{const r=rec(p);if(!r.dates.pis&&!r.dates.subst) return [];return CHK.filter(([k])=>!['done','na'].includes(chkState(p,r,k).st)).map(([k,n,o,src])=>[esc(p.name),esc(n),esc((r.chk[k]||{}).who||(o==='dca'?dcaFor(p):OWN[o])),esc(src)]);});
 if(window.CorbelDates){const di=P.flatMap(p=>CorbelDates.check(p,G).map(x=>[esc(p.name),esc(x.text)]));if(di.length) b+=cdH('Dates that don’t add up')+cdP('Settle these on the project’s Turnover dates tab in HANK or the Milestones tab in PAULA; both tools read the same record.')+cdTable(['Project','Problem'],di);}

 b+=cdH('Sources')+cdP(esc(SRC.form)+' (block labels); '+esc(SRC.ufc)+' (draft, interim and final versions, who prepares and accepts); '+esc(SRC.war)+' (warranty period); '+esc(SRC.asof)+'. Service deadlines for the final DD Form 1354 follow each Service’s own timeline.','font-size:9pt');
 b+=cdFoot(''+fdt()+'  ·  Advisory; the contracting officer and the real property accountable officer decide.');return cdDoc('Close-out and Turnover',[b]);}

 {name:'Sources',rows:[['Source','Used for'],[SRC.form,'Block numbers and labels'],[SRC.ufc,'Draft, interim and final DD Form 1354; who prepares and accepts'],[SRC.war,'Warranty period'],['Checked','18 Nov 2026']]}];}

<script id="corbel-lib">
// ---------- Corbel Word forms: one look for every printed sheet ----------
// Word reads this HTML as a document. Georgia stands in for the site's serif; colors are the site's.
// Styles are written inline so Word and other word processors render them the same way.
const CD={navy:'#1B2F4E',deep:'#0F1E36',gold:'#E8D5A8',taupe:'#8B6F3D',taupe2:'#5C4A33',rule:'#C9B998',ink:'#1A1410',tint:'#F6F1E7',tint2:'#FBF8F2',mute:'#7A7065'};
const CDF='font-family:Georgia,\'Times New Roman\',serif;';
const CDK=CDF+'font-size:7.5pt;letter-spacing:2pt;text-transform:uppercase;color:'+CD.taupe+';';
function cdDoc(title,pages,landscape){const sz=landscape?'11.0in 8.5in;mso-page-orientation:landscape':'8.5in 11.0in';
 return '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><title>'+esc(title)+'</title>'+
 '<!--[if gte mso 9]><xml><w:WordDocument><w:View>Print</w:View><w:Zoom>100</w:Zoom><w:DoNotOptimizeForBrowser/></w:WordDocument></xml><![endif]-->'+
 '<style>@page Section1{size:'+sz+';margin:0.6in 0.7in 0.6in 0.7in}div.Section1{page:Section1}body{'+CDF+'font-size:10.5pt;color:'+CD.ink+'}p{margin:0 0 6pt}table{border-collapse:collapse}td{vertical-align:top}</style></head>'+
 '<body style="'+CDF+'font-size:10.5pt;color:'+CD.ink+'"><div class="Section1">'+pages.join('<br clear="all" style="page-break-before:always;mso-break-type:page-break">')+'</div></body></html>';}
function cdP(t,st){return '<p style="'+CDF+'margin:0 0 6pt;'+(st||'')+'">'+t+'</p>';}
// Writing lines: a small table of underlined rows works in every word processor.
function cdLines(n,bg){return '<table width="100%" cellpadding="0" cellspacing="0" style="width:100%;border-collapse:collapse">'+Array(n).fill('<tr><td height="24" style="height:18pt;border-bottom:0.75pt solid '+CD.rule+(bg?';background:'+bg:'')+'"'+(bg?' bgcolor="'+bg+'"':'')+'>&nbsp;</td></tr>').join('')+'</table>';}
// The navy band at the top of each page.
function cdBand(kind,title,sub,chip){return '<table width="100%" cellpadding="14" cellspacing="0" style="width:100%;border-collapse:collapse"><tr><td bgcolor="'+CD.navy+'" style="background:'+CD.navy+';padding:14pt 16pt">'+
 cdP(esc(kind).toUpperCase(),'margin:0 0 6pt;font-size:7.5pt;letter-spacing:2.5pt;color:'+CD.gold)+
 cdP(esc(title),'margin:0;font-size:20pt;line-height:120%;color:#FFFFFF')+(sub?cdP(esc(sub),'margin:5pt 0 0;font-size:9.5pt;font-style:italic;color:'+CD.gold):'')+'</td></tr></table>'+
 '<table width="100%" cellpadding="0" cellspacing="0" style="width:100%;border-collapse:collapse"><tr><td height="4" bgcolor="'+CD.gold+'" style="height:3pt;background:'+CD.gold+';font-size:2pt;line-height:2pt">&nbsp;</td></tr></table>'+
 (chip?'<table cellpadding="4" cellspacing="0" style="border-collapse:collapse;margin-top:8pt"><tr><td bgcolor="'+CD.tint+'" style="background:'+CD.tint+';border:0.75pt solid '+CD.rule+';padding:3pt 8pt">'+cdP(esc(chip).toUpperCase(),'margin:0;font-size:8pt;letter-spacing:1.5pt;color:'+CD.navy)+'</td></tr></table>':'');}
// Name / title / date boxes.
function cdWho(fields){return '<table width="100%" cellpadding="0" cellspacing="0" style="width:100%;border-collapse:collapse;margin-top:10pt"><tr>'+fields.map((f,i)=>'<td width="'+Math.floor(100/fields.length)+'%" style="padding:0 '+(i<fields.length-1?'14pt':'0')+' 0 0">'+cdP(esc(f).toUpperCase(),CDK+'margin:0 0 4pt')+cdLines(1)+'</td>').join('')+'</tr></table>';}
function cdLead(t){return cdP(t,'margin:12pt 0 4pt;font-style:italic;color:'+CD.taupe2);}
function cdH(t){return cdP(esc(t),'margin:16pt 0 2pt;font-size:13pt;color:'+CD.navy)+'<table width="100%" cellpadding="0" cellspacing="0" style="width:100%;border-collapse:collapse;margin-bottom:8pt"><tr><td height="2" style="height:1pt;border-top:0.75pt solid '+CD.gold+';font-size:1pt">&nbsp;</td></tr></table>';}
// "What we have so far": tinted rows with tick boxes.
function cdKnown(rows){return '<table width="100%" cellpadding="6" cellspacing="0" style="width:100%;border-collapse:collapse">'+rows.map(([a,b],i)=>{const bg=i%2?CD.tint2:CD.tint;const td=(w,c)=>'<td'+(w?' width="'+w+'"':'')+' bgcolor="'+bg+'" style="background:'+bg+';padding:6pt 8pt;border-bottom:0.5pt solid '+CD.rule+'">'+c+'</td>';
  return '<tr>'+td('24%',cdP(esc(a).toUpperCase(),CDK+'margin:0'))+td('',cdP(esc(b),'margin:0'))+td('28%',cdP('&#9744; Correct &nbsp; &#9744; Change:','margin:0;font-size:9pt;color:'+CD.taupe2))+'</tr>';}).join('')+'</table>';}
// One question: number and question, then a ruled answer box with a gold edge.
function cdQ(n,q,code,lines){lines=lines||4;return '<table width="100%" cellpadding="0" cellspacing="0" style="width:100%;border-collapse:collapse;margin:0 0 12pt;page-break-inside:avoid"><tr><td style="padding:0">'+
 cdP('<span style="font-size:15pt;color:'+CD.taupe+'">'+n+'</span>&nbsp;&nbsp;'+esc(q),'margin:0 0 5pt;font-size:11pt;color:'+CD.navy)+
 '<table width="100%" cellpadding="0" cellspacing="0" style="width:100%;border-collapse:collapse"><tr><td bgcolor="'+CD.tint2+'" style="background:'+CD.tint2+';border-left:2.25pt solid '+CD.gold+';padding:2pt 10pt 8pt 10pt">'+cdLines(lines,CD.tint2)+'</td></tr></table></td></tr></table>';}
// A data table with a navy header row and tinted stripes.
function cdTable(head,rows,widths){return '<table width="100%" cellpadding="6" cellspacing="0" style="width:100%;border-collapse:collapse;margin:4pt 0">'+
 '<tr>'+head.map((h,i)=>'<td bgcolor="'+CD.navy+'"'+(widths&&widths[i]?' width="'+widths[i]+'"':'')+' style="background:'+CD.navy+';padding:5pt 7pt">'+cdP(esc(h).toUpperCase(),'margin:0;font-size:7.5pt;letter-spacing:1.5pt;color:'+CD.gold)+'</td>').join('')+'</tr>'+
 rows.map((r,j)=>{const bg=j%2?CD.tint2:'#FFFFFF';return '<tr>'+r.map((c,i)=>'<td bgcolor="'+bg+'"'+(widths&&widths[i]?' width="'+widths[i]+'"':'')+' style="background:'+bg+';padding:6pt 7pt;border-bottom:0.5pt solid '+CD.rule+'">'+cdP(c,'margin:0;font-size:9.5pt')+'</td>').join('')+'</tr>';}).join('')+'</table>';}
function cdFoot(t){return '<table data-keepprev="1" width="100%" cellpadding="0" cellspacing="0" style="width:100%;border-collapse:collapse;margin-top:16pt"><tr><td style="border-top:0.75pt solid '+CD.gold+';padding:6pt 0 0">'+cdP(t,'margin:0;font-size:8pt;color:'+CD.mute)+'</td></tr></table>';}

 async function post(path,body){var waits=[1500,4000],last;for(var i=0;i<=waits.length;i++){try{return await post1(path,body);}catch(e){last=e;if(!e.retry||i===waits.length) throw e;await new Promise(function(r){setTimeout(r,waits[i]);});}}throw last;}
 async function post1(path,body){var r;try{r=await fetch(BASE+path,{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});}catch(e){var ne=new Error('No connection to CARL ('+(e.message||'network error')+')');ne.retry=true;throw ne;}
  var t=await r.text(),j={};try{j=JSON.parse(t);}catch(e){}
  if(r.status===401) throw new Error('Your sign-in has ended. Sign in again (Face ID), then reload this page.');
  // A long answer is streamed with a 200 up front, so CARL puts the real status in the body as _status.
  var st=r.ok&&j&&+j._status>=400?+j._status:r.status;
  if(st===401) throw new Error('Your sign-in has ended. Sign in again (Face ID), then reload this page.');
  if(!r.ok||st>=400){var he=new Error(j.error||('CARL HTTP '+st));he.retry=(st===429||st>=500)&&!/max_tokens|cut off/i.test(he.message);throw he;}return j;}
 // House style for every AI answer: no em dashes (an en dash takes their place), the same rule the templates follow.
 function noEm(v){if(typeof v==='string') return v.replace(/\s*\u2014\s*/g,' \u2013 ');if(Array.isArray(v)) return v.map(noEm);if(v&&typeof v==='object'){var o={};Object.keys(v).forEach(function(k){o[k]=noEm(v[k]);});return o;}return v;}
 // engine: 'claude' | 'gemini' | 'fast'. Returns the model's JSON object.
 // Engines are named for their job on screen; which service runs each stays here.
 var ENG={'reader-a':'claude','reader-b':'gemini','reviewer':'claude'};
 async function ask(engine,sys,user,images,opt){opt=opt||{};engine=ENG[engine]||engine;engine=/gemini/i.test(engine)?'gemini':/fast/i.test(engine)?'fast':'claude';
  var key=h(engine+'\u0001'+(sys||'')+'\u0001'+(user||'')+'\u0001'+((images||[]).join('').length));
  if(!opt.fresh){var c=cGet(key);if(c){useAdd('ai',null,true);return noEm(c);}}
  if(!cuiOk()) throw new Error('Cancelled – nothing was sent.');
  var j=await post('/api/assist',{engine:engine,system:sys||'',user:user||'',images:(images||[]).slice(0,8),tool:TOOL()});
  if(!j.result||typeof j.result!=='object') throw new Error('CARL returned no JSON');
  var res=noEm(j.result);useAdd('ai',j.usage,false);cPut(key,res);return res;}
 // Verbatim passages from CARL's library: [{src,section,page,text,rank,tier,doc}]. o.collection 'programming' searches the programming store (statutes, FMR, budget books) instead of the inspection library.
 async function library(query,k,o){if(!cuiOk()) throw new Error('Cancelled – nothing was sent.');var b={query:String(query||'').slice(0,2000),k:k||8,tool:TOOL()};if(o&&o.collection) b.collection=o.collection;var j=await post('/api/library',b);useAdd('library');return j.passages||[];}
 function usageText(){var U=useGet()[proj()]||{},L=[];Object.keys(U).forEach(function(t){var r=U[t];L.push(t+': '+r.calls+' AI calls ('+Math.round((r.in+r.out)/1000)+'K tokens), '+r.cached+' from cache, '+r.library+' library searches');});return L.length?L.join('\n'):'No CARL AI use in this project yet.';}
 function badge(){var bar=document.getElementById('msbar')||document.body,b=document.getElementById('carlai');
  if(!b){b=document.createElement('span');b.id='carlai';b.style.cssText='margin-left:auto;font-size:12px;padding:2px 8px;border-radius:10px;white-space:nowrap;cursor:default'+(bar===document.body?';position:fixed;right:14px;bottom:12px;z-index:50;box-shadow:0 1px 4px rgba(0,0,0,.2)':'');bar.appendChild(b);
   b.onclick=function(e){if(e.target.tagName==='A') return;alert('CARL AI use in this project, this browser:\n\n'+usageText());};}
  if(!badge.obs&&window.MutationObserver&&bar!==document.body){badge.obs=new MutationObserver(function(){if(!document.getElementById('carlai')) badge();});badge.obs.observe(bar,{childList:true});}
  b.style.background=ST.ok?'#e3f4e3':'#f1f1f1';b.style.color=ST.ok?'#0b6b0b':'#555';
  b.innerHTML=ST.ok?'AI: CARL ✓'+(ST.user?' ('+String(ST.user).replace(/[<&]/g,'')+')':''):'AI: <a href="'+BASE+'/auth/corbel?r='+encodeURIComponent(location.pathname)+'" target="_blank" rel="noopener">sign in again (Face ID)<\/a>, then reload';
  b.title=ST.ok?'Click for AI use in this project':ST.msg;}
 window.CARLAI={ask:ask,library:library,base:BASE,state:function(){return ST;},ready:function(f){if(ST.ok!==null) f(ST);else READY.push(f);},usage:usageText};

 // ---- tools with AI settings (SCOTT, NORA, SOPHIE, IRMA): CARL as a provider
 if(typeof callAI==='function'&&typeof loadSettings==='function'){
  var LABEL='CARL – shared AI (included with your sign-in)';
  try{var ent=Object.entries(PROVIDERS);Object.keys(PROVIDERS).forEach(function(k){delete PROVIDERS[k];});PROVIDERS.carl=LABEL;ent.forEach(function(e){if(e[0]!=='carl') PROVIDERS[e[0]]=e[1];});}catch(e){}
  var DEF=function(){return [{provider:'carl',label:'Reader A',role:'reader',model:'reader-a',enabled:true},{provider:'carl',label:'Reader B',role:'reader',model:'reader-b',enabled:true},{provider:'carl',label:'Reviewer',role:'arbiter',model:'reviewer',enabled:true}];};
  var _load=loadSettings,_save=typeof saveSettings==='function'?saveSettings:null,_call=callAI,_base=typeof defaultBase==='function'?defaultBase:null;
  loadSettings=function(){var s=_load();
   if(!s.slots.some(function(x){return x.key||x.provider==='carl';})) s.slots=DEF().map(function(d,i){return Object.assign({},SLOT_DEF,s.slots[i]||{},d,{key:''});});
   s.slots.forEach(function(x){if(x.provider==='carl'){if(x.role==='arbiter'){x.model='reviewer';x.label='Reviewer';}else if(/gemini|reader-b/i.test(x.model)){x.model='reader-b';x.label='Reader B';}else{x.model='reader-a';x.label='Reader A';}}});
   s.slots.forEach(function(x){if(x.provider==='carl'&&x.enabled&&ST.ok!==true){x.enabled=false;x._carlOff=true;}});return s;};
  if(_save) saveSettings=function(){var off=SET.slots.filter(function(x){return x._carlOff&&!x.enabled;});off.forEach(function(x){x.enabled=true;});try{return _save.apply(this,arguments);}finally{off.forEach(function(x){x.enabled=false;});}};
  if(_base) defaultBase=function(p){return p==='carl'?'carl.carlcompliance.com':_base(p);};
  callAI=async function(slot,sys,user,images){if(slot.provider!=='carl') return _call.apply(this,arguments);
   // The connection test goes to the quick tier; real work stays on the slot's model.
   var test=sys==='Reply with JSON only.'&&/"ok":true/.test(user||'');return ask(test?'fast':slot.model,sys,user,images,{fresh:test});};
 }
 fetch(BASE+'/api/assist',{credentials:'include'}).then(function(r){return r.json().catch(function(){return {};}).then(function(j){
   if(r.ok&&j.ok) ST={ok:true,user:j.user||'',msg:'Signed in'};
   else ST={ok:false,msg:r.status===401?'Sign-in ended – sign in again (Face ID)':(j.error||('CARL HTTP '+r.status))};});})
  .catch(function(){ST={ok:false,msg:'CARL could not be reached'};})
  .then(function(){try{if(typeof loadSettings==='function'&&typeof SET!=='undefined') SET=loadSettings();}catch(e){}try{if(typeof renderEngines==='function') renderEngines();}catch(e){}
   READY.splice(0).forEach(function(f){try{f(ST);}catch(e){}});
   // Redraw once so the tool's own text reflects CARL being available.
   if(ST.ok&&typeof render==='function'&&typeof callAI!=='function'){try{render();}catch(e){}}
   if(ST.ok&&typeof render==='function'&&typeof callAI==='function'&&window.MS_TOOL==='irma'){try{render();}catch(e){}}
   if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',badge);else badge();});
 // Connecting other AI services (the .mil build's GenAI.mil, for one) is an administrator task.
 function gate(){var adm=false;try{adm=localStorage.getItem('carl_ai_admin')==='1';}catch(e){}var b=document.getElementById('bSettings');if(b&&!adm) b.style.display='none';}
 if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',gate);else gate();
})();
